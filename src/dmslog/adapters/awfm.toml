fields = { gid = "int" }
keys = ["gid"]
examples = [{ msg = "Request with GID 288230376151711744 removed.", fields = { gid = 288230376151711744 } }]
counter_examples = ["New request with GID 288230376151711744 added. Current state: 1 request on hold: 288230376151711744."]

[[template]]
code = "WFM-128"
class = "validation"
title = "Request not found in synchronizer"
