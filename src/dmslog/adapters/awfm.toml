# Templates of the WfmAdapter (family AWFM): SOAP server that receives crews, vehicles and crew
# assignments from the WFM/SGE system and writes them to CRS/IMS/WMS (DMS side).
#
# Sources: docs/formato/wfm-ont.md (catalog, WFM-xxx) and docs/formato/payloads.md (Info/Verbose
# window, WFM-11x..13x and the sensitive/normal payloads). Examples are synthetic.
#
# Not defined here on purpose (they live in _common.toml, with these old IDs as aliases):
#   WFM-020/021/022 connections, WFM-050/051 "Detected errors" (normal and sensitive), WFM-052
#   system event, WFM-061 "Non Fatal Exception", WFM-090 statistics, WFM-099 debug level,
#   WFM-100 "Message ... logged in sensitive log", map open/close markers (GEN-MAP-01),
#   subscriber life cycle (GEN-SUB-01), Communication2 tracing, ModeTracker, PSAttach, proxies,
#   XSD validation, map entries, and the "Message content: <root>" payload (GEN-PLD-01).
#
# Letter suffixes (WFM-062A, WFM-125C) split one documented row into several templates because a
# template has one set of fields and one peer/role.
#
# Map dumps (WFM-001, 82% of the physical lines of the normal log): the record is classified by its
# first line and the `kv_tab` continuation parser only counts the `\t<key> - <gid>` lines
# (`items`); pairs are never kept. WFM-001 wins over GEN-MAP-01 for this family so that the dumps
# stay out of the full-text index (fts = false, sev 5).

schema = 1
family = "AWFM"
description = "WfmAdapter: crews, vehicles and crew assignments received from WFM (normal and sensitive logs)"
extends = ["_common"]

[payload_defaults]
request = { direction = "in", peer = "WFM" }
response = { direction = "out", peer = "WFM" }
fault = { direction = "out", peer = "WFM" }

# ---------------------------------------------------------------------------------------------
# Cache maps (open/close markers are GEN-MAP-01)
# ---------------------------------------------------------------------------------------------

[[template]]
code = "WFM-001"
class = "other"
title = "Map content dump"
sev = 5
fts = false
stream = "normal"
regex = '''^New "(?P<map>[^"]*)" map content:$'''
cont = "kv_tab"
keys = []
examples = [
    { msg = '''New "OMS_CREW_VEHICLE" map content:''', cont = "\tCREW0001 - 288230376151711744\n\tCREW0002 - 288230376151711745\n", fields = { map = "OMS_CREW_VEHICLE" } },
    '''New "OMS_VEHICLE" map content:''',
]
counter_examples = ['''"OMS_CREW_VEHICLE" map closed.''', '''"OMS_CREW_VEHICLE" map is now open.''']

# ---------------------------------------------------------------------------------------------
# Request life cycle (inbound SOAP): start, end, crew model
# ---------------------------------------------------------------------------------------------

[[template]]
code = "WFM-010"
window = 992  # worst case quadratic: see _schema.md, Regex safety
class = "start"
title = "Request received"
stream = "normal"
regex = '''^(?P<op>[A-Z][\w ]+?) request received\. Request with ID "(?P<request_id>[0-9a-fA-F-]{36})"\. Message content w\w+ in sensitive log\.$'''
fields = { request_id = "guid" }
keys = [{ field = "request_id", type = "msgid" }]
refs_sensitive = true
examples = [
    { msg = '''Changed crews request received. Request with ID "00000000-0000-4000-8000-00000000000A". Message content written in sensitive log.''', fields = { op = "Changed crews", request_id = "00000000-0000-4000-8000-00000000000a" } },
    { msg = '''Created crew assignments request received. Request with ID "00000000-0000-4000-8000-000000000002". Message content wirtten in sensitive log.''', fields = { op = "Created crew assignments" } },
    '''Deleted crew assignments request received. Request with ID "00000000-0000-4000-8000-000000000003". Message content wirtten in sensitive log.''',
]
counter_examples = [
    '''Changed crews request with ID "00000000-0000-4000-8000-000000000001" successfully processed.''',
    '''Changed crews request received. Request with ID "00000000-0000-4000-8000-000000000001" content:''',
]

[[template]]
code = "WFM-S010"
class = "start"
title = "Request received (sensitive summary)"
stream = "sensitive"
regex = '''^(?P<op>[A-Z][\w ]+?) request received\. Request with ID "(?P<request_id>[0-9a-fA-F-]{36})" content:$'''
fields = { request_id = "guid" }
keys = [{ field = "request_id", type = "msgid" }]
cont = { parser = "kv_colon", max_items = 32 }
examples = [
    { msg = '''Changed crews request received. Request with ID "00000000-0000-4000-8000-000000000001" content:''', cont = "Identifier: CREW0001\nAvailability: Available\nFcConnectionStatus: Online\n", fields = { op = "Changed crews", request_id = "00000000-0000-4000-8000-000000000001" } },
]
counter_examples = [
    '''Changed crews request received. Request with ID "00000000-0000-4000-8000-000000000001". Message content written in sensitive log.''',
]

[[template]]
code = "WFM-011"
class = "start"
title = "Crew model request received"
regex = '''^Created crew model request with ID "(?P<request_id>[0-9a-fA-F-]{36})" received\.$'''
fields = { request_id = "guid" }
keys = [{ field = "request_id", type = "msgid" }]
examples = [
    { msg = '''Created crew model request with ID "00000000-0000-4000-8000-000000000004" received.''', fields = { request_id = "00000000-0000-4000-8000-000000000004" } },
]
counter_examples = ['''Created crew assignments request with ID "00000000-0000-4000-8000-000000000004" successfully processed.''']

[[template]]
code = "WFM-012"
class = "end"
title = "Request successfully processed"
regex = '''^(?P<op>[A-Z][\w ]+?) request with ID "(?P<request_id>[0-9a-fA-F-]{36})" successfully processed\.$'''
fields = { request_id = "guid" }
keys = [{ field = "request_id", type = "msgid" }]
examples = [
    { msg = '''Changed vehicles request with ID "00000000-0000-4000-8000-000000000005" successfully processed.''', fields = { op = "Changed vehicles", request_id = "00000000-0000-4000-8000-000000000005" } },
    '''Deleted crew assignments request with ID "00000000-0000-4000-8000-000000000006" successfully processed.''',
]
counter_examples = [
    '''Changed vehicles request received. Request with ID "00000000-0000-4000-8000-000000000005". Message content written in sensitive log.''',
]

[[template]]
code = "WFM-013"
class = "lifecycle"
title = "Synchronous crew model processing"
regex = '''^Synchronous processing of ReceiveCrewModel request - (?P<phase>started|finished)\.$'''
examples = [
    { msg = "Synchronous processing of ReceiveCrewModel request - started.", fields = { phase = "started" } },
    { msg = "Synchronous processing of ReceiveCrewModel request - finished.", fields = { phase = "finished" } },
]
counter_examples = ["Synchronous processing of ReceiveCrewModel request - paused."]

[[template]]
code = "WFM-014"
class = "other"
title = "Crew model comparison started"
regex = '''^Comparing received External System (?P<entity>\w+) with existing ADMS (?P<adms_entity>\w+)\.\.\.$'''
examples = [
    { msg = "Comparing received External System Crews with existing ADMS Crews...", fields = { entity = "Crews", adms_entity = "Crews" } },
    { msg = "Comparing received External System Organizations with existing ADMS Companies...", fields = { entity = "Organizations", adms_entity = "Companies" } },
]
counter_examples = ["Entity comparing finished. Result: Insert operations: 1, Update operations: 0, Delete operations 0. There're 5 identical entities which have no defined operations."]

[[template]]
code = "WFM-015"
class = "other"
title = "Crew model comparison result"
regex = '''^Entity comparing finished\. Result: Insert operations: (?P<inserts>\d+), Update operations: (?P<updates>\d+), Delete operations:? (?P<deletes>\d+)\. There're (?P<identical>\d+) identical entities.*$'''
fields = { inserts = "int", updates = "int", deletes = "int", identical = "int" }
examples = [
    { msg = "Entity comparing finished. Result: Insert operations: 1, Update operations: 2, Delete operations 3. There're 40 identical entities which have no defined operations.", fields = { inserts = 1, updates = 2, deletes = 3, identical = 40 } },
]
counter_examples = ["Comparing received External System Crews with existing ADMS Crews..."]

[[template]]
code = "WFM-016"
class = "lifecycle"
title = "Crew model updated"
text = "Crew model successfully updated in ADMS."
examples = ["Crew model successfully updated in ADMS."]
counter_examples = ["Crew model update failed in ADMS."]

# ---------------------------------------------------------------------------------------------
# Callbacks (CRS/IMS answer to a delta or request sent by the adapter)
# ---------------------------------------------------------------------------------------------

[[template]]
code = "WFM-030"
class = "req_resp"
title = "Callback received"
stream = "normal"
text = "Callback received:"
cont = { parser = "line_regex", regex = '''^(?P<cb_type>\w+) GID: (?P<gid>\d+),(?: Errors count: (?P<errors>\d+)\.?)?(?: For Status value check sensitive log\.| Status value: (?P<status>.*))?$''' }
fields = { gid = "int", errors = "int" }
keys = ["gid"]
refs_sensitive = true
examples = [
    { msg = "Callback received:", cont = "OMS_CREW_CHANGE_REQ GID: 288230376151711744, Errors count: 0. For Status value check sensitive log.", fields = { cb_type = "OMS_CREW_CHANGE_REQ", gid = 288230376151711744, errors = 0 } },
    { msg = "Callback received:", cont = "OMS_REQUEST GID: 288230376151711745, Status value: Approved", fields = { cb_type = "OMS_REQUEST", gid = 288230376151711745, status = "Approved" } },
]
counter_examples = ["Callback received", "Callback received: OMS_CREW_CHANGE_REQ"]

[[template]]
code = "WFM-S030"
class = "req_resp"
title = "Callback received (sensitive, with status)"
stream = "sensitive"
regex = '''^Callback received:$'''
cont = { parser = "line_regex", regex = '''^(?P<cb_type>\w+) GID: (?P<gid>\d+),(?: Errors count: (?P<errors>\d+)\.?)?(?: For Status value check sensitive log\.| Status value: (?P<status>.*))?$''' }
fields = { gid = "int", errors = "int" }
keys = ["gid"]
examples = [
    { msg = "Callback received:", cont = "OMS_CREW_CHANGE_REQ GID: 288230376151711744, Errors count: 0 Status value: Accepted", fields = { cb_type = "OMS_CREW_CHANGE_REQ", gid = 288230376151711744, errors = 0, status = "Accepted" } },
]
counter_examples = ["Callback received", "Callback received: OMS_CREW_CHANGE_REQ"]

# ---------------------------------------------------------------------------------------------
# Validation notices and errors
# ---------------------------------------------------------------------------------------------

[[template]]
code = "WFM-040"
class = "validation"
title = "AlternateRadioID ignored"
sev = 4
regex = '''^\[Info\] AlternateRadioID value will be ignored for vehicle with MRID '(?P<mrid>.*)\.$'''
keys = ["mrid"]
examples = [
    { msg = "[Info] AlternateRadioID value will be ignored for vehicle with MRID 'TST1A23.", fields = { mrid = "TST1A23" } },
    { msg = "[Info] AlternateRadioID value will be ignored for vehicle with MRID '123-4.", fields = { mrid = "123-4" } },
]
counter_examples = ["[Info] Vehicle crew data will be ignored for vehicle with MRID 'TST1A23."]

[[template]]
code = "WFM-041"
class = "validation"
title = "Vehicle crew data ignored"
sev = 4
regex = '''^\[Info\] Vehicle crew data will be ignored for vehicle with MRID '(?P<mrid>.*)\.$'''
keys = ["mrid"]
examples = [
    { msg = "[Info] Vehicle crew data will be ignored for vehicle with MRID 'TST1A23.", fields = { mrid = "TST1A23" } },
]
counter_examples = ["[Info] AlternateRadioID value will be ignored for vehicle with MRID 'TST1A23."]

[[template]]
code = "WFM-060"
class = "error"
title = "Unable to execute remote method"
sev = 2
regex = '''^Unable to execute (?P<method>\w+) at (?P<service>\w+)\. Reason = (?P<reason>.*)$'''
examples = [
    { msg = "Unable to execute ApplyDelta at CRSBusinessService. Reason = Cannot access a disposed object.", cont = "Object name: 'System.Net.Sockets.Socket'.\n", fields = { method = "ApplyDelta", service = "CRSBusinessService", reason = "Cannot access a disposed object." } },
    { msg = "Unable to execute GetDescendentValues at OMSBusinessService. Reason = Cannot access a disposed object.", fields = { service = "OMSBusinessService" } },
]
counter_examples = ["Unable to execute", "Non Fatal Exception System.ObjectDisposedException: Cannot access a disposed object."]

[[template]]
code = "WFM-062A"
class = "lifecycle"
title = "Creating new dal proxy"
regex = '''^Creating new dal proxy\.(?: ServiceName = (?P<service>\w+), Alias = (?P<alias>\w+))?$'''
examples = [{ msg = "Creating new dal proxy. ServiceName = CRSBusinessService, Alias = DMSRT", fields = { service = "CRSBusinessService", alias = "DMSRT" } }, "Creating new dal proxy."]
counter_examples = ["New dal proxy created. ServiceName = CRSBusinessService, Alias = DMSRT"]

[[template]]
code = "WFM-062B"
class = "lifecycle"
title = "Dal proxy created"
regex = '''^New dal proxy created\. ServiceName = (?P<service>\w+), Alias = (?P<alias>\w+)$'''
examples = [{ msg = "New dal proxy created. ServiceName = CRSBusinessService, Alias = DMSRT", fields = { service = "CRSBusinessService", alias = "DMSRT" } }]
counter_examples = ["Creating new dal proxy."]

[[template]]
code = "WFM-063"
class = "error"
title = "Communication2 service operation threw"
sev = 2
regex = '''^\(ERROR\) \[Communication(?P<chan>\d+)\] - Service operation (?P<op>\w+) threw unexpected exception\.$'''
fields = { chan = "int" }
examples = [{ msg = "(ERROR) [Communication2] - Service operation CRSBusinessContractResults threw unexpected exception.", fields = { chan = 2, op = "CRSBusinessContractResults" } }]
counter_examples = ["[Communication2] - Service operation CRSBusinessContractResults called."]

[[template]]
code = "WFM-064"
class = "error"
title = "Communication2 exception with stack"
sev = 2
regex = '''^\(ERROR\) \[Communication(?P<chan>\d+)\] - (?P<exc_type>[\w.`]+):$'''
fields = { chan = "int" }
cont = "dotnet_stack"
keys = [{ field = "exc_type", type = "exc_type" }]
examples = [
    { msg = "(ERROR) [Communication2] - Example.Platform.ServiceModel.ServiceOperationException:", cont = "Stack trace:\n   at Example.Platform.ServiceWrapper.HandleRequest(BinaryMessage msg) in F:\\PD\\1234567\\1\\Example\\ServiceWrapper.cs:line 83\nInner Exception: System.ObjectDisposedException:\nSafe handle has been closed\n", fields = { chan = 2, exc_type = "Example.Platform.ServiceModel.ServiceOperationException" } },
]
counter_examples = ["(ERROR) [Communication2] - Service operation CRSBusinessContractResults threw unexpected exception."]

[[template]]
code = "WFM-065"
class = "validation"
title = "Value not found in string-to-long map"
sev = 3
regex = '''^Cannot find "(?P<value>[^"]*)" string value in "(?P<map>[^"]*)" string to long map\..*$'''
examples = [{ msg = '''Cannot find "X1" string value in "OMS_CREW" string to long map. Available values are "A", "B".''', fields = { value = "X1", map = "OMS_CREW" } }]
counter_examples = ['''Cannot find request ID 288230376151711744 in the request synchronizer to notify main thread about callback. Retries count left 2. Retry timeout 00:00:01.''']

[[template]]
code = "WFM-066A"
class = "error"
title = "Communication2 error while calling service operation"
sev = 2
regex = '''^\[Communication(?P<chan>\d+)\] - An error occurred while calling service operation\.$'''
fields = { chan = "int" }
examples = [{ msg = "[Communication2] - An error occurred while calling service operation.", fields = { chan = 2 } }]
counter_examples = ["[Communication2] - Calling service operation ApplyDelta over service connection id = 7."]

[[template]]
code = "WFM-066B"
class = "error"
title = "Communication2 exception with stack (no ERROR prefix)"
sev = 2
regex = '''^\[Communication(?P<chan>\d+)\] - (?P<exc_type>[\w.`]+Exception):$'''
fields = { chan = "int" }
cont = "dotnet_stack"
keys = [{ field = "exc_type", type = "exc_type" }]
examples = [
    { msg = "[Communication2] - System.ServiceModel.CommunicationObjectAbortedException:", cont = "Communication object has been aborted.\nStack trace:\n   at Example.Platform.TcpClientConnection.SendRequest(BinaryMessage message) in F:\\PD\\1234567\\1\\Example\\Tcp.cs:line 10\n", fields = { chan = 2, exc_type = "System.ServiceModel.CommunicationObjectAbortedException" } },
]
counter_examples = ["(ERROR) [Communication2] - Example.Platform.ServiceOperationException:"]

[[template]]
code = "WFM-070A"
class = "error"
title = "Subscriber failed to check in"
sev = 2
regex = '''^Subscriber\((?P<pubsub>\w+)\) failed to check-in to the service\. Reason:$'''
cont = { parser = "line_regex", regex = '''^\[(?P<exc_type>[\w.]+)\] (?P<exc_msg>.*)$''' }
keys = [{ field = "exc_type", type = "exc_type" }]
examples = [
    { msg = "Subscriber(CrewManagementPubSub) failed to check-in to the service. Reason: ", cont = "[System.ObjectDisposedException] Cannot access a disposed object.\nObject name: 'x'.\n", fields = { pubsub = "CrewManagementPubSub", exc_type = "System.ObjectDisposedException" } },
]
counter_examples = ["Subscriber is disconnected from CrewManagementPubSub. Reason: Subscriber(CrewManagementPubSub) failed to check-in to the service. Reason: "]

[[template]]
code = "WFM-070B"
class = "error"
title = "Unable to initialize subscriber"
sev = 2
regex = '''^\[ERROR\] - Unable to initialize subscriber: (?P<pubsub>\w+)\. Reason:(?: (?P<reason>.*))?$'''
cont = { parser = "line_regex", regex = '''^\[(?P<exc_type>[\w.]+)\] (?P<exc_msg>.*)$''' }
keys = [{ field = "exc_type", type = "exc_type" }]
examples = [
    { msg = "[ERROR] - Unable to initialize subscriber: CrewManagementPubSub. Reason: Subscriber(CrewManagementPubSub) failed to check-in to the service. Reason: ", cont = "[System.ObjectDisposedException] Cannot access a disposed object.\n", fields = { pubsub = "CrewManagementPubSub", exc_type = "System.ObjectDisposedException" } },
]
counter_examples = ["Subscriber(CrewManagementPubSub) failed to check-in to the service. Reason: "]

[[template]]
code = "WFM-070C"
class = "error"
title = "Subscriber disconnected"
sev = 2
regex = '''^Subscriber is disconnected from (?P<pubsub>\w+)\. Reason:(?: (?P<reason>.*))?$'''
cont = { parser = "line_regex", regex = '''^\[(?P<exc_type>[\w.]+)\] (?P<exc_msg>.*)$''' }
keys = [{ field = "exc_type", type = "exc_type" }]
examples = [
    { msg = "Subscriber is disconnected from CrewManagementPubSub. Reason: Subscriber(CrewManagementPubSub) failed to check-in to the service. Reason: ", cont = "[System.ObjectDisposedException] Cannot access a disposed object.\nObject name: 'x'.\n.\n", fields = { pubsub = "CrewManagementPubSub", exc_type = "System.ObjectDisposedException" } },
]
counter_examples = ["Subscriber is reconnected to CrewManagementPubSub."]

[[template]]
code = "WFM-071C"
class = "lifecycle"
title = "Subscriber is reconnected"
regex = '''^Subscriber is reconnected to (?P<pubsub>\w+)\.$'''
examples = [{ msg = "Subscriber is reconnected to CrewManagementPubSub.", fields = { pubsub = "CrewManagementPubSub" } }]
counter_examples = ["Subscriber: CrewManagementPubSub successfully reconnected."]

[[template]]
code = "WFM-071D"
class = "lifecycle"
title = "Subscriber is subscribed"
regex = '''^Subscriber is subscribed to (?P<pubsub>\w+)\.$'''
examples = [{ msg = "Subscriber is subscribed to CrewManagementPubSub.", fields = { pubsub = "CrewManagementPubSub" } }]
counter_examples = ["Subscriber is reconnected to CrewManagementPubSub."]

[[template]]
code = "WFM-073"
class = "lifecycle"
title = "Default crew assignment status"
regex = '''^DefaultCrewAssignmentStatus is updated to: "(?P<status>[^"]*)"\.$'''
examples = [{ msg = '''DefaultCrewAssignmentStatus is updated to: "Despachada".''', fields = { status = "Despachada" } }]
counter_examples = ["DefaultCrewAssignmentStatus is updated to: Despachada"]

[[template]]
code = "WFM-080"
class = "error"
title = "CRS callback timeout"
sev = 2
regex = '''^\[CrsDataManager\] ERROR - Delta has been forwarded to CRS, but callback is not received within (?P<timeout>[\d:.]+) interval$'''
examples = [{ msg = "[CrsDataManager] ERROR - Delta has been forwarded to CRS, but callback is not received within 00:00:35 interval", fields = { timeout = "00:00:35" } }]
counter_examples = ["[CrsDataManager] Applying delta."]

[[template]]
code = "WFM-081"
class = "error"
title = "Event processing failed"
sev = 2
regex = '''^ERROR - Processing "(?P<event_type>\w+)" message failed\. ExceptionType: "(?P<exc_type>[^"]*)" Reason: (?P<reason>.*?)\. StackTrace:.*$'''
cont = "dotnet_stack"
keys = [{ field = "exc_type", type = "exc_type" }]
examples = [
    { msg = '''ERROR - Processing "ChangedCrewsEvent" message failed. ExceptionType: "System.TimeoutException" Reason: Delta has been forwarded to CRS, but callback is not received within 00:00:35 interval. StackTrace: at Example.Wfm.CrewsModelUpdater.ApplyChanges(IExternalSystemCrews crews) in F:\PD\1234567\1\Example\CrewsModelUpdater.cs:line 120''', cont = "   at Example.Wfm.RequestProcessor.ProcessRequest(IRequest request) in F:\\PD\\1234567\\1\\Example\\RequestProcessor.cs:line 40\n", fields = { event_type = "ChangedCrewsEvent", exc_type = "System.TimeoutException" } },
]
counter_examples = ['''Processing "ChangedCrewsEvent" message failed.''']

# ---------------------------------------------------------------------------------------------
# Info window (nivel >= MessageLogLevel): delta, content sent to CRS/WMS/IMS, callbacks
# ---------------------------------------------------------------------------------------------

[[template]]
code = "WFM-110"
class = "other"
title = "Generating delta"
text = "Generating Delta..."
examples = ["Generating Delta..."]
counter_examples = ["Generating Delta"]

[[template]]
code = "WFM-111"
class = "other"
title = "Entities added to delta"
regex = '''^(?P<n>\d+) (?P<entity>crews|vehicles) added to insert Delta operation\.$'''
fields = { n = "int" }
examples = [{ msg = "3 crews added to insert Delta operation.", fields = { n = 3, entity = "crews" } }, "1 vehicles added to insert Delta operation."]
