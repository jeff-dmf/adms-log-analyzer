# WFM-130 (DMZ rejection): three lines documented in payloads.md, 3 records in the sample.
[[template]]
code = "WFM-130A"
class = "error"
title = "CRS request rejected in DMZ for entity"
sev = 2
regex = '''^ERROR: CRS request is rejected in DMZ zone for entity: "(?P<entity>[^"]*)"\.$'''
examples = [{ msg = '''ERROR: CRS request is rejected in DMZ zone for entity: "CREW0001".''', fields = { entity = "CREW0001" } }]
counter_examples = ["CRS request is rejected by DMZ validation rules: reason"]

[[template]]
code = "WFM-130B"
class = "error"
title = "CRS request generated for rejected assignments"
sev = 2
regex = '''^CRS request with randomly generated GID (?P<gid>\d+) for rejected "(?P<n_assignments>[^"]*)" assignments is created\.$'''
fields = { gid = "int" }
keys = ["gid"]
examples = [{ msg = '''CRS request with randomly generated GID 288230376151711744 for rejected "2" assignments is created.''', fields = { gid = 288230376151711744, n_assignments = "2" } }]
counter_examples = ['''CRS request (OMS_CREW_CHANGE_REQEST = 288230376151711744) is paired with "2" assignments and sent to Prod zone.''']

[[template]]
code = "WFM-130C"
class = "error"
title = "CRS request rejected by DMZ validation rules"
sev = 2
regex = '''^CRS request is rejected by DMZ validation rules: (?P<reason>.*)$'''
examples = [{ msg = "CRS request is rejected by DMZ validation rules: rule X failed", fields = { reason = "rule X failed" } }]
counter_examples = ['''ERROR: CRS request is rejected in DMZ zone for entity: "CREW0001".''']

# ---------------------------------------------------------------------------------------------
# Operations (ARQUITETURA 6.5). Pairing by TID; the request_id (msgid key) must agree.
# A request without WFM-012 is a failure: every one matches a WFM-081 on the same TID
# (docs/formato/wfm-ont.md, section 4), so WFM-081 closes the operation as failed.
# "Detected errors" + SystemEventSender inside the request = business_error (the event is
# sent only when a code reaches ErrorSeverityEventingThreshold; Info-only codes stay ok).
# ---------------------------------------------------------------------------------------------

[[operation]]
name_field = "op"
start = ["WFM-010"]
end_ok = ["WFM-012"]
end_fail = ["WFM-081"]
pair_by = ["tid"]
check_key = "msgid"
business_error = ["GEN-ERR-01", "GEN-EVT-01"]

[[operation]]
name = "Created crew model"
start = ["WFM-011"]
end_ok = ["WFM-012"]
end_fail = ["WFM-081"]
pair_by = ["tid"]
check_key = "msgid"
business_error = ["GEN-ERR-01", "GEN-EVT-01"]
