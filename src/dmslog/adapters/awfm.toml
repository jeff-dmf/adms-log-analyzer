text = "Content being sent to IMS:"
payload = { fmt = "xml", start = "first_cont_lt", role = "content", direction = "out", peer = "IMS" }
examples = [{ msg = "Content being sent to IMS:", cont = "<ArrayOfIncidentCrewAssigment xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\">\n  <IncidentCrewAssigment>\n    <IncidentId>1</IncidentId>\n  </IncidentCrewAssigment>\n</ArrayOfIncidentCrewAssigment>" }]
counter_examples = ["Content being sent to IMS. Content details written in sensitive log.", "Content being sent to CRS:"]

[[template]]
code = "WFM-122"
class = "other"
title = "Calling business contract method"
regex = '''^Calling (?P<contract>I\w+)\.(?P<method>\w+)\.$'''
examples = [{ msg = "Calling ICRSBusinessContract.OrderedChangeAssignmentStatuses.", fields = { contract = "ICRSBusinessContract", method = "OrderedChangeAssignmentStatuses" } }]
counter_examples = ["[Communication2] - Calling service operation ApplyDelta over service connection id = 7."]

[[template]]
code = "WFM-123"
class = "other"
title = "Request IDs returned by CRS/IMS"
regex = '''^Request IDs returned by (?P<target>CRS|IMS) are: "(?P<gids>[^"]*)"\.$'''
fields = { gids = "list" }
keys = [{ field = "gids", type = "gid" }]
examples = [{ msg = '''Request IDs returned by CRS are: "288230376151711744, 288230376151711745".''', fields = { target = "CRS", gids = ["288230376151711744", "288230376151711745"] } }]
counter_examples = ['''Request IDs returned by DMS are: "1".''']

[[template]]
code = "WFM-124A"
class = "other"
title = "CRS request paired and sent"
regex = '''^CRS request \(OMS_CREW_CHANGE_REQEST = (?P<gid>\d+)\) is paired with "(?P<n_assignments>[^"]*)" assignments and sent to Prod zone\.$'''
fields = { gid = "int" }
keys = ["gid"]
examples = [{ msg = '''CRS request (OMS_CREW_CHANGE_REQEST = 288230376151711744) is paired with "2" assignments and sent to Prod zone.''', fields = { gid = 288230376151711744, n_assignments = "2" } }]
counter_examples = ["IMS request (OMS_REQUEST = 288230376151711744) is paired with Incident Gid: 1 | Assigned crew Gid(s): 2 | Deassigned crew Gid(s): assignments and sent to Prod zone."]

[[template]]
code = "WFM-124B"
class = "other"
title = "IMS request paired and sent"
regex = '''^IMS request \(OMS_REQUEST = (?P<gid>\d+)\) is paired with Incident Gid: (?P<incident_gid>\d+) \| Assigned crew Gid\(s\):(?P<assigned>[^|]*)\| Deassigned crew Gid\(s\):(?P<deassigned>[^|]*?) ?assignments and sent to Prod zone\.$'''
fields = { gid = "int", incident_gid = "int", assigned = "list", deassigned = "list" }
keys = ["gid", "incident_gid"]
examples = [
    { msg = "IMS request (OMS_REQUEST = 288230376151711744) is paired with Incident Gid: 288230376151711800 | Assigned crew Gid(s): 288230376151711801 | Deassigned crew Gid(s): assignments and sent to Prod zone.", fields = { gid = 288230376151711744, incident_gid = 288230376151711800, assigned = ["288230376151711801"], deassigned = "" } },
]
counter_examples = ['''CRS request (OMS_CREW_CHANGE_REQEST = 288230376151711744) is paired with "2" assignments and sent to Prod zone.''']

[[template]]
code = "WFM-125A"
class = "other"
title = "Request manager: waiting for answers"
regex = '''^\[(?:Crs|Ims)?RequestManagerForProdRequests\] Adapter will wait to receive (?P<n>\d+) (?:answers|callback results) from (?P<target>CRS|IMS) for (?P<secs>\d+) seconds\.$'''
fields = { n = "int", secs = "int" }
examples = [{ msg = "[CrsRequestManagerForProdRequests] Adapter will wait to receive 1 answers from CRS for 35 seconds.", fields = { n = 1, target = "CRS", secs = 35 } }, "[ImsRequestManagerForProdRequests] Adapter will wait to receive 1 callback results from IMS for 10 seconds."]
counter_examples = ["[CrsRequestManagerForProdRequests] All answers received. Continuing with process."]

[[template]]
code = "WFM-125B"
class = "other"
title = "Request manager: current number to wait"
regex = '''^\[(?:Crs|Ims)?RequestManagerForProdRequests\] Current number of (?:answers|callbacks) to be waited for: (?P<n>\d+)\.$'''
fields = { n = "int" }
examples = [{ msg = "[CrsRequestManagerForProdRequests] Current number of answers to be waited for: 2.", fields = { n = 2 } }]
counter_examples = ["[CrsRequestManagerForProdRequests] Waiting for 1 more answers(s)."]

[[template]]
code = "WFM-125C"
class = "other"
title = "Request manager: answer received"
regex = '''^\[(?:Crs|Ims)?RequestManagerForProdRequests\] (?:Answer|Callback) for request with GID (?P<gid>\d+) received\.$'''
fields = { gid = "int" }
keys = ["gid"]
examples = [{ msg = "[CrsRequestManagerForProdRequests] Answer for request with GID 288230376151711744 received.", fields = { gid = 288230376151711744 } }]
counter_examples = ["[CrsRequestManagerForProdRequests] All answers received. Continuing with process."]

[[template]]
code = "WFM-125D"
class = "other"
title = "Request manager: waiting for more"
regex = '''^\[(?:Crs|Ims)?RequestManagerForProdRequests\] Waiting for (?P<n>\d+) more (?:answers\(s\)|callbacks)\.$'''
fields = { n = "int" }
examples = [{ msg = "[CrsRequestManagerForProdRequests] Waiting for 1 more answers(s).", fields = { n = 1 } }, "[ImsRequestManagerForProdRequests] Waiting for 1 more callbacks."]
counter_examples = ["[CrsRequestManagerForProdRequests] Current number of answers to be waited for: 2."]

[[template]]
code = "WFM-125E"
class = "other"
title = "Request manager: all received"
regex = '''^\[(?:Crs|Ims)?RequestManagerForProdRequests\] All (?:answers|callbacks) received\. Continuing with process\.$'''
examples = ["[CrsRequestManagerForProdRequests] All answers received. Continuing with process.", "[RequestManagerForProdRequests] All callbacks received. Continuing with process."]
counter_examples = ["[CrsRequestManagerForProdRequests] Waiting for 1 more answers(s)."]

[[template]]
code = "WFM-126"
class = "req_resp"
title = "CRS/IMS callback received"
regex = '''^(?P<target>CRS|IMS) sent callback to the adapter for request with GID "(?P<gid>\d+)" with result "(?P<result>[^"]*)"(?: and errors: "(?P<errors>[^"]*)")?\.$'''
fields = { gid = "int" }
keys = ["gid"]
examples = [
    { msg = '''CRS sent callback to the adapter for request with GID "288230376151711744" with result "Accepted" and errors: "0".''', fields = { target = "CRS", gid = 288230376151711744, result = "Accepted", errors = "0" } },
    { msg = '''IMS sent callback to the adapter for request with GID "288230376151711745" with result "Approved".''', fields = { target = "IMS", result = "Approved" } },
]
counter_examples = ["Callback received:"]

[[template]]
code = "WFM-127A"
class = "other"
title = "Request on hold added"
