keys = ["gid"]
examples = [{ msg = "Cannot find request ID 288230376151711744 in the request synchronizer to notify main thread about callback. Retries count left 2. Retry timeout 00:00:01.", fields = { gid = 288230376151711744, left = 2, timeout = "00:00:01" } }]
counter_examples = ["Request with GID 288230376151711744 removed."]

