# oasErrLog.log (error log shared by the processes of the machine). Source:
# docs/formato/crm-e-demais.md, section 7. Different envelope: the process comes from the header
# (`ts <Process>_<pid> [PID=n][TID=0xN] - (LEVEL) msg`) and only ERROR and above are written.

schema = 1
family = "OASERR"
description = "oasErrLog: errors written by any process of the machine"
extends = ["_common"]

[[template]]
code = "OAS-001"
class = "error"
title = "Service operation threw an unexpected exception"
sev = 2
regex = '''^\[Communication(?P<chan>\d+)\] - Service operation (?P<op>\S+) threw unexpected exception\.$'''
keys = [{ field = "op", type = "op" }]
examples = [{ msg = "[Communication2] - Service operation ExampleContractResults threw unexpected exception.", fields = { op = "ExampleContractResults" } }]
counter_examples = ["[Communication2] - Service operation ExampleContractResults called."]

[[template]]
code = "OAS-002"
class = "error"
title = "Communication exception with stack trace"
sev = 2
regex = '''^\[Communication(?P<chan>\d+)\] - (?P<exc_type>[\w.`+]*Exception):$'''
cont = "dotnet_stack"
keys = [{ field = "exc_type", type = "exc_type" }]
examples = [{ msg = "[Communication2] - Example.Platform.ServiceModel.ServiceOperationException:", cont = "   at Example.Service.Call() in F:\\PD\\1234567\\1\\Example\\Service.cs:line 10\n", fields = { exc_type = "Example.Platform.ServiceModel.ServiceOperationException" } }]
counter_examples = ["[Communication2] - Service operation X threw unexpected exception."]

[[template]]
code = "OAS-003"
class = "other"
title = "Log maintenance commands"
sev = 4
regex = '''^(?:Executing command: .*|Removing old logs from location: .*)$'''
examples = ["Executing command: C:\\Example\\tool.exe 'x' --PerformanceCountersData --Logs -o 'y'", "Removing old logs from location: C:\\Example\\Logs"]
counter_examples = ["Executing nothing"]

[[template]]
code = "OAS-004"
class = "error"
title = "DAL connecting with SSO credentials"
sev = 3
regex = '''^DAL The .* application is connecting using SSO credentials .*$'''
examples = ["DAL The 'Example' application is connecting using SSO credentials 'x' with a TokenImpersonationLevel of 'Impersonation'. If the application is NOT running on the hot RCS server, then you have configured delegation incorrectly."]
counter_examples = ["The 'Example' application is connecting"]
