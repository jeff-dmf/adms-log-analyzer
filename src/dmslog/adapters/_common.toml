    { msg = "arb_pubSubLookup: Cache updated with system: sys, service: svc, host: host1, topic: sys.svc.arb.host1.states.syncstate, sync state: SYNC_SYNCED, ps status: OK", fields = { state = "SYNC_SYNCED" } },
]
