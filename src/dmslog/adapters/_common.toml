sev = 5
fts = false
regex = '''^Mode Tracker: \[(?P<table>[^\]]+)\] table is not changed\. Elements: RTDB\((?P<rtdb>\d+)\), array\((?P<array>\d+)\)\.$'''
fields = { rtdb = "int", array = "int" }
examples = [{ msg = "Mode Tracker: [example_table] table is not changed. Elements: RTDB(3), array(3).", fields = { table = "example_table", rtdb = 3, array = 3 } }]
counter_examples = ["Mode Tracker: [example_table] table is changed."]

[[template]]
code = "GEN-PSA-01"
class = "other"
title = "Config value callback (PSAttach)"
sev = 5
fts = false
regex = '''^PSAttach::PubSubReceiveCallBack: Received callback for config value ["'](?P<key>[^"']*)["'] .*$'''
examples = [{ msg = "PSAttach::PubSubReceiveCallBack: Received callback for config value 'ExampleKey' (no change from 'a' to 'a')", fields = { key = "ExampleKey" } }]
counter_examples = ["PSAttach::PubSubReceiveCallBack: Started"]

[[template]]
code = "GEN-PSA-02"
class = "other"
title = "Arbitration pub/sub lookup"
sev = 5
fts = false
regex = '''^arb_pubSubLookup: (?:Received update on topic: (?P<topic>\S+) with status (?P<status>\d+)|Cache updated with system: (?P<system>[^,]+), service: (?P<service>[^,]+), host: (?P<host>[^,]+), topic: (?P<topic2>[^,]+), sync state: (?P<state>\w+)(?:, ps status: (?P<ps_status>\w+))?)$'''
examples = [
