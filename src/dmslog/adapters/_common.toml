examples = [{ msg = "[ExampleSubscriber] Adapter is now subscribed to the 'ExampleService' service on the following topic: EXAMPLE_TOPIC.", fields = { component = "ExampleSubscriber", topic = "EXAMPLE_TOPIC" } }]
counter_examples = ["[ExampleSubscriber] Adapter is not subscribed."]

[[template]]
code = "GEN-SEC-01"
class = "startup"
title = "Legacy serialization protocol enabled (security risk)"
sev = 3
regex = '''^Legacy serialization protocol is enabled\. .*$'''
examples = ["Legacy serialization protocol is enabled. Serialized event data will be deserialized using BinaryFormatter. This is a security risk. Set CoreSDK registry parameter 'X' to true to disable legacy serialization protocol."]
counter_examples = ["Legacy serialization protocol is disabled."]

[[template]]
code = "GEN-C2T-04"
class = "other"
title = "Socket registration and cleanup tracing"
sev = 5
fts = false
regex = '''^\[Communication(?P<chan>\d+)\] - (?:Resources succesfully cleaned up for tcp socket id = (?P<socket_id>\d+)|Tcp framing socket id = (?P<socket_id2>\d+) cleanup finished|Tcp framing socket initialized for a socket id = (?P<socket_id4>\d+)|Socket with id = (?P<socket_id3>\d+) succesfully registered with the completion port handle = (?P<handle>\d+))\.$'''
fields = { chan = "int", socket_id = "int", socket_id2 = "int", socket_id3 = "int", socket_id4 = "int", handle = "int" }
examples = [
    { msg = "[Communication2] - Resources succesfully cleaned up for tcp socket id = 5.", fields = { socket_id = 5 } },
    "[Communication2] - Tcp framing socket id = 5 cleanup finished.",
    "[Communication2] - Tcp framing socket initialized for a socket id = 5.",
    { msg = "[Communication2] - Socket with id = 5 succesfully registered with the completion port handle = 9.", fields = { socket_id3 = 5, handle = 9 } },
]
counter_examples = ["[Communication2] - Socket with id = 5 exploded."]
