# Generic templates shared by every family (task 2.2). Library: only reachable through
# `extends = ["_common"]`, and as the whole catalog of families without a file of their own
# (UNKNOWN, PROCESS, SERVERLOG, adapters outside the 1.0 scope, ...).
#
# Sources: docs/formato/{crm-e-demais,avl-osr-smn-siteswitch,wfm-ont,payloads}.md. Old
# per-document IDs (COM-*, WFM-020..022, WFM-050..052, WFM-090, WFM-099, WFM-100, ONT-030,
# ONT-100) are kept as `aliases`. Family-specific files come first in the chain, so a family
# template always wins over a generic one; the generic ones here must therefore be mutually
# exclusive among themselves (the example check enforces it).
#
# Splits against the format documents (the document ID keeps the first part):
#   GEN-CCH-01 (smart cache) -> GEN-CCH-01 Cache[...], GEN-CCH-02 replicator, GEN-CCH-03 model ids
#   GEN-C2L-01 / GEN-C2L-02 stay as documented
#   GEN-MAP-01 covers the dump and its open/closed/cleared/integrity markers; GEN-MAP-02 is one
#   entry per line; GEN-MAP-03 announces how many entries follow; GEN-MAP-04 "Adding the key"
#   GEN-ERR-01 (normal stream: error codes) and GEN-ERR-03 (sensitive stream: details)
#   GEN-PRX-02 (announces the sensitive URL) and GEN-PRX-03 (existing proxy)
#   GEN-STARTUP of crm-e-demais.md is the set GEN-CFG-* and GEN-STU-* (startup class)
#
# ---------------------------------------------------------------------------------------------
# Table of [Configuration] name aliases for M3 (config_observed x resolved, ARQUITETURA 7.2.1).
# The schema has no data tables, so the table is kept here as a comment. The comparison is done
# on the normalized name (no "_", case-insensitive) PLUS the entries below:
#
#   name in the Registry / WebServiceConfiguration          name logged by the adapter
#   WebServiceConfiguration                           ->    PathToWebServiceConfiguration
#   <Operation>_ErrorConfigurationPath                ->    <Operation>ErrorConfigurationPath
#                                                           (for example CreatedMeterReadings_)
#   AddressingMode                                    ->    AddressingModeString
#   RemoteHouseKeepingType                            ->    RemoteHouseKeepingTypeString
# The last two come from the comparison of the 120 names logged as "Type: [ConfigurationRegistry]"
# in the sample ERS with the 968 <Value Name> entries of OASyS/Servers/config/Registry/*.xml (the
# only two names that do not match after normalization). Every other name matches. Names logged
# only as defaults ("[LoadingError]" + "Default value loaded") are not in the Registry on purpose.
# ---------------------------------------------------------------------------------------------

schema = 1
family = "_common"
description = "Generic templates: statistics, connections, errors, exceptions, maps, startup, tracing"

# ============================================================================================
# Statistics: [Communication<n>] blocks every hour
# ============================================================================================

[[template]]
code = "GEN-STA-01"
aliases = ["COM-001", "COM-006"]
class = "statistics"
title = "Statistics block header"
sev = 5
regex = '''^\[Communication(?P<chan>\d+)\] - (?P<side>Client|Service)-side statistics:$'''
fields = { chan = "int" }
examples = [
    { msg = "[Communication2] - Client-side statistics:", fields = { chan = 2, side = "Client" } },
    "[Communication2] - Service-side statistics:",
]
counter_examples = ["[Communication2] - Client-side statistics: done", "Client-side statistics:"]

[[template]]
code = "GEN-STA-02"
aliases = ["WFM-090", "ONT-030", "COM-002", "COM-007"]
class = "statistics"
title = "Statistics totals"
sev = 5
regex = '''^\[Communication(?P<chan>\d+)\] - \[TOTAL\]\[(?P<side>Client|Service)\] Call count: (?P<calls>\d+), Request bytes: (?P<req_bytes>\d+) \(avg\. (?P<req_avg>[\d.]+)\), Response bytes: (?P<resp_bytes>\d+) \(avg\. (?P<resp_avg>[\d.]+)\)\. Total operations: (?P<ops>\d+)$'''
fields = { chan = "int", calls = "int", req_bytes = "int", resp_bytes = "int", req_avg = "float", resp_avg = "float", ops = "int" }
examples = [
    { msg = "[Communication2] - [TOTAL][Client] Call count: 3, Request bytes: 294 (avg. 98), Response bytes: 28553 (avg. 9517.667). Total operations: 3", fields = { side = "Client", calls = 3, req_bytes = 294, resp_bytes = 28553, req_avg = 98.0, resp_avg = 9517.667, ops = 3 } },
]
counter_examples = ["[Communication2] - [TOTAL][Client] Call count: x, Request bytes: 294"]

[[template]]
code = "GEN-STA-03"
aliases = ["COM-003", "COM-004", "COM-005"]
class = "statistics"
title = "Statistics section (CSV per method)"
sev = 5
regex = '''^\[Communication(?P<chan>\d+)\] - By (?P<order>call count|Request Message Size Total|Response Message Size Total):$'''
fields = { chan = "int" }
cont = "stats_csv"
examples = [
    { msg = "[Communication2] - By call count: ", cont = "[methodname, call count, request total size, response total size]\nExample.Contract.IQuery.Get,1,74,72\n", fields = { order = "call count" } },
    "[Communication3] - By Request Message Size Total:",
]
counter_examples = ["[Communication2] - By nothing:"]

# ============================================================================================
# Connections between processes
# ============================================================================================

[[template]]
code = "GEN-CON-01"
aliases = ["WFM-020"]
class = "lifecycle"
title = "Connecting to a service"
sev = 4
regex = '''^Connecting to (?P<service>[\w.]+)\.$'''
examples = [{ msg = "Connecting to ExampleBusinessService.", fields = { service = "ExampleBusinessService" } }]
counter_examples = ["Successfully connected to ExampleBusinessService."]

[[template]]
code = "GEN-CON-02"
aliases = ["WFM-021"]
class = "lifecycle"
title = "Connected to a service"
sev = 4
regex = '''^Successfully connected to (?P<service>[\w.]+)\.$'''
examples = [{ msg = "Successfully connected to ExampleBusinessService.", fields = { service = "ExampleBusinessService" } }]
counter_examples = ["Connecting to ExampleBusinessService."]

[[template]]
code = "GEN-CON-03"
aliases = ["WFM-022"]
class = "lifecycle"
title = "Client connection router"
sev = 4
regex = '''^\[ClientConnectionRouter\] (?P<action>Add|Remove) connection for ClientId = (?P<client_id>\d+)$'''
fields = { client_id = "int" }
keys = ["client_id"]
examples = [{ msg = "[ClientConnectionRouter] Add connection for ClientId = 7", fields = { action = "Add", client_id = 7 } }]
counter_examples = ["[ClientConnectionRouter] Add connection for ClientId = x"]

[[template]]
code = "GEN-NET-01"
class = "other"
title = "Socket termination and cleanup"
sev = 4
regex = '''^\[Communication(?P<chan>\d+)\] - (?:Finished terminating (?P<conn>[0-9a-fA-F-]{36}) connection\.|Started socket cleanup worker\.)$'''
fields = { chan = "int", conn = "guid" }
examples = [
    "[Communication2] - Finished terminating 00000000-0000-4000-8000-000000000001 connection.",
    "[Communication2] - Started socket cleanup worker.",
]
counter_examples = ["[Communication2] - Finished terminating connection."]

# ============================================================================================
# Validation errors, system events, exceptions
# ============================================================================================

[[template]]
code = "GEN-ERR-01"
aliases = ["WFM-050"]
class = "validation"
title = "Detected errors (error codes)"
sev = 3
stream = "normal"
regex = '''^Detected errors:$'''
cont = "codes_per_line"
keys = [{ field = "codes", type = "errcode" }]
examples = [{ msg = "Detected errors:", cont = "ExampleCodeOne\nExampleCodeTwo", fields = { codes = ["ExampleCodeOne", "ExampleCodeTwo"] } }]
counter_examples = ["Detected errors: none"]

[[template]]
code = "GEN-ERR-02"
aliases = ["WFM-051"]
class = "validation"
title = "Details of the errors are in the sensitive log"
sev = 4
refs_sensitive = true
text = "A detailed description of these errors can be found in the adapters sensitive log."
examples = ["A detailed description of these errors can be found in the adapters sensitive log."]
counter_examples = ["A detailed description of these errors can be found elsewhere."]

[[template]]
code = "GEN-ERR-03"
class = "validation"
title = "Detected errors (details)"
sev = 3
stream = "sensitive"
regex = '''^Detected errors:$'''
examples = ["Detected errors:"]
counter_examples = ["Detected errors"]

[[template]]
code = "GEN-EVT-01"
aliases = ["WFM-052"]
class = "error"
title = "System event sent by an adapter"
sev = 4
regex = '''^\[SystemEventSender(?:WithQueuing)?\] System event message: \[(?P<adapter>[\w.]+)\] (?:\[(?P<op>[^\]]+)\] )?(?P<text>(?P<lvl>ERROR|WARNING|Errors occurred)?.*)$'''
sev_field = "lvl"
sev_map = { ERROR = 2, WARNING = 3, "Errors occurred" = 3 }
examples = [
    { msg = "[SystemEventSender] System event message: [AdapterExample] [CreateExample] Errors occurred while processing received message", fields = { adapter = "AdapterExample", op = "CreateExample", lvl = "Errors occurred" } },
    { msg = "[SystemEventSenderWithQueuing] System event message: [AdapterExample] ERROR: Processing message from external system failed.", fields = { adapter = "AdapterExample", lvl = "ERROR" } },
    "[SystemEventSenderWithQueuing] System event message: [AdapterExample] Uploading file to remote location succeeded.",
]
counter_examples = ["[SystemEventSender] Trying to send an system event. System event message: [AdapterExample] x"]

[[template]]
code = "GEN-EVT-02"
class = "other"
title = "Published EventData"
sev = 4
text = "Publishing EventData:"
cont = "kv_colon"
examples = [{ msg = "Publishing EventData:", cont = "Timestamp: 2026-01-01 00:00:00\nDetails: example" }]
counter_examples = ["Publishing EventData: x"]

[[template]]
code = "GEN-EVT-03"
class = "other"
title = "System event about to be sent"
sev = 4
regex = '''^\[SystemEventSender\] Trying to send an system event\. System event message: (?P<event>.*)$'''
examples = [{ msg = "[SystemEventSender] Trying to send an system event. System event message: [AdapterExample] Example", fields = { event = "[AdapterExample] Example" } }]
counter_examples = ["[SystemEventSender] System event message: [AdapterExample] Example"]

[[template]]
code = "GEN-EXC-01"
aliases = ["WFM-061"]
class = "error"
title = "Non fatal exception"
sev = 2
regex = '''^Non Fatal Exception (?P<exc_type>[\w.`+]+): (?P<exc_msg>.*)$'''
cont = "dotnet_stack"
keys = [{ field = "exc_type", type = "exc_type" }]
examples = [
    { msg = "Non Fatal Exception System.ObjectDisposedException: Cannot access a disposed object.", cont = "\tManaged Code Stack Trace:\n   at Example.Service.Call() in F:\\PD\\1234567\\1\\Example\\Service.cs:line 83\n", fields = { exc_type = "System.ObjectDisposedException", exc_msg = "Cannot access a disposed object." } },
]
counter_examples = ["Fatal Exception System.ObjectDisposedException: x", "Non Fatal Exception without type"]

[[template]]
code = "GEN-DBG-01"
aliases = ["WFM-099", "ONT-099"]
class = "lifecycle"
title = "Debug level changed"
sev = 4
regex = '''^Debug level changed from (?P<from_name>\w+) \((?P<from_n>\d+)\) to (?P<to_name>\w+) \((?P<to_n>\d+)\)\.$'''
fields = { from_n = "int", to_n = "int" }
examples = [{ msg = "Debug level changed from DebugLog (3) to Info (5).", fields = { from_name = "DebugLog", from_n = 3, to_name = "Info", to_n = 5 } }]
counter_examples = ["Debug level changed to Info."]

# ============================================================================================
# Auditing (sensitive stream): idle endpoints, every AuditingPeriod
# ============================================================================================

[[template]]
code = "GEN-AUD-01"
class = "other"
title = "Endpoint not invoked"
sev = 4
regex = '''^Endpoint (?P<endpoint>\S+) on (?P<url>\S+) was not invoked more than (?P<period>[\d:.]+)$'''
examples = [{ msg = "Endpoint ReceiveExampleService on https://localhost:9999/ReceiveExampleService was not invoked more than 12:00:00", fields = { endpoint = "ReceiveExampleService", period = "12:00:00" } }]
counter_examples = ["Endpoint ReceiveExampleService on https://localhost:9999/x was invoked"]

[[template]]
code = "GEN-AUD-02"
class = "other"
title = "Client did not send requests"
sev = 4
regex = '''^Client for endpoint (?P<endpoint>\S*) +didn't send request to (?P<url>\S+) for more than (?P<period>[\d:.]+)\.$'''
examples = [{ msg = "Client for endpoint ExampleService didn't send request to https://example.invalid/x for more than 12:00:00.", fields = { endpoint = "ExampleService", period = "12:00:00" } }, "Client for endpoint  didn't send request to https://example.invalid/x for more than 12:00:00."]
counter_examples = ["Client for endpoint ExampleService sent a request"]

# ============================================================================================
# Subscribers (publish/subscribe)
# ============================================================================================

[[template]]
code = "GEN-SUB-01"
aliases = ["WFM-072"]
class = "lifecycle"
title = "Subscriber life cycle"
sev = 4
regex = '''^Subscriber(?: integrity update (?P<phase>started|finished)\.| manager \((?P<pubsub>[^)]+)\) .*|: (?P<subscriber>\w+) .*| is (?:subscribed|connected) to (?P<pubsub2>\w+)\.)$'''
examples = [
    { msg = "Subscriber integrity update started.", fields = { phase = "started" } },
    { msg = "Subscriber manager (ExamplePubSub) is connected to the publisher.", fields = { pubsub = "ExamplePubSub" } },
    { msg = "Subscriber: ExamplePubSub successfully connected.", fields = { subscriber = "ExamplePubSub" } },
    { msg = "Subscriber is subscribed to ExamplePubSub.", fields = { pubsub2 = "ExamplePubSub" } },
]
counter_examples = ["Subscriber ExamplePubSub:1. Dequeued LocalSubscriberCommand count: 2."]

[[template]]
code = "GEN-SUB-02"
class = "other"
title = "Dequeued subscriber commands"
sev = 5
regex = '''^Subscriber (?P<pubsub>\w+):(?P<n>\d+)\. Dequeued LocalSubscriberCommand count: (?P<count>\d+)\.$'''
fields = { n = "int", count = "int" }
examples = [{ msg = "Subscriber ExamplePubSub:1. Dequeued LocalSubscriberCommand count: 2.", fields = { pubsub = "ExamplePubSub", n = 1, count = 2 } }]
counter_examples = ["Subscriber ExamplePubSub:1. Dequeued nothing."]

[[template]]
code = "GEN-SUB-03"
class = "other"
title = "Publication info"
sev = 4
text = "[Subscriber] - Publication info:"
cont = "kv_dash"
examples = [{ msg = "[Subscriber] - Publication info:", cont = "Sub-process - Example\nCacheOperation - Update" }]
counter_examples = ["[Subscriber] - Publication info"]

[[template]]
code = "GEN-SUB-04"
class = "other"
title = "IU received for a topic"
sev = 5
regex = '''^IU received for topic: (?P<topic>\S+)\.$'''
examples = [{ msg = "IU received for topic: example.topic.name.", fields = { topic = "example.topic.name" } }]
counter_examples = ["IU received for topic"]

# ============================================================================================
# Maps (cache dumps) of the adapters
# ============================================================================================

[[template]]
code = "GEN-MAP-01"
aliases = ["WFM-002", "WFM-003"]
class = "other"
title = "Map dump and state markers"
sev = 5
regex = '''^(?:New )?"(?P<map>[^"]*)" map (?P<state>content:|is now open\.|closed\.|cleared\.|integrity update started\. Map will be cleared and populated with fresh data\.)$'''
cont = "kv_tab"
examples = [
    { msg = "New \"EXAMPLE_MAP\" map content:", cont = "\t1 - A\n\t2 - B", fields = { map = "EXAMPLE_MAP", state = "content:" } },
    "\"EXAMPLE_MAP\" map is now open.",
    "\"EXAMPLE_MAP\" map closed.",
    "\"EXAMPLE_MAP\" map cleared.",
    "\"EXAMPLE_MAP\" map integrity update started. Map will be cleared and populated with fresh data.",
]
counter_examples = ["\"EXAMPLE_MAP\" map exploded."]

[[template]]
code = "GEN-MAP-02"
window = 1008  # worst case quadratic: see _schema.md, Regex safety
class = "other"
title = "Entry added to a map"
sev = 5
fts = false
regex = '''^"(?P<key>.*)" (?:entry )?(?P<action>added|updated) to the "(?P<map>[^"]*)" map\.$'''
examples = [
    { msg = "\"Key: X-1\" entry added to the \"EXAMPLE_MAP\" map.", fields = { map = "EXAMPLE_MAP" } },
    "\"X-1\" added to the \"EXAMPLE_MAP\" map.",
    "\"Example\"-\"Value\" entry updated to the \"EXAMPLE_MAP\" map.",
]
counter_examples = ["\"X-1\" removed from the \"EXAMPLE_MAP\" map."]

[[template]]
code = "GEN-MAP-03"
class = "other"
title = "Entries about to be added to a map"
sev = 5
regex = '''^(?P<n>\d+) entries will be added to the "(?P<map>[^"]*)" map\.\.\.$'''
fields = { n = "int" }
examples = [{ msg = "12 entries will be added to the \"EXAMPLE_MAP\" map...", fields = { n = 12, map = "EXAMPLE_MAP" } }]
counter_examples = ["12 entries were added to the \"EXAMPLE_MAP\" map..."]

[[template]]
code = "GEN-MAP-04"
class = "other"
title = "Adding a key to a map"
sev = 5
fts = false
regex = '''^Adding the key (?P<key>.*)$'''
examples = ["Adding the key 12345", "Adding the key Name: \"X\" Semantic: \"Y\""]
counter_examples = ["Adding keys"]

# ============================================================================================
# Payload announcement and payload (sensitive stream)
# ============================================================================================

[[template]]
code = "GEN-MSG-01"
aliases = ["WFM-100", "ONT-100"]
class = "req_resp"
title = "Message announced in the sensitive log"
sev = 4
refs_sensitive = true
regex = '''^Message with MessageID: '(?P<message_id>[^']*)' will be logged in sensitive log\.$'''
keys = [{ field = "message_id", type = "msgid" }]
examples = [
    { msg = "Message with MessageID: '00000000-0000-4000-8000-000000000001' will be logged in sensitive log.", fields = { message_id = "00000000-0000-4000-8000-000000000001" } },
    "Message with MessageID: '' will be logged in sensitive log.",
]
counter_examples = ["Message with MessageID: '00000000-0000-4000-8000-000000000001' was logged."]

[[template]]
code = "GEN-PLD-01"
class = "req_resp"
title = "Message payload (XML)"
sev = 4
stream = "sensitive"
regex = '''^Message(?: content)?: (?=<)'''
payload = { fmt = "xml", start = "match_end", strip_suffix = ".", role = "by_root" }
examples = [{ msg = "Message content: <ChangedExamples xmlns=\"urn:example\">", cont = "  <Header/>\n</ChangedExamples>." }, "Message: <ExampleResponseMessage>"]
counter_examples = ["Message content: not xml"]

# ============================================================================================
# Proxies, filters, validation of schemas, pools, mode tracker, pub/sub attach
# ============================================================================================

[[template]]
code = "GEN-PRX-01"
class = "other"
title = "Getting a service proxy"
sev = 5
regex = '''^Getting service proxy of type ["'](?P<type>[^"']+)["'](?: succeeded)?\.$'''
examples = [{ msg = "Getting service proxy of type \"Example.IContract\".", fields = { type = "Example.IContract" } }, "Getting service proxy of type 'Example.IContract' succeeded."]
counter_examples = ["Getting service proxy failed."]

[[template]]
code = "GEN-PRX-02"
class = "other"
title = "Client proxy requested (URL in the sensitive log)"
sev = 4
refs_sensitive = true
regex = '''^Request client proxy object for service with contract type (?P<contract>\d+)\. Service details written in sensitive log\.$'''
fields = { contract = "int" }
examples = [{ msg = "Request client proxy object for service with contract type 12. Service details written in sensitive log.", fields = { contract = 12 } }]
counter_examples = ["Request client proxy object for service with contract type 12."]

[[template]]
code = "GEN-PRX-03"
class = "other"
title = "Existing client proxy reused"
sev = 5
regex = '''^Detected existing client proxy object for service with contract type (?P<contract>\d+)\.$'''
fields = { contract = "int" }
examples = [{ msg = "Detected existing client proxy object for service with contract type 12.", fields = { contract = 12 } }]
counter_examples = ["Detected existing client proxy."]

[[template]]
code = "GEN-PRX-S01"
class = "other"
title = "Client proxy URL"
sev = 4
stream = "sensitive"
regex = '''^Creating client proxy object for service URL: (?P<url>.*)$'''
examples = [{ msg = "Creating client proxy object for service URL: net.tcp://example.invalid:1234/Service", fields = { url = "net.tcp://example.invalid:1234/Service" } }]
counter_examples = ["Creating client proxy object"]

[[template]]
code = "GEN-FLT-01"
class = "other"
title = "Removing zero IDs from a collection"
sev = 5
fts = false
regex = '''^(?:Removing zero IDs from the source collection: .*|Zero IDs successfully removed from the source collection\. New source collection: .*)$'''
examples = ["Removing zero IDs from the source collection: \"1\", \"2\".", "Zero IDs successfully removed from the source collection. New source collection: \"1\"."]
counter_examples = ["Removing IDs from the source collection: \"1\"."]

[[template]]
code = "GEN-FLT-02"
class = "other"
title = "Filtering and getting data"
sev = 5
fts = false
regex = '''^(?:\[[^\]]+\] )?(?:Filtering data based on IDs: .*|Filtering data succeeded\. (?P<n>\d+) entities returned\.|Collection is (?:not )?empty\.|Getting all data from .*|Getting GIDs for provided UIDs(?::| succeeded).*)$'''
fields = { n = "int" }
examples = [
    { msg = "Filtering data succeeded. 5 entities returned.", fields = { n = 5 } },
    "[ExampleQuery - GetExample] Filtering data based on IDs: \"1\", \"2\".",
    "Collection is not empty.",
    "Collection is empty.",
    "Getting all data from \"Example\"...",
    "Getting GIDs for provided UIDs: \"U1\".",
    "Getting GIDs for provided UIDs succeeded.",
]
counter_examples = ["Filtering data failed."]

[[template]]
code = "GEN-POOL-01"
class = "other"
title = "Adaptive pool usage"
sev = 5
regex = '''^\[AdaptivePool (?P<pool>[^\]]+)\] \[UsageMonitor\] (?:In the previous (?P<period>\d+)ms period adaptive pool peak pressure parameters were max=(?P<max>\d+), min=(?P<min>\d+)\..*|Monitoring started\..*)$'''
fields = { period = "int", max = "int", min = "int" }
examples = [
    { msg = "[AdaptivePool Example_Base] [UsageMonitor] In the previous 60000ms period adaptive pool peak pressure parameters were max=3, min=1. Size: 4.", fields = { pool = "Example_Base", max = 3, min = 1 } },
    "[AdaptivePool Example_Base] [UsageMonitor] Monitoring started. Default size: 4, check period: 60000 ms, upsizing alocation: 2 elements.",
]
counter_examples = ["[AdaptivePool Example_Base] [UsageMonitor]"]

[[template]]
code = "GEN-XSD-01"
class = "validation"
title = "Message valid against the XSD"
sev = 4
regex = '''^(?P<phase>Received valid request message|Sending valid reply message|Sending request message is valid|Received reply message is valid) according to XML schema definition\.$'''
examples = [{ msg = "Received valid request message according to XML schema definition.", fields = { phase = "Received valid request message" } }, "Sending valid reply message according to XML schema definition."]
counter_examples = ["Received invalid request message according to XML schema definition."]

[[template]]
code = "GEN-XSD-02"
class = "error"
title = "Message rejected by the XSD validator"
sev = 2
regex = '''^\[MessageValidator\] Message: (?P<reason>.*)$'''
examples = [{ msg = "[MessageValidator] Message: Could not find schema information for the element 'ns:Example'.", fields = { reason = "Could not find schema information for the element 'ns:Example'." } }]
counter_examples = ["[MessageValidator] Started"]

[[template]]
code = "GEN-MOD-01"
class = "other"
title = "Mode tracker heartbeat"
sev = 5
fts = false
text = "ModeTracker: Sleeping..."
examples = ["ModeTracker: Sleeping..."]
counter_examples = ["ModeTracker: Awake"]

[[template]]
code = "GEN-MOD-02"
class = "other"
