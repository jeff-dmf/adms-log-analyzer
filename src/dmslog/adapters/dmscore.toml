# Core real-time services (family DMSCORE): CoreFunctionsService, ModelTopologyService,
# ChangesetRepositoryService, ModelPromotionService, GraphicalModelService, GenericCalculationService,
# LoadForecastService, LocalContextManager, ContextCoordinatorService, ExportService and
# ControlSequenceManagementService (normal and sensitive streams). Design: docs/notas/rt-templates-desenho.md.
#
# Codes: DCR-001..099 CoreFunctions, 100..129 ModelTopology, 130..149 ChangesetRepository,
# 150..159 ModelPromotion, 160..179 GraphicalModel, 180..219 GenericCalculation, 220..279 LoadForecast,
# 280..319 LocalContextManager (S280..S289 sensitive), 320..339 ContextCoordinator, 340..369 Export,
# 370..399 ControlSequenceManagement. Correlation keys: `job_id` only on the submit, status and result
# lines of a calculation job (CoreFunctions) and on the result lines of the LoadForecast LookAhead.
# Infrastructure lines shared with other real-time families belong to `_dmsrt`, not to this file.
#
# Job status (section 3.3 of the design note): a line with ONE status maps the severity through `sev_map`.

schema = 1
family = "DMSCORE"
description = "Core real-time services: CoreFunctions, ModelTopology, ChangesetRepository, ModelPromotion, GraphicalModel, GenericCalculation, LoadForecast, LocalContextManager, ContextCoordinator, Export and ControlSequenceManagement"
extends = ["_dmsrt", "_common"]

# ---------------------------------------------------------------------------------------------
# CoreFunctionsService (DCR-001..099)
# ---------------------------------------------------------------------------------------------

[[template]]
code = "DCR-001"
class = "statistics"
title = "Redundant jobs found in the job queue table"
sev = 5
fts = false
regex = '''^\[JobQueueTable\] (?P<count>\d+) redundant jobs found\.$'''
fields = { count = "int" }
examples = [{ msg = "[JobQueueTable] 3 redundant jobs found.", fields = { count = 3 } }]
counter_examples = ["[JobQueueTable] some redundant jobs found."]

[[template]]
code = "DCR-002"
class = "other"
title = "Operational model acquired"
sev = 5
fts = false
regex = '''^\[OMH\] Operational model for (?P<models>OM_[\w, ]*\w) network (?:containing root (?P<root>(?:0x)?[0-9A-Fa-f]{1,16}) is acquired\.|is acquired for: .*)$'''
fields = { root = "hex" }
examples = [
    { msg = "[OMH] Operational model for OM_DMS, OM_LV network containing root 0x4A00B00C00D00E01 is acquired.", fields = { models = "OM_DMS, OM_LV" } },
    { msg = "[OMH] Operational model for OM_EMS network is acquired for: 0x4A00B00C00D00E02, 0x4A00B00C00D00E03, 0x4A00B00C00D00E04,", fields = { models = "OM_EMS" } },
]
counter_examples = ["[OMH] Operational model for OM_DMS network is released."]

[[template]]
code = "DCR-003"
class = "error"
title = "Operational model could not be retrieved or acquired"
sev = 2
regex = '''^(?:\[OMH\] TryGetOperationalModel: Failed to retrieve operational model|AcquireOperationalModels failed because of (?P<reason>.+)\.)$'''
examples = [
    "[OMH] TryGetOperationalModel: Failed to retrieve operational model",
    { msg = "AcquireOperationalModels failed because of Meshed roots.", fields = { reason = "Meshed roots" } },
]
counter_examples = ["AcquireOperationalModels succeeded for Meshed roots."]

[[template]]
code = "DCR-005"
class = "statistics"
title = "State model export timings"
sev = 5
fts = false
regex = '''^\[SMP\]\[DIAG\] SM exported\. BLT is (?P<blt>\w+)\. Elapsed times\[msec\] - Waiting lock: (?P<wait_ms>\d+)\. Prepare: (?P<prepare_ms>\d+)\. Common: (?P<common_ms>\d+)\. LC params: (?P<lc_params_ms>\d+)\. Weather regions: (?P<weather_ms>\d+)\. +Interval Scheduels: (?P<schedules_ms>\d+)\. Total: (?P<total_ms>\d+)\.$'''
fields = { wait_ms = "int", prepare_ms = "int", common_ms = "int", lc_params_ms = "int", weather_ms = "int", schedules_ms = "int", total_ms = "int" }
examples = [{ msg = "[SMP][DIAG] SM exported. BLT is BLT_EXAMPLE. Elapsed times[msec] - Waiting lock: 0. Prepare: 1. Common: 4. LC params: 5. Weather regions: 0.  Interval Scheduels: 0. Total: 10.", fields = { blt = "BLT_EXAMPLE", total_ms = 10 } }]
counter_examples = ["[SMP][DIAG] SM exported. BLT is BLT_EXAMPLE. Elapsed times[msec] - Waiting lock: x."]

[[template]]
code = "DCR-006"
class = "other"
title = "State model update step"
sev = 5
fts = false
regex = '''^\[SMP\] (?P<detail>(?:Updating Static and Network model|Found transmission block - ID: \d+|Updating Static and Network model done\.).*)$'''
examples = [{ msg = "[SMP] Updating Static and Network model done. Static model: 4ms, Network model: 6ms, Total: 10ms", fields = { detail = "Updating Static and Network model done. Static model: 4ms, Network model: 6ms, Total: 10ms" } }]
counter_examples = ["[SMP][DIAG] SM exported."]

[[template]]
code = "DCR-010"
class = "start"
title = "Calculation job submitted"
sev = 4
regex = '''^\[PRH\] JobId: (?P<job_id>\d+), RootId: (?P<root>(?:0x)?[0-9A-Fa-f]{1,16}) Function: (?P<function>\w+) is submitted\.$'''
fields = { job_id = "int", root = "hex" }
keys = ["job_id"]
examples = [{ msg = "[PRH] JobId: 1000123, RootId: 0x4A00B00C00D00E01 Function: StateEstimation is submitted.", fields = { job_id = 1000123, function = "StateEstimation" } }]
counter_examples = ["[PRH] JobId: x, RootId: 0x4A00B00C00D00E01 Function: StateEstimation is submitted."]

[[template]]
code = "DCR-011"
class = "end"
title = "Calculation job status report received"
sev = 4
sev_field = "status"
sev_map = { DoneWithError = 2, Failed = 2, Aborted = 2, Cancelled = 3, DoneWithWarning = 3, DoneWithSuccess = 4, Running = 5 }
regex = '''^\[PRS\] Job status report is received\. JobId: (?P<job_id>\d+), Job Status: (?P<status>\w+)$'''
fields = { job_id = "int" }
keys = ["job_id"]
examples = [
    { msg = "[PRS] Job status report is received. JobId: 1000123, Job Status: DoneWithWarning", fields = { job_id = 1000123, status = "DoneWithWarning" } },
    "[PRS] Job status report is received. JobId: 1000124, Job Status: DoneWithSuccess",
]
counter_examples = ["[PRS] Job status report is received. JobId: x, Job Status: DoneWithSuccess"]

[[template]]
code = "DCR-012"
class = "statistics"
title = "Job submission timings"
sev = 5
fts = false
regex = '''^\[PRH\]\[DIAG\] Number of jobs: (?P<jobs>\d+)\. Function: (?P<function>\w+)\. OM: (?P<om_ms>\d+)ms\. Total: (?P<total_ms>\d+)ms\.$'''
fields = { jobs = "int", om_ms = "int", total_ms = "int" }
examples = [{ msg = "[PRH][DIAG] Number of jobs: 2. Function: LoadFlow. OM: 12ms. Total: 30ms.", fields = { jobs = 2, function = "LoadFlow", total_ms = 30 } }]
counter_examples = ["[PRH][DIAG] Number of jobs: x. Function: LoadFlow. OM: 12ms. Total: 30ms."]

[[template]]
code = "DCR-013"
class = "other"
title = "Job request handler housekeeping"
sev = 5
fts = false
regex = '''^\[PRH\] (?:SetElementIdsAffectedByOperationalModel: Affected element IDs set\.|CleanUp is called\.|CancelRequest: Cancelling job execution for jobIds: (?P<job_ids>[\d, ]+)\.)$'''
examples = [
    { msg = "[PRH] CancelRequest: Cancelling job execution for jobIds: 1000123.", fields = { job_ids = "1000123" } },
    "[PRH] CleanUp is called.",
]
counter_examples = ["[PRH] CancelRequest: Cancelling job execution for jobIds: none."]

[[template]]
code = "DCR-014"
class = "validation"
title = "Cancel request for a job that is not found"
sev = 4  # cleanup of something absent
regex = '''^\[PRH\] CancelRequest: Failed to find powerAppsJob for jobId (?P<job_id>\d+)\.$'''
fields = { job_id = "int" }
examples = [{ msg = "[PRH] CancelRequest: Failed to find powerAppsJob for jobId 1000123.", fields = { job_id = 1000123 } }]
counter_examples = ["[PRH] CancelRequest: Failed to find powerAppsJob for jobId x."]

[[template]]
code = "DCR-015"
class = "lifecycle"
title = "Results of a job being handled"
sev = 4
fts = false
regex = '''^\[PRS\] Handling results of JobId: (?P<job_id>\d+) with predecessor JobId: (?P<predecessor>\d+), job type: (?P<function>\w+), is client: (?P<is_client>True|False)\.$'''
fields = { job_id = "int", predecessor = "int" }
examples = [{ msg = "[PRS] Handling results of JobId: 1000123 with predecessor JobId: 0, job type: StateEstimation, is client: False.", fields = { job_id = 1000123, predecessor = 0, is_client = "False" } }]
counter_examples = ["[PRS] Handling results of JobId: 1000123 with predecessor JobId: 0, job type: StateEstimation, is client: Maybe."]

[[template]]
code = "DCR-016"
class = "statistics"
title = "Job result handling timings"
sev = 5
fts = false
regex = '''^\[PRS\]\[DIAG\] Result is handled for (?P<function>\w+), JobId: (?P<job_id>\d+)\. Job's lifespan: (?P<lifespan_s>[\d.]+)s, result handling took: (?P<handling_s>[\d.]+)s\.$'''
fields = { job_id = "int", lifespan_s = "float", handling_s = "float" }
examples = [{ msg = "[PRS][DIAG] Result is handled for LoadFlow, JobId: 1000123. Job's lifespan: 0.25s, result handling took: 0s.", fields = { job_id = 1000123, lifespan_s = 0.25, handling_s = 0.0 } }]
counter_examples = ["[PRS][DIAG] Result is handled for LoadFlow, JobId: x."]

[[template]]
code = "DCR-017"
class = "req_resp"
title = "Job status or progress sent to the client"
sev = 5
fts = false
regex = '''^\[PRS\] JobId: (?P<job_id>\d+) (?P<kind>status|progress) info sent to client\.$'''
fields = { job_id = "int" }
examples = [{ msg = "[PRS] JobId: 1000123 progress info sent to client.", fields = { job_id = 1000123, kind = "progress" } }]
counter_examples = ["[PRS] JobId: 1000123 result info sent to client."]

[[template]]
code = "DCR-018"
class = "error"
title = "Job status could not be sent to the client"
sev = 2
regex = '''^\[PRS\] Error while sending execution status information for JobId: (?P<job_id>\d+) to client\. Client is not reachable\.$'''
fields = { job_id = "int" }
examples = [{ msg = "[PRS] Error while sending execution status information for JobId: 1000123 to client. Client is not reachable.", fields = { job_id = 1000123 } }]
counter_examples = ["[PRS] Error while sending execution status information for JobId: x to client."]

[[template]]
code = "DCR-019"
class = "end"
title = "Calculation job result handled"
sev = 4
sev_field = "status"
sev_map = { DoneWithError = 2, Failed = 2, Aborted = 2, Cancelled = 3, DoneWithWarning = 3, DoneWithSuccess = 4 }
regex = '''^\[CRS\] Handle results of JobId: (?P<job_id>\d+) for function (?P<function>\w+)\. RootId: (?P<root>(?:0x)?[0-9A-Fa-f]{1,16}), job status: (?P<status>\w+)\.$'''
fields = { job_id = "int", root = "hex" }
keys = ["job_id"]
examples = [{ msg = "[CRS] Handle results of JobId: 1000123 for function StateEstimation. RootId: 0x4A00B00C00D00E01, job status: DoneWithError.", fields = { job_id = 1000123, function = "StateEstimation", status = "DoneWithError" } }]
counter_examples = ["[CRS] Handle results of JobId: x for function StateEstimation. RootId: 0x4A, job status: DoneWithError."]

[[template]]
code = "DCR-020"
class = "other"
title = "Load flow results written to the cache"
sev = 5
fts = false
regex = '''^\[CRS\] PU LF Results for job (?P<job_id>\d+) (?:are being|have been) written to cache\.$'''
fields = { job_id = "int" }
examples = [{ msg = "[CRS] PU LF Results for job 1000123 are being written to cache.", fields = { job_id = 1000123 } }, "[CRS] PU LF Results for job 1000123 have been written to cache."]
counter_examples = ["[CRS] PU LF Results for job x are being written to cache."]

[[template]]
code = "DCR-021"
class = "validation"
title = "Job monitor has no cache item for the function and source"
sev = 5
fts = false
regex = '''^\[JobMonitor\] No cache item for function (?P<function>\w+) and source lid (?P<lid>(?:0x)?[0-9A-Fa-f]{1,16})$'''
fields = { lid = "hex" }
examples = [{ msg = "[JobMonitor] No cache item for function TraceFunction and source lid 4A00B00C00D00E01", fields = { function = "TraceFunction" } }]
counter_examples = ["[JobMonitor] Cache item found for function TraceFunction and source lid 4A00B00C00D00E01"]

[[template]]
code = "DCR-022"
class = "req_resp"
title = "Client request to execute or cancel a function received"
sev = 4
regex = '''^\[CJR\] Received Client Request (?:for DMS function execution\. Options type: (?P<options>\w+)|ID: (?P<request_id>\d+) for DMS function cancelation\.)$'''
fields = { request_id = "int" }
examples = [
    { msg = "[CJR] Received Client Request for DMS function execution. Options type: TraceFunctionOptions", fields = { options = "TraceFunctionOptions" } },
    { msg = "[CJR] Received Client Request ID: 700123 for DMS function cancelation.", fields = { request_id = 700123 } },
]
counter_examples = ["[CJR] Received Client Request for DMS function execution."]

[[template]]
code = "DCR-024"
class = "validation"
title = "Cancel request for an unknown client request"
sev = 4  # cleanup of something absent
regex = '''^\[PRMFC-ParallelizationClientRequestManager\]: Unable to cancel request with ID (?P<request_id>\d+)\. Request is not present in callback map\.$'''
fields = { request_id = "int" }
examples = [{ msg = "[PRMFC-ParallelizationClientRequestManager]: Unable to cancel request with ID 700123. Request is not present in callback map.", fields = { request_id = 700123 } }]
counter_examples = ["[PRMFC-ParallelizationClientRequestManager]: Request 700123 cancelled."]

[[template]]
code = "DCR-025"
class = "statistics"
title = "Result handler thread time usage"
sev = 5
fts = false
text = "[PRS][DIAG] Result handler thread time usage:"
examples = ["[PRS][DIAG] Result handler thread time usage:"]
counter_examples = ["[PRS][DIAG] Result handler thread time usage: 3"]

[[template]]
code = "DCR-026"
class = "start"
title = "State estimation triggered for a root"
sev = 4
fts = false
regex = '''^\[SETrigger\] Function will be executed for root (?P<root>(?:0x)?[0-9A-Fa-f]{1,16}), reason: (?P<reason>\w+)$'''
fields = { root = "hex" }
examples = [{ msg = "[SETrigger] Function will be executed for root 0x4A00B00C00D00E01, reason: MeasurementChange", fields = { reason = "MeasurementChange" } }]
counter_examples = ["[SETrigger] Function will not be executed for root 0x4A00B00C00D00E01, reason: MeasurementChange"]

[[template]]
code = "DCR-027"
class = "other"
title = "State estimation time tier: elapsed on a root, schedule and timeouts"
sev = 5
fts = false
regex = '''^SE_TT: (?:T(?P<tier>\d+) elapsed on root (?P<root>(?:0x)?[0-9A-Fa-f]{1,16})(?:\.|, (?P<detail>.*))|(?P<other>SE executions for .*|Redistribute timeout expired!|\.\.\.but, .*))$'''
fields = { tier = "int", root = "hex" }
examples = [
    { msg = "SE_TT: T2 elapsed on root 0x4A00B00C00D00E01.", fields = { tier = 2 } },
    "SE_TT: T1 elapsed on root 0x4A00B00C00D00E01, and there is still significant measurement value change.  SignalID: 4A00B00C00D00E02   Last Value: 119.5   Final Significant Value: 125.5",
    "SE_TT: T3 elapsed on root 0x4A00B00C00D00E01, but there are changes that are not stabilised yet.",
    "SE_TT: SE executions for 12 root(s) scheduled from 10/20/2026 11:35:14 AM to 10/20/2026 11:50:14 AM.",
    "SE_TT: Redistribute timeout expired!",
]
counter_examples = ["SE_TT: unrelated text", "SE_TT: T2 elapsed on root none."]

[[template]]
code = "DCR-030"
class = "other"
title = "Real-time monitoring: change handling, initialization and value updates"
sev = 5
fts = false
regex = '''^\[RTM\] (?:\[RTM_Change\] \[(?P<change>\w+)\] (?:Started handling change|Finished handling change for trafoareas: \[[\d,]*\]\.(?: Elapsed milliseconds: (?P<elapsed_ms>\d+))?)|\[(?:InitializationChange|RealTimeMonitoringData)\] (?P<detail>.*))$'''
fields = { elapsed_ms = "int" }
examples = [
    { msg = "[RTM] [RTM_Change] [TopologyUpdateChange] Finished handling change for trafoareas: [100,200,300]. Elapsed milliseconds: 1180", fields = { change = "TopologyUpdateChange", elapsed_ms = 1180 } },
    "[RTM] [RTM_Change] [ReadingsValueChange] Started handling change",
    "[RTM] [RTM_Change] [ReadingsValueChange] Finished handling change for trafoareas: [100,200].",
    { msg = "[RTM] [InitializationChange] Updating RTMData...", fields = { detail = "Updating RTMData..." } },
    "[RTM] [RealTimeMonitoringData] [UXP] Received value change for signal 1001, but it wasn't present in RTMData",
]
counter_examples = ["[RTM] [RTM_Change] [ReadingsValueChange] Aborted handling change", "[RTM] [Other] Updating RTMData..."]

[[template]]
code = "DCR-032"
class = "other"
title = "Volt/var optimization trigger decision"
sev = 4  # per-element
regex = '''^\[VVOTrigger\] (?:Mode for circuit (?P<circuit>\d+) is not set\. Default profile for No Optimization will be set\.|VVC: Timeout has expired for circuit\(s\): (?P<circuits>[\d, ]+)|VVC: Trigger on violation : VVO will not be triggered for - RootId: (?P<root>(?:0x)?[0-9A-Fa-f]{1,16}), and circuits: (?P<trigger_circuits>[\d, ]+) because it's in NoOptimization mode\.)$'''
fields = { circuit = "int", root = "hex" }
examples = [
    { msg = "[VVOTrigger] Mode for circuit 1001 is not set. Default profile for No Optimization will be set.", fields = { circuit = 1001 } },
    "[VVOTrigger] VVC: Timeout has expired for circuit(s): 1001, 1002",
    "[VVOTrigger] VVC: Trigger on violation : VVO will not be triggered for - RootId: 0x4A00B00C00D00E01, and circuits: 1001 because it's in NoOptimization mode.",
]
counter_examples = ["[VVOTrigger] Mode for circuit x is not set."]

[[template]]
code = "DCR-033"
class = "other"
title = "Volt/var control timeouts redistributed"
sev = 5
fts = false
regex = '''^VVC: (?:Timeout has expired for redistribution|Redistributing VVC Timeouts\.\.\. (?P<waiting>\d+) VVC calculations are waiting for execution\. They will be redistributed equally in next (?P<seconds>\d+) seconds\.)$'''
fields = { waiting = "int", seconds = "int" }
examples = [
    { msg = "VVC: Redistributing VVC Timeouts... 174 VVC calculations are waiting for execution. They will be redistributed equally in next 900 seconds.", fields = { waiting = 174, seconds = 900 } },
    "VVC: Timeout has expired for redistribution",
]
counter_examples = ["VVC: Redistributing VVC Timeouts... many VVC calculations are waiting."]

[[template]]
code = "DCR-034"
class = "lifecycle"
title = "Power apps cleaner activated"
sev = 5
fts = false
regex = '''^\[CLN\] PowerApps Cleaner was activated: (?P<cleaned>\d+)/(?P<total>\d+) job was cleaned\.$'''
fields = { cleaned = "int", total = "int" }
examples = [{ msg = "[CLN] PowerApps Cleaner was activated: 0/2 job was cleaned.", fields = { cleaned = 0, total = 2 } }]
counter_examples = ["[CLN] PowerApps Cleaner was activated: x/y job was cleaned."]

[[template]]
code = "DCR-035"
class = "end"
title = "EMS state estimation finished after a topology change"
sev = 4
sev_field = "status"
sev_map = { DoneWithError = 2, Failed = 2, Aborted = 2, Cancelled = 3, DoneWithWarning = 3, DoneWithSuccess = 4 }
regex = '''^\[ECT\] EMS SE function has been finished for rootId: (?P<root>(?:0x)?[0-9A-Fa-f]{1,16}) with status (?P<status>\w+), as a result of (?P<cause>\w+)$'''
fields = { root = "hex" }
examples = [{ msg = "[ECT] EMS SE function has been finished for rootId: 0x4A00B00C00D00E02 with status DoneWithSuccess, as a result of TopologyChange", fields = { status = "DoneWithSuccess", cause = "TopologyChange" } }]
counter_examples = ["[ECT] EMS SE function has been started for rootId: 0x4A00B00C00D00E02"]

[[template]]
code = "DCR-036"
class = "other"
title = "Topology change notification handled by the calculation triggers"
sev = 5
fts = false
regex = '''^(?:\[EMSBCT\]|\[EMSFCT\]|\[EST\]|\[DSMT\]|\[TCN\]|\[RootsDiary\]|\[TopologyChangeSubscriber\]|\[ECT\] EMS Contingency|\[RTM\] \[TopologyUpdateProvider\]|--- Topology changed notification received ---|Root ID:)(?P<detail>.*)$'''
examples = [
    { msg = "--- Topology changed notification received ---", fields = { detail = "" } },
    "[EMSBCT]: Add job for transmission network in queue as a result of topology change.",
    "[DSMT]: DMS topology changed notification has been received.",
    "[TCN] LoadFlow will be executed for root 0x4A00B00C00D00E01, reason: TopologyChange",
    "[RootsDiary] Received updated roots. Number of roots: 4",
    "[TopologyChangeSubscriber] Not affected roots: ",
    "Root ID:0x4A00B00C00D00E01, Root status: Changed",
]
counter_examples = ["[ECT] EMS SE function has been finished for rootId: 0x4A00B00C00D00E02 with status DoneWithSuccess, as a result of TopologyChange"]

[[template]]
code = "DCR-044"
class = "validation"
title = "Results cache summarizer found no children for a circuit"
sev = 4  # per-element
fts = false
regex = '''^\[ResultsCacheSummarizer GetChildrenIds\] No children for Circuit id: (?P<circuit>(?:0x)?[0-9A-Fa-f]{1,16})$'''
fields = { circuit = "hex" }
examples = ["[ResultsCacheSummarizer GetChildrenIds] No children for Circuit id: 4A00B00C00D00E01"]
counter_examples = ["[ResultsCacheSummarizer GetChildrenIds] Children found for Circuit id: 4A00B00C00D00E03"]
[[template]]
code = "DCR-037"
class = "lifecycle"
title = "Model update participant phase (annual schedule, contingency analysis, power apps caches)"
sev = 5
fts = false
window = 400
regex = '''^\[(?:ASC|ECC|CPC)\]:? (?!.*(?:[Ff]ail|[Ee]rror|[Ee]xception))(?P<detail>.+)$'''
examples = [
    { msg = "[ASC] Prepare phase in AnnualScheduleCache started.", fields = { detail = "Prepare phase in AnnualScheduleCache started." } },
    "[ECC]: Commit method of model update procedure has been succeeded.",
    "[CPC]: Prepare for model update",
]
counter_examples = ["[ABC] Prepare phase in AnnualScheduleCache started.", "[ASC] Prepare phase in AnnualScheduleCache failed."]

[[template]]
code = "DCR-038"
class = "other"
title = "Closed-loop volt/var, hosting capacity, circuits cache, model readiness, tags and historical configuration"
sev = 5
fts = false
regex = '''^(?:\[VVOClosedLoop(?:Runtime|Control)\]|\[HostingCapacity => HostingCapacityCache\]|\[CircuitsCache\]|CircuitProfileAssignmentEditor -|\[MRResultHandler\]|\[TagResourceManager\]|\[HistoricalConfigurationService\]|Creating of StaticInternalModel) (?P<detail>.+)$'''
examples = [
    { msg = "[VVOClosedLoopControl] Synchronizing circuits and assignments started.", fields = { detail = "Synchronizing circuits and assignments started." } },
    "[HostingCapacity => HostingCapacityCache] Insertion process lasted 40ms.",
    "[CircuitsCache] No DER groups defined in network",
    "CircuitProfileAssignmentEditor - Execute: Transaction execute finished.",
    "[MRResultHandler] No circuit found in input results.",
    "[TagResourceManager] Tag transaction - Commit.",
    "[HistoricalConfigurationService] GetExtentValuesWithLv HISTTYPECONFIG from history.",
    "Creating of StaticInternalModel Started",
]
counter_examples = ["[VVOClosedLoopOther] Synchronizing circuits.", "Creating of StaticInternalModel"]

[[template]]
code = "DCR-040"
class = "other"
title = "Outage provider auto FLISR outage added or removed"
sev = 4
fts = false
regex = '''^\[OutageProvider\] (?P<action>Added|Removed) auto flisr outage on feeder (?P<feeder>[0-9A-Fa-f]+)$'''
examples = [{ msg = "[OutageProvider] Added auto flisr outage on feeder 1A00B00C", fields = { action = "Added" } }]
counter_examples = ["[OutageProvider] Updated auto flisr outage on feeder 1A00B00C"]

[[template]]
code = "DCR-041"
class = "other"
title = "Remote ADMS input manager and system unavailability queries"
sev = 5
fts = false
regex = '''^(?:\[RemoteInputADMSManager\] (?:Collecting AINPUTADMS|Found (?P<found>\d+) AINPUTADMS|Detected appropriate model update)|GetSystemUnavailableIntervals called)$'''
fields = { found = "int" }
examples = [
    { msg = "[RemoteInputADMSManager] Found 3 AINPUTADMS", fields = { found = 3 } },
    "[RemoteInputADMSManager] Collecting AINPUTADMS",
    "GetSystemUnavailableIntervals called",
]
counter_examples = ["[RemoteInputADMSManager] Found none AINPUTADMS"]

# ---------------------------------------------------------------------------------------------
# ModelTopologyService (DCR-100..129)
# ---------------------------------------------------------------------------------------------

[[template]]
code = "DCR-100"
class = "statistics"
title = "Operational model created for roots, levels or elements"
sev = 5
fts = false
