[[template]]
code = "DCR-370"
class = "other"
title = "Tag publication received for a signal"
sev = 5
fts = false
regex = '''^TASSubscriber - PublicationHandler: Publication received for signal \(gid = (?P<gid>\d+)\), tagId = (?P<tag_id>\d+), tagCatalogId = (?P<catalog_id>\d+), tagSemantic = (?P<semantic>.*)$'''
fields = { tag_id = "int", catalog_id = "int" }
examples = [{ msg = "TASSubscriber - PublicationHandler: Publication received for signal (gid = 10000123), tagId = 10000124, tagCatalogId = 10000125, tagSemantic = DoNotAutoClose, WarnOnOpen", fields = { gid = "10000123", tag_id = 10000124, catalog_id = 10000125, semantic = "DoNotAutoClose, WarnOnOpen" } }]
counter_examples = ["TASSubscriber - PublicationHandler: Publication received for signal (gid = x), tagId = 1, tagCatalogId = 2, tagSemantic = A"]

[[template]]
code = "DCR-371"
class = "lifecycle"
title = "Control sequence transaction command phase"
sev = 5
fts = false
regex = '''^ControlSequenceTransactionCommand - (?P<phase>Execute|prepare|Commit|Rollback) (?P<edge>started|finished)$'''
examples = [{ msg = "ControlSequenceTransactionCommand - prepare started", fields = { phase = "prepare", edge = "started" } }]
counter_examples = ["ControlSequenceTransactionCommand - verify started"]

[[template]]
code = "DCR-372"
class = "lifecycle"
title = "Interlocking rules loaded and control sequence cache initialized"
sev = 5
fts = false
regex = '''^(?:\(NDS\) Interlocking manager loaded (?P<rules>\d+) rules\.|\[ControlSequenceManager\] - InitializeCacheData: (?:Initializing cache\.\.\.|Cache initialized\.))$'''
fields = { rules = "int" }
examples = [
    { msg = "(NDS) Interlocking manager loaded 12 rules.", fields = { rules = 12 } },
    "[ControlSequenceManager] - InitializeCacheData: Cache initialized.",
]
counter_examples = ["(NDS) Interlocking manager loaded some rules."]

[[template]]
code = "DCR-373"
class = "lifecycle"
title = "Dynamics subscriber restarted"
sev = 5
fts = false
regex = '''^\[NDSSubscriber\] RestartSubscriber: (?:Subscriber is restarted\.|Reinitializing topics\.\.\. Subscriber is going to be stopped\. Topic signals:.*)$'''
examples = ["[NDSSubscriber] RestartSubscriber: Subscriber is restarted.", "[NDSSubscriber] RestartSubscriber: Reinitializing topics... Subscriber is going to be stopped. Topic signals: "]
counter_examples = ["[NDSSubscriber] RestartSubscriber: Subscriber is stopped."]

[[template]]
code = "DCR-374"
class = "error"
title = "Subscriber disconnected because the publisher could not be reached"
sev = 2
sev_field = "on_demand"
sev_map = { True = 4, False = 2 }
regex = '''^(?:\[NDSSubscriber\]|TASSubscriber -) OnSubscriberDisconnected: Subscriber disconnected, onUserDemand = (?P<on_demand>True|False)\. Reason: (?P<reason>.*)$'''
examples = [
    { msg = "[NDSSubscriber] OnSubscriberDisconnected: Subscriber disconnected, onUserDemand = False. Reason: Subscriber(ExamplePubSub) failed to connect to the service with an exception: ", fields = { on_demand = "False" } },
    "[NDSSubscriber] OnSubscriberDisconnected: Subscriber disconnected, onUserDemand = True. Reason: User requested disconnect",
]
counter_examples = ["[NDSSubscriber] OnSubscriberConnected: Subscriber connected."]

[[template]]
code = "DCR-375"
class = "lifecycle"
title = "Control sequence model update version switch"
sev = 5
fts = false
regex = '''^ModelUpdateService - (?:SwitchVersion: Switching from (?P<from_version>\d+) to (?P<to_version>\d+) version, MDC: (?P<mdc>\d+)|ApplyUpdates: Applying model updates\.\.\. Model version ID: (?P<version>\d+), MDC: (?P<apply_mdc>\d+))$'''
examples = [
    { msg = "ModelUpdateService - SwitchVersion: Switching from 1000123 to 1000124 version, MDC: 1000125", fields = { mdc = "1000125" } },
    "ModelUpdateService - ApplyUpdates: Applying model updates... Model version ID: 1000124, MDC: 1000125",
]
counter_examples = ["ModelUpdateService - SwitchVersion: Switching from x to y version, MDC: z"]

# ---------------------------------------------------------------------------------------------
# Event rules
# ---------------------------------------------------------------------------------------------

# A calculation job submitted to the job launcher and its status report (CoreFunctions): measured
# on a real-time case, almost every submitted job has exactly one status report with the same job
# id, never before the submit; the 99.9th percentile of the distance is well under 60 s.
[[link_rule]]
kind = "response"
a = "DCR-010"
b = "DCR-011"
key = "job_id"
max_dt_ms = 60000
