[[template]]
code = "DCR-345"
class = "lifecycle"
title = "Export service configuration request handling"
sev = 5
fts = false
regex = '''^\[ExportService\] (?!Failed to get )(?!Request configuration on model update)(?!.*(?:[Ff]ail(?!over)|rror|xception|imeout|[Uu]nable|annot|ould not|bort|nvalid|lost|enied|ejected|WARN|arning))(?P<detail>.*)$'''
window = 720
examples = [{ msg = "[ExportService] Process configuration request: SendUpdateConfiguration. Next request would be: None.", fields = { detail = "Process configuration request: SendUpdateConfiguration. Next request would be: None." } }]
counter_examples = ["[ExportService] Failed to get ExampleEntity.Status enum for enum code: 0."]

[[template]]
code = "DCR-346"
class = "validation"
title = "No destination info for a replication client"
sev = 3
regex = '''^WARNING \[RouteID:(?P<route_id>\d+), Dataset:(?P<dataset>\d+), Dataflow:(?P<dataflow>\d+)\] RequestIU: No destination info for client with ID: (?P<client_id>\d+) .*$'''
fields = { route_id = "int", dataset = "int", dataflow = "int", client_id = "int" }
examples = [{ msg = "WARNING [RouteID:0, Dataset:10, Dataflow:7] RequestIU: No destination info for client with ID: 4 (the client on destination side doesn't propagate it).", fields = { route_id = 0, dataset = 10, dataflow = 7, client_id = 4 } }]
counter_examples = ["[RouteID:0, Dataset:10, Dataflow:7] RequestIU: No destination info for client with ID: 4 (x)."]

