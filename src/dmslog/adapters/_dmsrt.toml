regex = '''^\[CircularQueueReplicator\] ?(?=[SQPRFBUR])(?P<event>Starting QueueReplicator\.|QueueReplicator successfully started\.|Partner machine exists \(service: \w+\) and its state is \w+\.|(?:Raising|Finished raising of) IUSource(?:Started|Finished) event\.|Block threads to prevent changing queues until IU is finished\.|Unblocked threads that want to change queues\. Queue replication in IU is finished\.|System in hot state\. Waiting replication queue drain to finish\.|Queue draining finished\.|Replication queue draining finished\.)$'''
examples = [
