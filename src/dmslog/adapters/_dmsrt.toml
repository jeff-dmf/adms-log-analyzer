[[template]]
code = "RTL-038"
class = "other"
title = "Block fetcher step"
sev = 5
regex = '''^\[BlockFetcher\] (?=[BFIRS])(?:Fetching specific blocks count: (?P<blocks>\d+), tasks: (?P<tasks>\d+), blocks per task: (?P<per_task>\d+)\.|Blocks splited, segment size: (?P<segment_size>\d+), number of segments: (?P<segments>\d+)|Releasing block ID list|Initializing block list for model update|Block ID list (?:released|initialized|fetched)|Fetching block list from NMS|Splitting block list, (?P<kind>delta|initial) segment size \((?P<all_marker>\d+) = all blocks in one segment\): (?P<split_size>\d+), block count (?P<block_count>\d+))$'''
fields = { blocks = "int", tasks = "int", per_task = "int", segment_size = "int", segments = "int", split_size = "int", block_count = "int" }
examples = [
    { msg = "[BlockFetcher] Fetching specific blocks count: 20, tasks: 4, blocks per task: 5.", fields = { blocks = 20, tasks = 4, per_task = 5 } },
    { msg = "[BlockFetcher] Splitting block list, delta segment size (0 = all blocks in one segment): 200, block count 267", fields = { kind = "delta", split_size = 200, block_count = 267 } },
    "[BlockFetcher] Block ID list released",
    "[BlockFetcher] Initializing block list for model update",
]
counter_examples = ["[BlockFetcher] Block ID list lost"]

[[template]]
code = "RTL-039"
class = "other"
title = "Smart cache configurator step"
