# ============================================================================================
# Configuration manager (the model configuration seen from the RT services)
# ============================================================================================

[[template]]
code = "RTL-034"
class = "other"
title = "Configuration manager fetches data of the network management system"
sev = 5
regex = '''^\[Configuration\] \[ConfigurationManager\] Fetching (?:(?P<age>old|new) )?NMS [Dd]ata for (?:(?P<scope>inserted|updated) (?P<entity>\w+)|affected) entities (?P<phase>started|finished)\.(?: Entities count: (?P<count>\d+))?$'''
fields = { count = "int" }
examples = [
    { msg = "[Configuration] [ConfigurationManager] Fetching NMS Data for inserted EXAMPLEKIND1 entities finished. Entities count: 7", fields = { scope = "inserted", entity = "EXAMPLEKIND1", phase = "finished", count = 7 } },
    "[Configuration] [ConfigurationManager] Fetching old NMS Data for updated EXAMPLEKIND2 entities started.",
    "[Configuration] [ConfigurationManager] Fetching NMS data for affected entities started.",
]
counter_examples = ["[Configuration] [ConfigurationManager] Fetching NMS Data for inserted EXAMPLEKIND1 entities paused."]

[[template]]
code = "RTL-035"
class = "other"
title = "Configuration processor phase"
sev = 5
regex = '''^\[Configuration\] \[ConfigurationManager\] ?(?P<processor>\w+) (?P<phase>Started|Finished) (?:process type: (?P<entity>\w+)|(?P<stage>execute phase|prepare phase|commit phase|execute finished phase))$'''
examples = [
    { msg = "[Configuration] [ConfigurationManager]ExampleConfigurationProcessor Started process type: EXAMPLEKIND1", fields = { processor = "ExampleConfigurationProcessor", phase = "Started", entity = "EXAMPLEKIND1" } },
    { msg = "[Configuration] [ConfigurationManager]ExampleConfigurationProcessor Finished execute phase", fields = { stage = "execute phase" } },
]
counter_examples = ["[Configuration] [ConfigurationManager]ExampleConfigurationProcessor Paused execute phase"]

[[template]]
code = "RTL-036"
class = "other"
title = "Configuration manager transaction step"
sev = 5
regex = '''^\[Configuration\] \[ConfigurationManager\] (?=[\[SEPCA])(?:\[(?P<processor>\w+)\] Add additional entities (?P<phase>started|finished)\.|SetData method finished successfully\.|(?P<method>Execute|Prepare|Commit) method called\.\.\.|Applying changes to reference graph builder (?P<graph_phase>started|finished)\.|SetData - from version ID: (?P<from_id>\d+), to version ID: (?P<to_id>\d+), MDC: (?P<mdc>\d+), SMDC: (?P<smdc>\d+)\.)$'''
fields = { from_id = "int", to_id = "int", mdc = "int", smdc = "int" }
examples = [
    { msg = "[Configuration] [ConfigurationManager] SetData - from version ID: 1000001, to version ID: 1000002, MDC: 1000003, SMDC: 0.", fields = { from_id = 1000001, to_id = 1000002, mdc = 1000003, smdc = 0 } },
    { msg = "[Configuration] [ConfigurationManager] Prepare method called...", fields = { method = "Prepare" } },
    { msg = "[Configuration] [ConfigurationManager] [ExampleProcessor] Add additional entities started.", fields = { processor = "ExampleProcessor", phase = "started" } },
    "[Configuration] [ConfigurationManager] Applying changes to reference graph builder finished.",
]
counter_examples = ["[Configuration] [ConfigurationManager] Rollback method called..."]

[[template]]
code = "RTL-037"
class = "other"
title = "Reference graph builder changes"
sev = 5
regex = '''^\[Configuration\] \[ReferenceGraphBuilder\] (?:Applying changes for class: (?P<class_name>\w+), inserted nodes: (?P<inserted>\d+), updated nodes: (?P<updated>\d+), deleted nodes: (?P<deleted>\d+)|Finished Applying changes for class: (?P<done_class>\w+)\.)$'''
fields = { inserted = "int", updated = "int", deleted = "int" }
examples = [
    { msg = "[Configuration] [ReferenceGraphBuilder] Applying changes for class: EXAMPLEKIND1, inserted nodes: 11, updated nodes: 0, deleted nodes: 6", fields = { class_name = "EXAMPLEKIND1", inserted = 11, updated = 0, deleted = 6 } },
    "[Configuration] [ReferenceGraphBuilder] Finished Applying changes for class: EXAMPLEKIND1.",
]
counter_examples = ["[Configuration] [ReferenceGraphBuilder] Applying changes for class: EXAMPLEKIND1, inserted nodes: x"]

