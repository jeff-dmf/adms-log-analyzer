]
counter_examples = ["[PublisherIntegrityUpdateHandler] New integrity update request dropped."]

[[template]]
code = "RTL-041"
class = "other"
title = "Circular queue replicator data"
sev = 5
regex = '''^\[CircularQueueReplicator\] ?(?=[DSQ])(?:Destination Head: (?P<head>\d+), Tail: (?P<tail>\d+), Queue: (?P<queue>\d+)|Sending BulkEnqueue message\. Uncompressed message size: (?P<size>\d+), Number of elements: (?P<elements>\d+)\.|Queue with type: (?P<queue_type>\d+) applied BulkEnqueue command\. Number of elements: (?P<applied_elements>\d+)\.|Destination and source queue of type (?P<same_queue_type>\d+) are same\.)$'''
fields = { head = "int", tail = "int", queue = "int", size = "int", elements = "int", queue_type = "int", applied_elements = "int", same_queue_type = "int" }
examples = [
    { msg = "[CircularQueueReplicator] Destination Head: 68, Tail: 70, Queue: 2", fields = { head = 68, tail = 70, queue = 2 } },
    { msg = "[CircularQueueReplicator] Sending BulkEnqueue message. Uncompressed message size: 2048, Number of elements: 9.", fields = { size = 2048, elements = 9 } },
    "[CircularQueueReplicator] Queue with type: 3 applied BulkEnqueue command. Number of elements: 9.",
    "[CircularQueueReplicator] Destination and source queue of type 1 are same.",
]
counter_examples = ["[CircularQueueReplicator] Destination Head: x, Tail: 70, Queue: 2"]

[[template]]
