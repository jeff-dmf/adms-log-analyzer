[[template]]
code = "RTL-040"
class = "other"
title = "Publisher integrity update request merged"
sev = 5
regex = '''^\[PublisherIntegrityUpdateHandler\] New integrity update request merged with (?P<target>executing|pending) request\. New request: originator: (?P<originator>[0-9a-fA-F-]{36}) topics count: (?P<topics>\d+) clients \((?P<clients>\d+)\): .*$'''
fields = { originator = "guid", topics = "int", clients = "int" }
examples = [
