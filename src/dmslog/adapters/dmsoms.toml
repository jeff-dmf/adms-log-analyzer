fts = false
regex = '''^\[(?P<scope>SDP Cleanup|SDP Publications|TR Publication|TR Cleanup)\]: (?P<what>Outage time|Restoration time|Status) - count: (?P<value>[\w:.-]+(?: [\w:.-]+)?) - (?P<count>\d+)$'''
fields = { count = "int" }
examples = [
    { msg = "[SDP Cleanup]: Outage time - count: 2026-01-02 03:04:05.000 - 4", fields = { scope = "SDP Cleanup", what = "Outage time", value = "2026-01-02 03:04:05.000" } },
    "[TR Publication]: Status - count: TA_ENERGIZED - 12",
]
counter_examples = ["[SDP Cleanup]: Outage time - count: none"]

[[template]]
code = "DOM-008"
class = "statistics"
title = "Disconnected service delivery points of a publication"
