class = "lifecycle"
title = "ETR of an incident set by the calculation"
sev = 4
regex = '''^For incident (?P<gid>\d+) ETR is set to (?P<etr>[\d/]+ [\d:]+ [AP]M) \(UTC\)\. See below for more details about ETR calculation\.$'''
fields = { gid = "int" }
keys = [{ field = "gid", type = "incident_gid" }]
examples = [{ msg = "For incident 1000123 ETR is set to 10/19/2026 11:00:00 PM (UTC). See below for more details about ETR calculation.", fields = { gid = 1000123 } }]
counter_examples = ["For incident 1000123 ETR is not set."]

[[template]]
