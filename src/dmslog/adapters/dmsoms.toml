fields = { gid = "int" }
examples = [
    { msg = "[IncidentStatusTransitionValidator_Example] Validation of transition from status 1000001 to status 1000002 for entity 1000123 started. LifecycleID: 1000003.", fields = { kind = "Incident", gid = 1000123 } },
    "[ProblemStatusTransitionValidator] Validation of transition from status 1000001 to status 1000002 for entity 1000124 started.",
]
counter_examples = ["[IncidentStatusTransitionValidator_Example] Validation of transition from status a to status b for entity 1 started."]

[[template]]
code = "DOM-010"
class = "end"
title = "Status transition validation finished"
sev = 4
regex = '''^\[(?P<kind>Incident|Problem)StatusTransitionValidator(?:_\w+)?\] Validation of status transition for entity (?P<gid>\d+) finished\.$'''
fields = { gid = "int" }
examples = [
    { msg = "[IncidentStatusTransitionValidator_Example] Validation of status transition for entity 1000123 finished.", fields = { kind = "Incident", gid = 1000123 } },
    "[ProblemStatusTransitionValidator] Validation of status transition for entity 1000124 finished.",
]
counter_examples = ["[IncidentStatusTransitionValidator_Example] Validation of status transition for entity 1000123 started."]

[[template]]
