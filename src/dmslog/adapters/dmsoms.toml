# Real-time OMS-side services (family DMSOMS): OMS_IncidentManagementService (IMS),
# OMS_CrewManagementService (CRS), DMS_OutageProcessingService (OPS), DMS_WorkManagementService
# (WMS), DMS_MajorEventService (MES), DMS_SmartMeterManagementService (SMMS) and
# DMS_AlarmsEventsService (AES), normal and sensitive streams. Design:
# docs/notas/rt-templates-desenho.md.
#
# Codes: DOM-001..049 IMS, 050..099 WMS, 100..114 OPS, 115..139 CRS, 140..159 AES, 160..184 SMMS,
# 185..209 MES; the sensitive streams use the same ranges with an S (DOM-S001..S019 IMS, S050 WMS,
# S100..S104 OPS, S115 CRS, S140 AES, S160 SMMS). Correlation keys (only on life-cycle, creation,
# archive, status and failure lines, never on per-line tracing): `incident_gid`, `inc`, `gid`
# (signals and outages of the OPS), `job_id` (FLISR/prediction functions that cross to the
# FunctionHost). Infrastructure lines shared with other real-time families belong to `_dmsrt`, not
# to this file. Per-line tracing (queue workers, handler durations, cache statistics) is sev 5 and
# `fts = false` when it passes 50 thousand records.

schema = 1
family = "DMSOMS"
description = "OMS-side real-time services: incidents, crews, outages, work, major events, smart meters and alarms"
extends = ["_dmsrt", "_common"]

# ---------------------------------------------------------------------------------------------
# IncidentManagementService, normal stream (DOM-001..049)
# ---------------------------------------------------------------------------------------------

[[template]]
code = "DOM-001"
class = "other"
title = "Publisher manager read no incidents or problems of the day-after-restoration list"
sev = 5
fts = false
text = "[PublisherManager]: Got DAR incidents:  and DAR problems:  from DB."
examples = ["[PublisherManager]: Got DAR incidents:  and DAR problems:  from DB."]
counter_examples = ["[PublisherManager]: Got DAR incidents:  and DAR problems:  from cache."]

[[template]]
code = "DOM-002"
class = "other"
title = "Delta applied to the cache (operations by element)"
sev = 5
fts = false
regex = '''^ApplyDelta (?P<operations>(?:Inserted|Updated|Deleted): [\w:;, ]+)$'''
examples = [
    "ApplyDelta Inserted: 0x615:6;",
    "ApplyDelta Inserted: 0x61A:3, 0x61B:3; Updated: 0x44:12;",
    "ApplyDelta Updated: 0x44:12; Deleted: 0x45:2, 0x46:2;",
]
counter_examples = ["ApplyDelta nothing to do"]

[[template]]
code = "DOM-003"
class = "other"
title = "Historical query engine call (insert by table, feeder data)"
sev = 5
fts = false
regex = '''^HQE: method (?P<method>\w+) (?:(?P<phase>started|finished)(?: for (?P<table>\w+)(?:: \d+)?)?|updating (?P<done>\d+) from (?P<total>\d+) feeders)\.$'''
fields = { done = "int", total = "int" }
examples = [
    { msg = "HQE: method BulkInsert started for INCIDENT_EXT.", fields = { method = "BulkInsert", phase = "started", table = "INCIDENT_EXT" } },
    "HQE: method BulkInsert finished.",
    "HQE: method ProcedureInsert started for INCIDENT: 1000123.",
    "HQE: method SetFeederDynamicData updating 25 from 649 feeders.",
]
counter_examples = ["HQE: method BulkInsert aborted."]

[[template]]
code = "DOM-004"
class = "req_resp"
title = "Replication request enqueued for primary processing"
sev = 5
fts = false
regex = '''^IMS replication: Enqueuing request (?P<request>\d+) operation (?P<operation>\w+) for primary processing\.$'''
fields = { request = "int" }
examples = [{ msg = "IMS replication: Enqueuing request 1000123 operation Add for primary processing.", fields = { request = 1000123, operation = "Add" } }]
counter_examples = ["IMS replication: Enqueuing request x operation Add for primary processing."]

[[template]]
code = "DOM-005"
class = "req_resp"
title = "Replication requests processed or approved"
sev = 5
fts = false
regex = '''^IMS replication: (?:Auto approved requests (?P<auto>\d+)|Processed requests: (?P<processed>\d+)-(?P<decision>\w+)-(?P<ack>\w+)|Skipping primary cache command\. Handler not registered|Replication IU finished|Primary cache request synchronization started)\.$'''
fields = { auto = "int", processed = "int" }
examples = [
    { msg = "IMS replication: Auto approved requests 3.", fields = { auto = 3 } },
    "IMS replication: Processed requests: 2-Approved-AcknowledgedByPrimary.",
    "IMS replication: Skipping primary cache command. Handler not registered.",
    "IMS replication: Replication IU finished.",
]
counter_examples = ["IMS replication: Processed requests: two-Approved."]

[[template]]
code = "DOM-006"
class = "req_resp"
title = "Request rejected automatically"
sev = 4
regex = '''^Request: (?P<request>\d+) : (?P<ref>REQ \d+) auto rejected\.$'''
fields = { request = "int" }
examples = [{ msg = "Request: 1000123 : REQ 1000124 auto rejected.", fields = { request = 1000123, ref = "REQ 1000124" } }]
counter_examples = ["Request: 1000123 : REQ 1000124 accepted."]

[[template]]
code = "DOM-007"
class = "statistics"
title = "Outage time, restoration time or energization status count of a publication or cleanup"
