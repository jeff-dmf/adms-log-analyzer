fields = { gid = "int", new_gid = "int" }
keys = [{ field = "gid", type = "incident_gid" }, { field = "new_gid", type = "incident_gid" }]
examples = [
    { msg = "Creation of new Incident starting.", fields = { phase = "starting" } },
    "Creation of new Incident (GID: 1000123) finished successfully.",
    "Started creating new incidents below feeder (GID:1000200).",
    "Creation of 2 new incidents below feeder (GID:1000200) from 3 trouble event(s) is finished.",
