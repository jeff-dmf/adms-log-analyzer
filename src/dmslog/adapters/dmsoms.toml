    "[IncidentStatusTransitionValidator_Example] There are no FLISR/LAR outages in Automatic mode for Incident (GID: 1000123).",
]
counter_examples = ["[IncidentStatusTransitionValidator_Example] Checking the incident (GID: 1000123)."]

