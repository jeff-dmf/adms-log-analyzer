[[template]]
code = "DOM-186"
class = "other"
title = "Fire mitigation not licensed or job not executed on a standby server"
sev = 5
fts = false
regex = '''^(?:\[FM\] Automatic Fire Mitigation is not licensed!|Job (?P<job>[\w.]+) not executed because AmIHot = (?P<hot>True|False) and DatasetOwner = (?P<owner>True|False))$'''
examples = [
    "[FM] Automatic Fire Mitigation is not licensed!",
    "Job ExampleServices.MajorEventService.MESJobExecuteFireMitigationFunction not executed because AmIHot = False and DatasetOwner = True",
]
counter_examples = ["[FM] Automatic Fire Mitigation is licensed!"]

[[template]]
code = "DOM-187"
class = "start"
title = "Fire mitigation initiated for feeders"
sev = 4
regex = '''^\[FM\] (?:FireMitigation will be initiated for: (?P<feeders>\d+) feeders!|Initial Scheduled triggers\.)$'''
fields = { feeders = "int" }
examples = [
    { msg = "[FM] FireMitigation will be initiated for: 3 feeders!", fields = { feeders = 3 } },
    "[FM] Initial Scheduled triggers.",
]
counter_examples = ["[FM] FireMitigation was initiated."]

[[template]]
code = "DOM-188"
class = "other"
title = "Tag added, updated or removed for a signal of the major event service"
sev = 4
regex = '''^(?P<signal_type>HotLineTag Signal|HotLineTag|ReclosingEnabled|Enabled|ControlActiveSetting) signal: (?P<signal>(?:0x)?[0-9A-Fa-f]{1,16})\. (?P<action>Update|Add|Remove) Tag ID: (?P<tag>(?:0x)?[0-9A-Fa-f]{1,16})\.(?: Catalog: (?P<catalog>(?:0x)?[0-9A-Fa-f]{1,16})\.)?(?: Tag Link Ids:(?P<link_ids>[^.]*)\. Tag Link Names:(?P<link_names>[^.]*)\.)?$'''
fields = { signal = "hex", tag = "hex", catalog = "hex" }
examples = [
    { msg = "HotLineTag signal: 4A00B00C00D00E01. Add Tag ID: 4A00B00C00D00E02. Catalog: 4A00B00C00D00E03. Tag Link Ids: . Tag Link Names: .", fields = { signal_type = "HotLineTag", action = "Add" } },
    "ReclosingEnabled signal: 12345678. Remove Tag ID: 4A00B00C00D00E02.",
    "ControlActiveSetting signal: 4A00B00C00D00E01. Add Tag ID: 4A00B00C00D00E02. Catalog: 4A00B00C00D00E03.",
]
counter_examples = ["HotLineTag signal: 4A00B00C00D00E01. Move Tag ID: 4A00B00C00D00E02."]

[[template]]
code = "DOM-189"
class = "lifecycle"
title = "Model change status published (switch, close, update)"
sev = 4
regex = '''^ModelChangeStatus: (?P<status>\w+), ModelChangeMessage: (?P<message>\w+), ModelVersion:(?: (?P<version>.+))?$'''
examples = [
    { msg = "ModelChangeStatus: SwitchVersion, ModelChangeMessage: SwitchVersion, ModelVersion: Release 1000123", fields = { status = "SwitchVersion", message = "SwitchVersion" } },
    "ModelChangeStatus: TemporaryElementsUpdate, ModelChangeMessage: ApplyUpdatesTE, ModelVersion:",
]
counter_examples = ["ModelChangeStatus: SwitchVersion"]

[[template]]
code = "DOM-190"
class = "statistics"
title = "Counts of the dynamic model handler after a model change"
sev = 5
regex = '''^\[DynamicModel Handler\]: (?P<what>\w+(?: Areas)?)(?: signals)? count: (?P<count>\d+)$'''
fields = { count = "int" }
examples = [
    { msg = "[DynamicModel Handler]: RiskLevel signals count: 0", fields = { what = "RiskLevel", count = 0 } },
    "[DynamicModel Handler]: Mitigation Areas count: 12",
]
counter_examples = ["[DynamicModel Handler]: RiskLevel signals total: 0"]

[[template]]
code = "DOM-191"
class = "validation"
title = "Breaker in the exclusion list"
sev = 4  # per-element
regex = '''^Breaker: (?P<gid>(?:0x)?[0-9A-Fa-f]{1,16})\. In exclusion list: (?P<excluded>True|False)\.$'''
fields = { gid = "hex" }
examples = [
    { msg = "Breaker: 4A00B00C00D00E01. In exclusion list: True.", fields = { excluded = "True" } },
    "Breaker: 12345678. In exclusion list: False.",
]
counter_examples = ["Breaker: 4A00B00C00D00E01. Not in exclusion list."]

[[template]]
code = "DOM-192"
class = "error"
title = "Unhandled exception during a major event job"
sev = 2
regex = '''^Unhandled exception occurred during MEM job execution, exception info: (?P<detail>.+)$'''
examples = [
    "Unhandled exception occurred during MEM job execution, exception info: System.ServiceModel.FaultException`1[Example.Fault]: Tag actions are not allowed on servers that are not in HOT status.",
]
counter_examples = ["Unhandled exception occurred during the job."]

[[template]]
code = "DOM-193"
class = "lifecycle"
title = "Major event service enlistment, apply updates and topology subscription"
sev = 4
regex = '''^(?:Request for enlistment received\.|Attempting to subscribe to TopologyChangeSubscriptionServiceProxy!)$'''
examples = [
    "Request for enlistment received.",
    "Attempting to subscribe to TopologyChangeSubscriptionServiceProxy!",
]
counter_examples = ["Request for enlistment refused."]
