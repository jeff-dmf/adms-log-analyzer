    "(NDS) [Commanding] [FEPActionsExecutor] FEP action(s) successfully sent for execution to FCS example-FrontEnd-Default. There were 1 action(s):",
]
counter_examples = ["(NDS) [Commanding] [DynamicsControl] Action(s) rejected."]

[[template]]
code = "DMD-077"
class = "other"
title = "Tags management delta processing"
sev = 5
regex = '''^\(TAS\) (?=[\[PSD])(?:\[TagsManagementService\] (?:Applying delta\. (?:Delta after the call preprocessing plugin: )?Inserted (?P<inserted>\d+) \| Updated (?P<updated>\d+) \| Deleted (?P<deleted>\d+)|Items dispatched\. Inserted (?P<dispatched_inserted>\d+) \| Updated (?P<dispatched_updated>\d+) \| Deleted (?P<dispatched_deleted>\d+))|Passing delta to tags dispatcher\.|Processing: (?P<insert_ops>\d+) insert operations, (?P<update_ops>\d+) update operations, (?P<delete_ops>\d+) delete operations|\[TagsUpdateNotifier\] Splitting delta by subscribed semantics\.|Splitting delta by subscribed semantics finished\.|Detecting reapplications (?:started\.|finished\. No tags to reapply\.)|\[NotifySubscribers\] Notifying TagsUpdate subscribers by semantic\. Notifications count: (?P<notifications>\d+))$'''
fields = { inserted = "int", updated = "int", deleted = "int" }
examples = [
    { msg = "(TAS) [TagsManagementService] Applying delta. Inserted 1 | Updated 0 | Deleted 2", fields = { inserted = 1, updated = 0, deleted = 2 } },
    "(TAS) [TagsManagementService] Applying delta. Delta after the call preprocessing plugin: Inserted 1 | Updated 0 | Deleted 2",
    "(TAS) [TagsManagementService] Items dispatched. Inserted 1 | Updated 0 | Deleted 2",
    "(TAS) Passing delta to tags dispatcher.",
    "(TAS) Processing: 1 insert operations, 0 update operations, 2 delete operations",
    "(TAS) Detecting reapplications finished. No tags to reapply.",
    "(TAS) [NotifySubscribers] Notifying TagsUpdate subscribers by semantic. Notifications count: 3",
]
counter_examples = ["(TAS) Passing delta to nobody."]

