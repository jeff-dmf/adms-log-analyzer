# Real-time model services (family DMSMODEL): DMS_NetworkModelService, DMS_DynamicsDataService,
# DMS_ModelManagerService, DMS_ReplicationService, DMS_ScheduleManagementService,
# DMS_GDAProxyService and DMS_LandBaseService (normal and sensitive streams).
# Design: docs/notas/rt-templates-desenho.md. Infrastructure lines shared with other real-time
# families (transactions, replication, PubSub, configuration manager, topology) belong to `_dmsrt`.
#
# Codes: DMD-001..049 NetworkModelService, DMD-050..109 DynamicsDataService (+ DMD-S050..S089
# sensitive), DMD-110..149 ModelManagerService (+ DMD-S110..S119), DMD-150..169 ReplicationService,
# DMD-170..184 ScheduleManagementService, DMD-185..189 GDAProxyService, DMD-190..199 LandBaseService.
#
# Correlation keys: none on purpose. The ids of this family are per element (GIDs of model objects,
# versions of the model, transaction GUIDs) and repeat in the millions; they stay as fields.
# Only the exception type of a non-fatal exception is a key (`exc_type`).

schema = 1
family = "DMSMODEL"
description = "DMS_NetworkModelService, DMS_DynamicsDataService, DMS_ModelManagerService, DMS_ReplicationService, DMS_ScheduleManagementService, DMS_GDAProxyService and DMS_LandBaseService of the real-time servers"
extends = ["_dmsrt", "_common"]

# ---------------------------------------------------------------------------------------------
# NetworkModelService (DMD-001..049)
# ---------------------------------------------------------------------------------------------

[[template]]
code = "DMD-001"
class = "other"
title = "Separator line"
sev = 5
fts = false
regex = '''^-{20,}$'''
examples = ["--------------------------------------------------"]
counter_examples = ["---------- not a separator ----------", "-----"]

[[template]]
code = "DMD-002"
class = "statistics"
title = "GDA statistics of a call by model type or property list"
sev = 5
fts = false
regex = '''^\[GDA Statistics\] \[(?P<call>\w+)\] (?P<scope>DMS Type|Properties): (?P<items>.*), Count: (?P<count>\d{1,9})$'''
fields = { count = "int" }
examples = [
    { msg = "[GDA Statistics] [GetDescendentValues] DMS Type: SECTION, Count: 12", fields = { call = "GetDescendentValues", scope = "DMS Type", items = "SECTION", count = 12 } },
    "[GDA Statistics] [GetValues] Properties: IDOBJ_NAME, IDOBJ_LID, Count: 7",
]
counter_examples = ["[GDA Statistics] [GetValues] Properties: IDOBJ_NAME, Count: x"]

[[template]]
code = "DMD-003"
class = "statistics"
title = "GDA statistics call count"
sev = 5
fts = false
regex = '''^\[GDA Statistics\] (?P<call>\w+) call count: (?P<count>\d+)$'''
fields = { count = "int" }
examples = [{ msg = "[GDA Statistics] GetValues call count: 4321", fields = { call = "GetValues", count = 4321 } }]
counter_examples = ["[GDA Statistics] GetValues call count: many"]

[[template]]
code = "DMD-004"
class = "other"
title = "Full text search over a list of filters"
sev = 4
regex = '''^Full text search list on Context with Id = (?P<context_id>\d+)(?: (?P<phase>succeeded|finished))?\. Entity type = (?P<entity>\w+)\. Property = (?P<property>\w+)\. Filter count = (?P<filter_count>\d+)\.$'''
fields = { context_id = "int", filter_count = "int" }
examples = [
    { msg = "Full text search list on Context with Id = 1000123 succeeded. Entity type = EXAMPLETYPE. Property = IDOBJ_CUSTOMID. Filter count = 7.", fields = { context_id = 1000123, phase = "succeeded", entity = "EXAMPLETYPE", filter_count = 7 } },
    "Full text search list on Context with Id = 1000123. Entity type = EXAMPLETYPE. Property = IDOBJ_CUSTOMID. Filter count = 7.",
]
counter_examples = ["Full text search list on Context with Id = x. Entity type = EXAMPLETYPE. Property = IDOBJ_CUSTOMID. Filter count = 7."]

[[template]]
code = "DMD-005"
class = "other"
title = "Full text search with a filter"
sev = 4
window = 400
regex = '''^Full text search on Context with Id = (?P<context_id>\d+)(?: (?P<phase>succeeded))?\. Entity type = (?P<entity>\w+)\. Property = (?P<property>\w+)\. Filter = (?P<filter>.*?)\.(?: Number of AOR groups = (?P<aor_groups>\d+)\.)?(?: Number of results = (?P<results>\d+)\.)?$'''
fields = { context_id = "int", aor_groups = "int", results = "int" }
examples = [
    { msg = "Full text search on Context with Id = 1000123 succeeded. Entity type = EXAMPLETYPE. Property = 0. Filter = ABC-12. Number of AOR groups = 3. Number of results = 41.", fields = { context_id = 1000123, phase = "succeeded", entity = "EXAMPLETYPE", filter = "ABC-12", aor_groups = 3, results = 41 } },
    "Full text search on Context with Id = 1000123. Entity type = EXAMPLETYPE. Property = IDOBJ_NAME. Filter = example.",
]
counter_examples = ["Full text search on Context with Id = x. Entity type = EXAMPLETYPE. Property = 0. Filter = ABC-12."]

[[template]]
code = "DMD-006"
class = "other"
title = "Network view properties request"
sev = 4
regex = '''^Get network view properties(?:: (?P<types>[\w,]+))?(?: (?P<phase>finished))?\.(?: Model version (?P<model_version>\d+(?:\.\d+)?) and client model delta counter (?P<delta_counter>\d+(?:\.\d+)?)\.)?$'''
examples = [
    { msg = "Get network view properties: FEEDER,AORGROUP. Model version 100.200 and client model delta counter 100.300.", fields = { types = "FEEDER,AORGROUP", model_version = "100.200", delta_counter = "100.300" } },
    "Get network view properties finished.",
]
counter_examples = ["Get network view property finished."]

[[template]]
code = "DMD-007"
class = "other"
title = "Internal elements request or result"
sev = 4
regex = '''^Get (?P<scope>all )?internal elements for (?P<gids>\d+) gids, and (?:types (?P<types>[A-Z\d,]*)|(?P<one>[A-Z\d]+) types) ?(?:\.|finished\. Results number: (?P<results>\d+)\.)$'''
fields = { gids = "int", results = "int" }
examples = [
    { msg = "Get internal elements for 89 gids, and types SECTION,FEEDER finished. Results number: 834.", fields = { gids = 89, types = "SECTION,FEEDER", results = 834 } },
    "Get internal elements for 89 gids, and types .",
    "Get all internal elements for 1 gids, and ASIGNAL types finished. Results number: 12.",
]
counter_examples = ["Get internal elements for x gids, and types SECTION."]

[[template]]
code = "DMD-008"
class = "other"
title = "Line direction request"
sev = 4
regex = '''^Get line direction for lines(?= [fw])(?: finished\.| with gids: (?P<gids>[\d,]*)\. Model version (?P<model_version>\d+(?:\.\d+)?) and client model delta counter (?P<delta_counter>\d+(?:\.\d+)?)\.)$'''
examples = [
    { msg = "Get line direction for lines with gids: 1000123. Model version 100.200 and client model delta counter 100.300.", fields = { gids = "1000123", model_version = "100.200", delta_counter = "100.300" } },
    "Get line direction for lines finished.",
]
counter_examples = ["Get line direction for lines started."]

[[template]]
code = "DMD-009"
class = "other"
title = "Feeder equipment by circuit"
sev = 5
regex = '''^Get feeder equipment by circuit - (?=[sf])(?P<phase>started|finished)\.$'''
examples = [{ msg = "Get feeder equipment by circuit - started.", fields = { phase = "started" } }, "Get feeder equipment by circuit - finished."]
counter_examples = ["Get feeder equipment by circuit - failed."]

[[template]]
code = "DMD-010"
class = "other"
title = "Snapshot export step"
sev = 5
regex = '''^\[SNAPSHOT\](?:Saving snapshot chunk (?P<chunk>\d+), dmstype (?P<chunk_type>\w+)|Exporting (?P<exporting>\w+) \.|(?P<exported>\w+) exported\. Count (?P<count>\d+)\. Elapsed (?P<elapsed_s>\d+(?:\.\d+)?)s\.)$'''
fields = { chunk = "int", count = "int", elapsed_s = "float" }
examples = [
    { msg = "[SNAPSHOT]Saving snapshot chunk 118, dmstype SECTION", fields = { chunk = 118, chunk_type = "SECTION" } },
    "[SNAPSHOT]Exporting EXAMPLETYPE .",
    "[SNAPSHOT]EXAMPLETYPE exported. Count 20. Elapsed 1.5s.",
]
counter_examples = ["[SNAPSHOT]Saving snapshot chunk x, dmstype SECTION"]

[[template]]
code = "DMD-011"
class = "error"
title = "LID not found for a GID"
sev = 3
regex = '''^\(WARNING\) Failed to retrieve LID for GID = (?P<gid>(?:0x)?[0-9A-Fa-f]{1,16}), because it doesn't exist in GID to LID mappings\.$'''
fields = { gid = "hex" }
examples = ["(WARNING) Failed to retrieve LID for GID = 0x4A00B00C00D00E02, because it doesn't exist in GID to LID mappings."]
counter_examples = ["(WARNING) Failed to retrieve LID for GID = zz, because it doesn't exist in GID to LID mappings."]

[[template]]
code = "DMD-012"
class = "error"
title = "Values of an entity or resource not obtained"
sev = 2
regex = '''^(?:\(ERROR\) Failed to get values for entity with GID = (?P<gid>(?:0x)?[0-9A-Fa-f]{1,16})\.|Getting values for resource with ID = (?P<resource>(?:0x)?[0-9A-Fa-f]{1,16}) failed\. {1,2}(?:Failed to retrieve LID for GID = (?P<lid_gid>(?:0x)?[0-9A-Fa-f]{1,16})\.|Message from (?P<service>\w+): Exception of type '(?P<exc_type>[\w.]+)' was thrown\.))$'''
examples = [
    { msg = "(ERROR) Failed to get values for entity with GID = 0x4A00B00C00D00E02.", fields = { gid = "0x4A00B00C00D00E02" } },
    "Getting values for resource with ID = 0x4A00B00C00D00E01 failed.  Failed to retrieve LID for GID = 0x4A00B00C00D00E02.",
    { msg = "Getting values for resource with ID = 0x4A00B00C00D00E02 failed. Message from EXS: Exception of type 'Example.Common.ExampleException' was thrown.", fields = { service = "EXS", exc_type = "Example.Common.ExampleException" } },
]
counter_examples = ["(ERROR) Failed to get values for entity with GID = zz."]

[[template]]
code = "DMD-013"
class = "error"
title = "Query on a context failed or asked for invalid ids"
sev = 2
window = 512
regex = '''^(?:\(ERROR\) (?=F)(?:Failed to get (?P<what>descendent values|descendent values properties) from Context with Id = (?P<context_id>\d+)\.|Failed to get related gids for entities\. Data with invalid IDs requested: (?P<related_ids>[\w,x ]*)\.?)|Getting descendent values(?: properties)? failed\. Sources count = (?P<sources>\d+)\. Association depth = (?P<depth>\d+)\. ?(?:Types count = (?P<types_count>\d+)\.)?Data with invalid IDs requested: (?P<ids>[\w,x ]*)\.?)$'''
fields = { context_id = "int", sources = "int", depth = "int", types_count = "int" }
examples = [
    { msg = "(ERROR) Failed to get descendent values from Context with Id = 1000123.", fields = { what = "descendent values", context_id = 1000123 } },
    "Getting descendent values failed. Sources count = 2. Association depth = 1.Data with invalid IDs requested: 0x4A00B00C00D00E02.",
    "Getting descendent values properties failed. Sources count = 2. Association depth = 1. Types count = 3.Data with invalid IDs requested: 0x4A00B00C00D00E02.",
    "(ERROR) Failed to get related gids for entities. Data with invalid IDs requested: 0x4A00B00C00D00E02.",
]
counter_examples = ["(ERROR) Failed to get descendent values from Context with Id = x."]

[[template]]
code = "DMD-014"
class = "error"
title = "Gids or attribute values not obtained for a model version"
sev = 2
regex = '''^\(ERROR\) (?=G)(?P<operation>Getting gids for specified types|Get attribute values) failed\. {1,2}Warning: Failed to get model for specified version (?P<model_version>\d+(?:\.\d+)?) and model delta counter (?P<delta_counter>\d+(?:\.\d+)?)\.$'''
examples = [
    { msg = "(ERROR) Getting gids for specified types failed. Warning: Failed to get model for specified version 100.200 and model delta counter 100.300.", fields = { operation = "Getting gids for specified types", model_version = "100.200" } },
    "(ERROR) Get attribute values failed.  Warning: Failed to get model for specified version 100.200 and model delta counter 100.300.",
]
counter_examples = ["Getting gids for specified types failed."]

[[template]]
code = "DMD-015"
class = "other"
title = "Extract-transform-load step for the external data export"
sev = 5
regex = '''^(?:\[ETL\] (?=[PTG])(?:Prepare data (?:for query with GID: (?P<gid>\d+) started\.|started\. Directory GID: (?P<directory_gid>\d+)|ended\.)|Populate master table \[(?P<table_id>\d+), (?P<dms_type>\w+), (?P<template_kind>[\w ]+)\]\.|Table data for DMS Type \[(?P<table_type>\w+)\] created\.|Getting ETL Directories by external system names (?P<directory_phase>started|ended)\.)|Getting ETL export configuration (?=[fe])(?:for external system names \[(?P<system>\w+)\] started|(?P<config_phase>finished))\.|Release (?P<pool>\w+) - Global: (?P<global_count>\d+), Local: (?P<local_count>\d+)\)\.)$'''
fields = { table_id = "int", global_count = "int", local_count = "int" }
examples = [
    { msg = "[ETL] Populate master table [12, EXAMPLETYPE, Not Template].", fields = { table_id = 12, dms_type = "EXAMPLETYPE", template_kind = "Not Template" } },
    "[ETL] Prepare data for query with GID: 1000123 started.",
    "[ETL] Prepare data started. Directory GID: 1000123",
    "[ETL] Prepare data ended.",
    "[ETL] Table data for DMS Type [EXAMPLETYPE] created.",
    "[ETL] Getting ETL Directories by external system names started.",
    "Getting ETL export configuration for external system names [DA] started.",
    "Getting ETL export configuration finished.",
    "Release ETLEntityPool - Global: 10, Local: 2).",
]
counter_examples = ["[ETL] Prepare data failed.", "Release ETLEntityPool - Global: x, Local: 2)."]

[[template]]
code = "DMD-016"
class = "other"
title = "Model transaction step of the block model and feeder graphs"
sev = 5
regex = '''^(?:Getting (?=[ar])(?P<what>affected|removed) (?P<what_type>Feeders|Transformer Areas) (?P<what_phase>started|ended)\.|(?P<step>Preparing graph data|Feeder graph update|Preparing Transformer Area graph data|Transformer Area graph update|AddInsertedTrAreas|AddUpdatedTrAreas|AddTrAreasInSubsWithRemovedTrAreas|AddTrAreasConnectedWithAffectedFeeders|AddTrAreasConnectedWithRemovedFeeders|Including model changes to context update data|Setting meta tags for blocks in block model|Wait for end of transaction|Applying delta on Block Model) (?P<phase>started|ended|finished)\.?)$'''
examples = [
    { msg = "Getting affected Feeders started.", fields = { what = "affected", what_type = "Feeders", what_phase = "started" } },
    { msg = "Wait for end of transaction finished", fields = { step = "Wait for end of transaction", phase = "finished" } },
    "Applying delta on Block Model finished.",
]
counter_examples = ["Getting affected Feeders failed."]

[[template]]
code = "DMD-017"
class = "other"
title = "Block model delta application"
sev = 5
regex = '''^(?:Applying (?P<deltas>\d+) deltas (?P<phase>started|succeeded)\.|Max Number Of Tasks For Apply Delta Parallel is: \[(?P<max_tasks>\d+)\]|Deserialization completed in (?P<deserialize_ms>\d+) ms\.|Total wait time (?P<wait_kind>due to blockWorkers|for data readiness): (?P<wait_ms>\d+) ms\.|(?P<timing>Validation trigers|Apply update on the block model data|Prepare string properties for validation) time: (?P<timing_ms>\d+) ms\.|Memory usage data (?P<when>before|after) (?P<point>\w+):)$'''
fields = { deltas = "int", max_tasks = "int", deserialize_ms = "int", wait_ms = "int", timing_ms = "int" }
examples = [
    { msg = "Applying 3 deltas started.", fields = { deltas = 3, phase = "started" } },
    "Max Number Of Tasks For Apply Delta Parallel is: [28]",
    "Deserialization completed in 217 ms.",
    "Total wait time due to blockWorkers: 29 ms.",
    "Validation trigers time: 12 ms.",
    "Memory usage data before ApplyDeltas:",
]
counter_examples = ["Applying x deltas started.", "Memory usage data during ApplyDeltas:"]

[[template]]
code = "DMD-018"
class = "other"
title = "Text properties (FTS) update and write lock of the text database"
sev = 5
regex = '''^(?:Updating text properties \(FTS\) for version (?P<version>\d+(?:\.\d+)?)(?: (?P<phase>succeeded))? \(private\)\.|Switch version of text properties \(FTS\) from version (?P<from_version>\d+(?:\.\d+)?) to version (?P<to_version>\d+(?:\.\d+)?)(?: (?P<switch_phase>succeeded))?\.|(?P<action>Inserting new values|Updating existing values|Deleting values) for (?P<entities>\d+) entities\.|(?P<lock>Entering|Exiting) write lock to txt db\.|TextPropertyManager created inside transaction scope\. Concurrent access to txt db will be possible after the transaction is finished\.)$'''
fields = { entities = "int" }
examples = [
    { msg = "Updating text properties (FTS) for version 100.200 succeeded (private).", fields = { version = "100.200", phase = "succeeded" } },
    "Switch version of text properties (FTS) from version 100.200 to version 100.201.",
    "Inserting new values for 5 entities.",
    "Entering write lock to txt db.",
    "TextPropertyManager created inside transaction scope. Concurrent access to txt db will be possible after the transaction is finished.",
]
counter_examples = ["Inserting new values for x entities."]

[[template]]
code = "DMD-019"
class = "other"
title = "Text database statement of the FTS table"
sev = 5
regex = '''^(?:UPDATE idobj_text_fts SET .+ WHERE rowid = @rowId|Created (?:select query|delete queries)\.|Select query executed\.|Affected (?P<rows>\d+) rows\.|Deleted (?:(?P<deleted>\d+) )?values from (?P<table>FTS|Indexed) table\.)$'''
fields = { rows = "int", deleted = "int" }
examples = [
    { msg = "Deleted 5 values from FTS table.", fields = { deleted = 5, table = "FTS" } },
    "Deleted values from FTS table.",
    'UPDATE idobj_text_fts SET "IDOBJ_NAME" =@IDOBJ_NAME WHERE rowid = @rowId',
    "Created select query.",
    "Affected 3 rows.",
]
counter_examples = ["Affected x rows."]

[[template]]
code = "DMD-020"
class = "other"
title = "Model version switch of the context and transaction completion"
sev = 5
sev_field = "outcome"
sev_map = { Aborted = 2, Committed = 5 }
regex = '''^(?:Fixing GID to LID map for model version with ID = (?P<version>\d+(?:\.\d+)?)(?: (?P<phase>succeeded))?\.|Updating contexts on version switch \(current context ID = (?P<context_id>\d+)\) (?P<context_phase>started|ended)\.|Transaction completed(?=[:.])(?:: (?P<outcome>Committed|Aborted)\.|\. Concurrent access to txt database is now available\.))$'''
fields = { context_id = "int" }
examples = [
    { msg = "Fixing GID to LID map for model version with ID = 100.200 succeeded.", fields = { version = "100.200", phase = "succeeded" } },
    "Updating contexts on version switch (current context ID = 1000123) started.",
    { msg = "Transaction completed: Aborted.", fields = { outcome = "Aborted" } },
    "Transaction completed: Committed.",
    "Transaction completed. Concurrent access to txt database is now available.",
]
counter_examples = ["Transaction completed: Rolled back."]

[[template]]
code = "DMD-021"
class = "other"
title = "Creation of the portion of a complete context"
sev = 5
regex = '''^(?:Creating portion for complete context with ID = (?P<context_id>\d+) (?P<phase>started|ended)\.(?: Number of blocks: (?P<blocks>\d+)\.)?|Counting reference number in block model - (?P<count_phase>start|end)|CompareTransactionalModels (?:started\. Model Version: (?P<model_version>\d+(?:\.\d+)?), MDC old: (?P<old_mdc>\d+(?:\.\d+)?), new MDC (?P<new_mdc>\d+(?:\.\d+)?), Elements count: (?P<elements>\d+)|getting blocks finished\.))$'''
fields = { context_id = "int", blocks = "int", elements = "int" }
examples = [
    { msg = "Creating portion for complete context with ID = 1000123 ended. Number of blocks: 40.", fields = { context_id = 1000123, phase = "ended", blocks = 40 } },
    "Counting reference number in block model - start",
    "CompareTransactionalModels started. Model Version: 100.200, MDC old: 100.300, new MDC 100.301, Elements count: 55",
    "CompareTransactionalModels getting blocks finished.",
]
counter_examples = ["Creating portion for complete context with ID = x ended."]

[[template]]
code = "DMD-022"
class = "other"
title = "Connection pool, garbage collection and element listing step"
sev = 5
regex = '''^(?:Initializing connection pool (?:started|finished\. Number of active connections: (?P<connections>\d+))\.?|Disposing connection pool\.\.\.|All found elements without filtering - (?P<listing>start|end)|GC Collect (?:called|ended)\.|\[Feeder Segments\] Getting affected blocks (?P<segments_phase>started|finished)\.)$'''
fields = { connections = "int" }
examples = [
    { msg = "Initializing connection pool finished. Number of active connections: 4.", fields = { connections = 4 } },
    "Initializing connection pool started.",
    "Disposing connection pool...",
    "All found elements without filtering - start",
    "GC Collect called.",
    "[Feeder Segments] Getting affected blocks started.",
]
counter_examples = ["GC Collect failed."]

[[template]]
code = "DMD-023"
class = "other"
title = "Number of operations of a model delta"
sev = 5
regex = '''^(?:Number of (?P<kind>insert|update|delete) operations (?P<count>\d+)\.|Operation: (?P<operation>Insert|Update|Delete)\. Count: (?P<operation_count>\d+)|Examine delta with id (?P<delta_id>\d+(?:\.\d+)?)\.|Setting circuit (?:to (?P<entities>\d+) entities started|finished)\.)$'''
fields = { count = "int", operation_count = "int", entities = "int" }
examples = [
    { msg = "Number of insert operations 12.", fields = { kind = "insert", count = 12 } },
    "Operation: Update. Count: 3",
    "Examine delta with id 100.200.",
    "Setting circuit to 5 entities started.",
    "Setting circuit finished.",
]
counter_examples = ["Number of other operations 12."]

[[template]]
code = "DMD-024"
class = "validation"
title = "Validation of update operations started"
sev = 5
regex = '''^\[AdditionalModelValidationPlugin\] Validation of Update operations started\. Count of entity: (?P<entities>\d+), validators count (?P<validators>\d+)\.$'''
