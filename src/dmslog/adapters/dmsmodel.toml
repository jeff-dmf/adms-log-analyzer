[[template]]
code = "DMD-079"
class = "other"
title = "Item cache configuration, unsupported model type, command monitor report and serving cache"
sev = 4
regex = '''^(?:\(NDS\) \[ItemCacheHelper\] (?=[CW])(?:Cache configuration: Operation timeout (?P<operation_timeout_ms>\d+)ms, Transaction timeout: (?P<transaction_timeout>\w+)\.|WARNING: Not supported model type '(?P<model_type>\w+)' received in processing\.)|\(NDS\) \[CommandMonitor\] Reporting (?P<what>events|alarms) on async notification or timeout\. (?:Events|Alarms) count (?P<count>\d+)|\[AlarmEventCatalogOverrideProvider\] Alarm catalog override not supproted for default custom id: (?P<custom_id>\w+)\.|\[ServingDataProvider\] Detected graph state changed\. Invalidating serving descriptors cache\.)$'''
fields = { operation_timeout_ms = "int", count = "int" }
examples = [
    { msg = "(NDS) [ItemCacheHelper] Cache configuration: Operation timeout 1200000ms, Transaction timeout: Infinite.", fields = { operation_timeout_ms = 1200000, transaction_timeout = "Infinite" } },
    "(NDS) [ItemCacheHelper] WARNING: Not supported model type 'EXAMPLE_TYPE' received in processing.",
    "(NDS) [CommandMonitor] Reporting events on async notification or timeout. Events count 1",
    "[AlarmEventCatalogOverrideProvider] Alarm catalog override not supproted for default custom id: EXAMPLE_ID.",
    "[ServingDataProvider] Detected graph state changed. Invalidating serving descriptors cache.",
]
counter_examples = ["(NDS) [CommandMonitor] Reporting nothing on async notification or timeout."]

