# ---------------------------------------------------------------------------------------------
# DynamicsDataService, normal stream (DMD-050..109)
# ---------------------------------------------------------------------------------------------

[[template]]
code = "DMD-051"
class = "error"
title = "Changeset operation of a trend not found"
sev = 2
text = "(ERROR) HDL DynamicsCache Changeset operation and timestamp not found. Using Update as default operation for trend."
examples = ["(ERROR) HDL DynamicsCache Changeset operation and timestamp not found. Using Update as default operation for trend."]
counter_examples = ["HDL DynamicsCache Changeset operation and timestamp not found."]

[[template]]
code = "DMD-052"
class = "other"
title = "Historical data library of the dynamics or temporary elements cache"
sev = 5
regex = '''^HDL (?=[DT])(?P<cache>DynamicsCache|TemporaryElementsCache) (?:GetValuesWithOperationForInterval (?:called with (?P<gids>\d+) gids, (?P<model_codes>\d+) model codes, time from (?P<from_ts>\S+) to (?P<to_ts>\S+), includePrev (?P<include_prev>True|False), includeNext (?P<include_next>True|False)\.|returned (?P<results>\d+) results for (?P<result_gids>\d+) gids\.)|\[(?P<storage>\w+)\]: Number of deleted (?P<deleted_kind>archived serialized changesets|changesets|elements) with (?:changesets )?ids equal or lower than (?P<changeset_id>\d+) for machineId (?P<machine_id>\d+) and dataset (?P<dataset>\w+) is (?P<deleted>\d+)\.|Connect to file (?P<file>[^,]+), connection readOnly=(?P<read_only>True|False)|DeleteValuesBefore delete file (?P<delete_file>.+) from disk\.)$'''
fields = { gids = "int", results = "int", deleted = "int" }
examples = [
    { msg = "HDL DynamicsCache GetValuesWithOperationForInterval returned 90 results for 1 gids.", fields = { cache = "DynamicsCache", results = 90 } },
    "HDL DynamicsCache GetValuesWithOperationForInterval called with 1 gids, 2 model codes, time from 2026-01-01T05:00:00.0000000Z to 2026-01-01T06:00:00.0000000Z, includePrev True, includeNext False.",
    "HDL TemporaryElementsCache [ElementDALSQLite]: Number of deleted elements with changesets ids equal or lower than 1000123 for machineId 5 and dataset exampleDS is 12.",
    "HDL DynamicsCache [ItemDALSQLite]: Number of deleted changesets with ids equal or lower than 1000123 for machineId 5 and dataset exampleDS is 3.",
    'HDL DynamicsCache Connect to file C:\Example\data\HDL_Example.db, connection readOnly=False',
    'HDL DynamicsCache DeleteValuesBefore delete file C:\Example\data\HDL_Example.db from disk.',
]
counter_examples = ["HDL DynamicsCache GetValuesWithOperationForInterval returned x results for 1 gids."]

[[template]]
code = "DMD-053"
class = "other"
title = "Roll over delay of the counters expired"
sev = 5
fts = false
text = "(BPE) [DOMCountersRolloverModule] Roll Over delay expired."
examples = ["(BPE) [DOMCountersRolloverModule] Roll Over delay expired."]
