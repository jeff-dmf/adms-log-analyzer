class = "validation"
title = "Prediction trace aborted by an energization measurement"
sev = 4  # per-element
regex = '''^Measurement indicating energization, analog GID (?P<gid>(?:0x)?[0-9A-Fa-f]{1,16}), abort prediction trace\.$'''
fields = { gid = "hex" }
examples = ["Measurement indicating energization, analog GID 4A00B00C00D00E01, abort prediction trace."]
counter_examples = ["Measurement indicating energization, analog GID 1, continue prediction trace."]

# ---------------------------------------------------------------------------------------------
# Events
# ---------------------------------------------------------------------------------------------

# The execution thread of a FunctionHost runs one job at a time, so the start and the end of the
# execution are on the same TID (measured). "New job received" arrives on another thread and the
# per-function result line (DFH-005) repeats once per function of the sequence, so neither opens or
# closes the operation. The severity of the result lines carries the outcome of each function; a
# failed calculation inside the job marks the operation fail.
[[operation]]
name = "FunctionHostJob"
start = ["DFH-002"]
end_ok = ["DFH-023"]
fail = ["DFH-071", "DFH-072", "DFH-088", "DFH-089"]
pair_by = ["tid"]
check_key = "job_id"
