# DMS FunctionHost (DMS_FunctionHost_<n>.log): one process per pool slot, the same content in every instance.
# Real-time calculation functions run here (state estimation, load flow, model readiness, ...).
# Ranges (see docs/notas/rt-templates-desenho.md, 1.3): 001-049 host and job, 050-099 model build
# ([EMSBUILD], [EMSCH], [EMSSE], [EMSPI], [EMSRRM], [EMSFC], [EMSBC]), 100-149 [SE],
# 150-189 [LF], [MR], [PU], [SF], [SSV] and other functions, 190-199 generic failures.
# Infrastructure lines shared with other real-time processes live in the _dmsrt library.
# Trace templates ("... trace line") take the rest of a bracket prefix that carries no field worth
# extracting: they refuse any line with a failure marker, so those lines stay for the templates
# that give them a severity (or for the unknown-signature panel).

schema = 1
family = "DMSFH"
description = "DMS FunctionHost: real-time function execution (jobs, model build, state estimation, load flow, ...)"
extends = ["_dmsrt", "_common"]

# ---------------------------------------------------------------------------------------------
# 001-049: host and job
# ---------------------------------------------------------------------------------------------

[[template]]
code = "DFH-001"
class = "start"
title = "Job received for execution"
sev = 4
regex = '''^New job received for execution\. JobID: (?P<job_id>\d+)\. Size of the real-time sequence: (?P<sequence_size>\d+)$'''
fields = { job_id = "int", sequence_size = "int" }
keys = ["job_id"]
examples = [
    { msg = "New job received for execution. JobID: 1000123. Size of the real-time sequence: 3", fields = { job_id = 1000123, sequence_size = 3 } },
]
counter_examples = ["New job received for execution. JobID: x. Size of the real-time sequence: 3"]

[[template]]
code = "DFH-002"
class = "start"
title = "Execution thread started the functions of a job"
sev = 5
fts = false
regex = '''^\[FunctionHostPublisher\]\[ExecutionThreadMethod\] Function execution started for JobID: (?P<job_id>\d+)\.$'''
fields = { job_id = "int" }
keys = ["job_id"]
examples = [
    { msg = "[FunctionHostPublisher][ExecutionThreadMethod] Function execution started for JobID: 1000123.", fields = { job_id = 1000123 } },
]
counter_examples = ["[FunctionHostPublisher][ExecutionThreadMethod] Function execution thread is started."]

[[template]]
code = "DFH-023"
class = "end"
title = "Execution thread finished the functions of a job"
sev = 5
fts = false
regex = '''^\[FunctionHostPublisher\]\[ExecutionThreadMethod\] Function execution finished for JobID: (?P<job_id>\d+)\.$'''
fields = { job_id = "int" }
keys = ["job_id"]
examples = [
    { msg = "[FunctionHostPublisher][ExecutionThreadMethod] Function execution finished for JobID: 1000124.", fields = { job_id = 1000124 } },
]
counter_examples = ["[FunctionHostPublisher][ExecutionThreadMethod] Function execution finished for JobID: x."]

[[template]]
code = "DFH-003"
class = "lifecycle"
title = "Function of the real-time sequence executed"
sev = 5
fts = false
regex = '''^\[FunctionHostPublisher\]\[ExecutionThreadMethod\] Function (?P<function>\w+) is executed\. JobID: (?P<job_id>\d+)\. Index in real-time sequence: (?P<index>\d+)$'''
fields = { job_id = "int", index = "int" }
keys = ["job_id"]
examples = [
    { msg = "[FunctionHostPublisher][ExecutionThreadMethod] Function StateEstimation is executed. JobID: 1000123. Index in real-time sequence: 2", fields = { function = "StateEstimation", job_id = 1000123, index = 2 } },
]
counter_examples = ["[FunctionHostPublisher][ExecutionThreadMethod] Function StateEstimation is executed. JobID: x. Index in real-time sequence: 2"]

[[template]]
code = "DFH-004"
