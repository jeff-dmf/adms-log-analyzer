    "Input builder preparation completed",
]
counter_examples = ["Input builder preparation failed"]

[[template]]
code = "DFH-005"
class = "end"
title = "Job execution finished and result sent"
sev = 4
sev_field = "status"
sev_map = { DoneWithError = 2, Failed = 2, Aborted = 2, Cancelled = 3, DoneWithWarning = 3, DoneWithSuccess = 4 }
regex = '''^Job execution finished successfully\. Callback result sent\. JobID: (?P<job_id>\d+)\. Status: (?P<status>\w+)\.$'''
fields = { job_id = "int" }
keys = ["job_id"]
examples = [
    { msg = "Job execution finished successfully. Callback result sent. JobID: 1000123. Status: DoneWithWarning.", fields = { job_id = 1000123, status = "DoneWithWarning" } },
    "Job execution finished successfully. Callback result sent. JobID: 1000124. Status: DoneWithError.",
]
counter_examples = ["Job execution finished successfully. Callback result sent. JobID: x. Status: DoneWithSuccess."]

