# Real-time job services (family DMSJOB): DMS_JobScheduler, DMS_JobLauncher and
# DMS_JobManagerService (normal and sensitive streams). Design: docs/notas/rt-templates-desenho.md.
#
# Codes: DJB-001..039 Scheduler, DJB-040..079 Launcher, DJB-100..169 JobManagerService normal,
# DJB-S100..S129 JobManagerService sensitive. Correlation keys: `job_id` (the calculation job that
# crosses Scheduler, Launcher, FunctionHost and CoreFunctions), `jms_job` (the asynchronous client
# job of the JobManagerService, not the same number space), `fh_pid` / `new_pid` (FunctionHost
# life-cycle lines only). Infrastructure lines shared with other real-time families belong to
# `_dmsrt`, not to this file.
#
# Job status (section 3.3 of the design note): a line with ONE status maps the severity through
# `sev_map`; a line with a LIST of statuses keeps sev 4 (the failure shows on the single-status line
# of the same `job_id`).

schema = 1
family = "DMSJOB"
description = "DMS_JobScheduler, DMS_JobLauncher and DMS_JobManagerService: scheduling, launching and client jobs of the real-time servers"
extends = ["_dmsrt", "_common"]

# ---------------------------------------------------------------------------------------------
# JobManagerService, sensitive stream (DJB-S100..S129). First in the file: the dispatch tries the
# templates of a key in file order, and these two carry almost all of the stream.
# ---------------------------------------------------------------------------------------------

[[template]]
code = "DJB-S100"
class = "start"
title = "Asynchronous client job started (with the client workstation)"
sev = 4
stream = "sensitive"
regex = '''^Start async job\((?P<job_type>[^)]+)\) called for job with guid (?P<jms_job>[0-9a-fA-F-]{36}) Jobs count: (?P<jobs>\d+) Client session id: (?P<session>[0-9a-fA-F-]{36})\. Hostname: (?P<host>\S+) Endpoint: (?P<endpoint>\S+)$'''
fields = { jms_job = "guid", jobs = "int", session = "guid" }
keys = ["jms_job"]
examples = [{ msg = "Start async job(ExampleBrowserJob) called for job with guid 00000000-0000-4000-8000-000000000013 Jobs count: 4 Client session id: 00000000-0000-4000-8000-000000000014. Hostname: HOST01 Endpoint: 192.0.2.10", fields = { job_type = "ExampleBrowserJob", jms_job = "00000000-0000-4000-8000-000000000013", jobs = 4, host = "HOST01", endpoint = "192.0.2.10" } }]
counter_examples = ["Start async job(ExampleBrowserJob) called for job with guid 00000000-0000-4000-8000-000000000013 Jobs count: 4 Client session id: 00000000-0000-4000-8000-000000000014."]

[[template]]
code = "DJB-S101"
class = "lifecycle"
title = "Concurrent job execution of a user started or completed"
sev = 4
stream = "sensitive"
regex = '''^\[ConcurrentJobExecutionManager:(?P<job_type>\w+)\] (?P<phase>Started new job|Job completed) for {1,2}principal(?:: (?P<user>[^,\s]+) ?)?, concurrent jobs for pri(?:n|ni)cipal: (?P<concurrent>\d+), total jobs running: (?P<running>\d+)\.$'''
fields = { concurrent = "int", running = "int" }
examples = [
    { msg = "[ConcurrentJobExecutionManager:ExampleSummaryJob] Started new job for  principal: EXAMPLE\\user01 , concurrent jobs for principal: 1, total jobs running: 3.", fields = { job_type = "ExampleSummaryJob", phase = "Started new job", user = "EXAMPLE\\user01", concurrent = 1, running = 3 } },
    "[ConcurrentJobExecutionManager:ExampleSummaryJob] Job completed for principal: EXAMPLE\\user01, concurrent jobs for principal: 0, total jobs running: 2.",
    "[ConcurrentJobExecutionManager:ExampleSummaryJob] Started new job for principal, concurrent jobs for prinicipal: 2, total jobs running: 4.",
]
counter_examples = ["[ConcurrentJobExecutionManager:ExampleSummaryJob] Job queued for principal: EXAMPLE\\user01, concurrent jobs for principal: 0, total jobs running: 2."]

# ---------------------------------------------------------------------------------------------
# JobScheduler (DJB-001..039)
# ---------------------------------------------------------------------------------------------

[[template]]
code = "DJB-001"
class = "start"
title = "New job request identifier generated"
sev = 4
regex = '''^New job request identifier is generated\. JobID: (?P<job_id>\d+)$'''
fields = { job_id = "int" }
keys = ["job_id"]
examples = [{ msg = "New job request identifier is generated. JobID: 1000123", fields = { job_id = 1000123 } }]
counter_examples = ["New job request identifier is generated. JobID: x"]

[[template]]
code = "DJB-002"
class = "start"
title = "Scheduler received a new job"
sev = 4
regex = '''^New job is received\. JobID: (?P<job_id>\d+) Function: (?P<function>\w+)$'''
fields = { job_id = "int" }
keys = ["job_id"]
examples = [{ msg = "New job is received. JobID: 1000123 Function: StateEstimation", fields = { job_id = 1000123, function = "StateEstimation" } }]
counter_examples = ["New job received. JobID: 1000123 Function: StateEstimation"]

[[template]]
code = "DJB-003"
class = "req_resp"
title = "Job sent to a Job Launcher (channel)"
sev = 4
regex = '''^Sending JobID: (?P<job_id>\d+) Function: (?P<function>\w+) to Job Launcher ID: (?P<launcher>[0-9a-fA-F-]{36})\. Channel index: (?P<channel>\d+)$'''
fields = { job_id = "int", launcher = "guid", channel = "int" }
keys = ["job_id"]
examples = [{ msg = "Sending JobID: 1000123 Function: LoadFlow to Job Launcher ID: 00000000-0000-4000-8000-000000000001. Channel index: 2", fields = { job_id = 1000123, function = "LoadFlow", channel = 2 } }]
counter_examples = ["Sending JobID: 1000123 Function: LoadFlow to Job Launcher ID: none. Channel index: 2"]

[[template]]
code = "DJB-004"
class = "req_resp"
title = "Job sent to a Job Launcher (confirmation)"
sev = 4
regex = '''^JobID: (?P<job_id>\d+) Function: (?P<function>\w+) is sent to Job Launcher ID: (?P<launcher>[0-9a-fA-F-]{36})\.$'''
fields = { job_id = "int", launcher = "guid" }
keys = ["job_id"]
examples = [{ msg = "JobID: 1000123 Function: LoadFlow is sent to Job Launcher ID: 00000000-0000-4000-8000-000000000001.", fields = { job_id = 1000123, function = "LoadFlow" } }]
counter_examples = ["JobID: 1000123 Function: LoadFlow is queued for Job Launcher ID: 00000000-0000-4000-8000-000000000001."]

[[template]]
code = "DJB-005"
class = "lifecycle"
title = "Scheduler received a job status: Running"
sev = 5
fts = false
regex = '''^\[Scheduler\] JobID: (?P<job_id>\d+) received its status\. Job status: Running\.$'''
fields = { job_id = "int" }
keys = ["job_id"]
examples = [{ msg = "[Scheduler] JobID: 1000123 received its status. Job status: Running.", fields = { job_id = 1000123 } }]
counter_examples = ["[Scheduler] JobID: 1000123 received its status. Job status: DoneWithSuccess."]

[[template]]
code = "DJB-006"
class = "end"
title = "Scheduler received a final job status"
sev = 4
sev_field = "status"
sev_map = { DoneWithError = 2, Failed = 2, Aborted = 2, Cancelled = 3, DoneWithWarning = 3, DoneWithSuccess = 4 }
regex = '''^\[Scheduler\] JobID: (?P<job_id>\d+) received its status\. Job status: (?P<status>(?!Running\.)\w+)\.$'''
fields = { job_id = "int" }
keys = ["job_id"]
examples = [
    { msg = "[Scheduler] JobID: 1000123 received its status. Job status: DoneWithError.", fields = { job_id = 1000123, status = "DoneWithError" } },
    "[Scheduler] JobID: 1000124 received its status. Job status: Cancelled.",
]
counter_examples = ["[Scheduler] JobID: 1000123 received its status. Job status: Running.", "[Scheduler] JobID: 1000123 received its status. Job status: DoneWithSuccess, DoneWithSuccess."]

[[template]]
code = "DJB-007"
class = "end"
title = "Scheduler received a list of job statuses"
sev = 4
regex = '''^(?!.*\b(?:DoneWithError|Failed|Aborted|DoneWithWarning|Cancelled)\b)\[Scheduler\] JobID: (?P<job_id>\d+) received its status\. Job status: (?P<status>\w+, [\w, ]+)\.$'''
fields = { job_id = "int", status = "list" }
keys = ["job_id"]
examples = [{ msg = "[Scheduler] JobID: 1000123 received its status. Job status: DoneWithSuccess, DoneWithSuccess, DoneWithSuccess.", fields = { job_id = 1000123, status = ["DoneWithSuccess", "DoneWithSuccess", "DoneWithSuccess"] } }]
counter_examples = ["[Scheduler] JobID: 1000123 received its status. Job status: DoneWithSuccess."]

[[template]]
code = "DJB-144"
class = "end"
title = "Scheduler received a list of job statuses (with a warning)"
sev = 3
regex = '''^(?!.*\b(?:DoneWithError|Failed|Aborted)\b)(?=.*\b(?:DoneWithWarning|Cancelled)\b)\[Scheduler\] JobID: (?P<job_id>\d+) received its status\. Job status: (?P<status>\w+, [\w, ]+)\.$'''
fields = { job_id = "int", status = "list" }
keys = ["job_id"]
examples = [{ msg = "[Scheduler] JobID: 1000123 received its status. Job status: DoneWithSuccess, DoneWithWarning.", fields = { job_id = 1000123, status = ["DoneWithSuccess", "DoneWithWarning"] } }]
counter_examples = ["[Scheduler] JobID: 1000123 received its status. Job status: DoneWithSuccess."]

[[template]]
code = "DJB-145"
class = "end"
title = "Scheduler received a list of job statuses (with an error)"
sev = 2
regex = '''^(?=.*\b(?:DoneWithError|Failed|Aborted)\b)\[Scheduler\] JobID: (?P<job_id>\d+) received its status\. Job status: (?P<status>\w+, [\w, ]+)\.$'''
fields = { job_id = "int", status = "list" }
keys = ["job_id"]
examples = [{ msg = "[Scheduler] JobID: 1000123 received its status. Job status: DoneWithSuccess, DoneWithError.", fields = { job_id = 1000123, status = ["DoneWithSuccess", "DoneWithError"] } }]
counter_examples = ["[Scheduler] JobID: 1000123 received its status. Job status: DoneWithSuccess."]

[[template]]
code = "DJB-008"
class = "req_resp"
title = "Scheduler sends one job status"
sev = 4
sev_field = "status"
sev_map = { DoneWithError = 2, Failed = 2, Aborted = 2, Cancelled = 3, DoneWithWarning = 3, DoneWithSuccess = 4, Running = 5 }
regex = '''^Sending job status\. JobID: (?P<job_id>\d+), status (?P<status>\w+)\.$'''
fields = { job_id = "int" }
keys = ["job_id"]
examples = [{ msg = "Sending job status. JobID: 1000123, status DoneWithWarning.", fields = { job_id = 1000123, status = "DoneWithWarning" } }]
counter_examples = ["Sending job status. JobID: 1000123, status DoneWithSuccess, DoneWithSuccess."]

[[template]]
code = "DJB-009"
class = "req_resp"
title = "Scheduler sends a list of job statuses"
sev = 4
regex = '''^(?!.*\b(?:DoneWithError|Failed|Aborted|DoneWithWarning|Cancelled)\b)Sending job status\. JobID: (?P<job_id>\d+), status (?P<status>\w+, [\w, ]+)\.$'''
fields = { job_id = "int", status = "list" }
keys = ["job_id"]
examples = [{ msg = "Sending job status. JobID: 1000123, status DoneWithSuccess, DoneWithSuccess.", fields = { job_id = 1000123, status = ["DoneWithSuccess", "DoneWithSuccess"] } }]
counter_examples = ["Sending job status. JobID: 1000123, status DoneWithSuccess."]

[[template]]
code = "DJB-146"
class = "req_resp"
title = "Scheduler sends a list of job statuses (with a warning)"
sev = 3
regex = '''^(?!.*\b(?:DoneWithError|Failed|Aborted)\b)(?=.*\b(?:DoneWithWarning|Cancelled)\b)Sending job status\. JobID: (?P<job_id>\d+), status (?P<status>\w+, [\w, ]+)\.$'''
fields = { job_id = "int", status = "list" }
keys = ["job_id"]
examples = [{ msg = "Sending job status. JobID: 1000123, status DoneWithSuccess, DoneWithWarning.", fields = { job_id = 1000123, status = ["DoneWithSuccess", "DoneWithWarning"] } }]
counter_examples = ["Sending job status. JobID: 1000123, status DoneWithSuccess."]

[[template]]
code = "DJB-147"
class = "req_resp"
title = "Scheduler sends a list of job statuses (with an error)"
sev = 2
regex = '''^(?=.*\b(?:DoneWithError|Failed|Aborted)\b)Sending job status\. JobID: (?P<job_id>\d+), status (?P<status>\w+, [\w, ]+)\.$'''
fields = { job_id = "int", status = "list" }
keys = ["job_id"]
examples = [{ msg = "Sending job status. JobID: 1000123, status DoneWithSuccess, DoneWithError.", fields = { job_id = 1000123, status = ["DoneWithSuccess", "DoneWithError"] } }]
counter_examples = ["Sending job status. JobID: 1000123, status DoneWithSuccess."]

[[template]]
code = "DJB-010"
class = "other"
title = "Job status checked against the info level"
sev = 5
fts = false
regex = '''^Scheduler - DoesJobStatusMatchesInfoLevel: returned: (?P<matches>True|False) for JobID: (?P<job_id>\d+) and InfoLevel (?P<info_level>\w+) \.$'''
fields = { job_id = "int" }
keys = ["job_id"]
examples = [{ msg = "Scheduler - DoesJobStatusMatchesInfoLevel: returned: False for JobID: 1000123 and InfoLevel TaskFinished .", fields = { job_id = 1000123, matches = "False", info_level = "TaskFinished" } }]
counter_examples = ["Scheduler - DoesJobStatusMatchesInfoLevel: returned: Maybe for JobID: 1000123 and InfoLevel TaskFinished ."]

[[template]]
code = "DJB-011"
class = "other"
title = "Job status does not match the info level"
sev = 5
fts = false
text = "[Scheduler] Job status does not match info level."
examples = ["[Scheduler] Job status does not match info level."]
counter_examples = ["[Scheduler] Job status matches info level."]

[[template]]
code = "DJB-012"
class = "other"
title = "Job status callback notification queued"
sev = 5
fts = false
regex = '''^\[Scheduler\] Scheduler - SetJobStatus: job status callback notification (?P<phase>is being enqueued|enqueued); JobID: (?P<job_id>\d+)$'''
fields = { job_id = "int" }
keys = ["job_id"]
examples = [
    { msg = "[Scheduler] Scheduler - SetJobStatus: job status callback notification is being enqueued; JobID: 1000123", fields = { job_id = 1000123, phase = "is being enqueued" } },
    "[Scheduler] Scheduler - SetJobStatus: job status callback notification enqueued; JobID: 1000123",
]
counter_examples = ["[Scheduler] Scheduler - SetJobStatus: job status callback notification dropped; JobID: 1000123"]

[[template]]
code = "DJB-013"
class = "req_resp"
title = "Cancel request received by the Scheduler"
sev = 4
regex = '''^\[Scheduler\] Scheduler - CancelRequestReceived: Processing cancel request; JobID: (?P<job_id>\d+), isWaiting=(?P<is_waiting>\w+), isRunning=(?P<is_running>\w+), isRetrying=(?P<is_retrying>\w+), isPreparing=(?P<is_preparing>\w+), isCanceling=(?P<is_canceling>\w+)\.$'''
fields = { job_id = "int" }
keys = ["job_id"]
examples = [{ msg = "[Scheduler] Scheduler - CancelRequestReceived: Processing cancel request; JobID: 1000123, isWaiting=False, isRunning=True, isRetrying=False, isPreparing=False, isCanceling=False.", fields = { job_id = 1000123, is_running = "True" } }]
counter_examples = ["[Scheduler] Scheduler - CancelRequestReceived: Processing cancel request; JobID: x, isWaiting=False, isRunning=True, isRetrying=False, isPreparing=False, isCanceling=False."]

[[template]]
code = "DJB-014"
class = "req_resp"
title = "Job cancel processed by the Scheduler"
sev = 4
regex = '''^\[Scheduler\] Scheduler - CancelRequestReceived: Job cancel processed; JobID: (?P<job_id>\d+), code=(?P<result>\w+)$'''
fields = { job_id = "int" }
keys = ["job_id"]
examples = [{ msg = "[Scheduler] Scheduler - CancelRequestReceived: Job cancel processed; JobID: 1000123, code=OK", fields = { job_id = 1000123, result = "OK" } }]
counter_examples = ["[Scheduler] Scheduler - CancelRequestReceived: Job cancel pending; JobID: 1000123, code=OK"]

[[template]]
code = "DJB-015"
class = "req_resp"
title = "Job cancel sent through the dispatcher channel"
sev = 4
regex = '''^JobRequestDispatcherChannel - CancelJob: Job cancel (?P<phase>sent); JobID: (?P<job_id>\d+)$|^JobRequestDispatcherChannel - CancelJob: Sending job cancel; JobID: (?P<job_id2>\d+)$'''
fields = { job_id = "int", job_id2 = "int" }
keys = ["job_id", { field = "job_id2", type = "job_id" }]
examples = [
    { msg = "JobRequestDispatcherChannel - CancelJob: Sending job cancel; JobID: 1000123", fields = { job_id2 = 1000123 } },
    { msg = "JobRequestDispatcherChannel - CancelJob: Job cancel sent; JobID: 1000123", fields = { job_id = 1000123 } },
]
counter_examples = ["JobRequestDispatcherChannel - CancelJob: Job cancel failed; JobID: 1000123"]

[[template]]
code = "DJB-016"
class = "req_resp"
title = "Cancel request from a client succeeded"
sev = 4
regex = '''^SubmitJobContract - SelectiveCancelJobRequest: Job cancel succeeded\. JobID: (?P<job_id>\d+)\.$'''
fields = { job_id = "int" }
keys = ["job_id"]
examples = [{ msg = "SubmitJobContract - SelectiveCancelJobRequest: Job cancel succeeded. JobID: 1000123.", fields = { job_id = 1000123 } }]
counter_examples = ["SubmitJobContract - SelectiveCancelJobRequest: Job cancel succeeded. JobID: x."]

[[template]]
code = "DJB-017"
class = "req_resp"
title = "Cancel request received"
sev = 4
regex = '''^Cancel JobID (?P<job_id>\d+) received\.$'''
fields = { job_id = "int" }
keys = ["job_id"]
examples = [{ msg = "Cancel JobID 1000123 received.", fields = { job_id = 1000123 } }]
counter_examples = ["Cancel JobID x received."]

# ---------------------------------------------------------------------------------------------
# JobLauncher (DJB-040..079)
# ---------------------------------------------------------------------------------------------

[[template]]
code = "DJB-040"
class = "req_resp"
title = "Launcher sends one job status to the Scheduler"
sev = 4
fts = false
sev_field = "status"
sev_map = { DoneWithError = 2, Failed = 2, Aborted = 2, Cancelled = 3, DoneWithWarning = 3, DoneWithSuccess = 4, Running = 5 }
regex = '''^Sending job status to JS\. JobID: (?P<job_id>\d+), Status: (?P<status>\w+)$'''
fields = { job_id = "int" }
keys = ["job_id"]
examples = [{ msg = "Sending job status to JS. JobID: 1000123, Status: Running", fields = { job_id = 1000123, status = "Running" } }]
counter_examples = ["Sending job status to JS. JobID: 1000123, Status: DoneWithSuccess, DoneWithSuccess"]

[[template]]
code = "DJB-041"
class = "req_resp"
title = "Launcher sends a list of job statuses to the Scheduler"
sev = 4
fts = false
regex = '''^(?!.*\b(?:DoneWithError|Failed|Aborted|DoneWithWarning|Cancelled)\b)Sending job status to JS\. JobID: (?P<job_id>\d+), Status: (?P<status>\w+, [\w, ]+)$'''
fields = { job_id = "int", status = "list" }
keys = ["job_id"]
examples = [{ msg = "Sending job status to JS. JobID: 1000123, Status: DoneWithSuccess, DoneWithSuccess", fields = { job_id = 1000123, status = ["DoneWithSuccess", "DoneWithSuccess"] } }]
counter_examples = ["Sending job status to JS. JobID: 1000123, Status: Running"]

[[template]]
code = "DJB-148"
class = "req_resp"
title = "Launcher sends a list of job statuses to the Scheduler (with a warning)"
sev = 3
fts = false
regex = '''^(?!.*\b(?:DoneWithError|Failed|Aborted)\b)(?=.*\b(?:DoneWithWarning|Cancelled)\b)Sending job status to JS\. JobID: (?P<job_id>\d+), Status: (?P<status>\w+, [\w, ]+)$'''
fields = { job_id = "int", status = "list" }
keys = ["job_id"]
examples = [{ msg = "Sending job status to JS. JobID: 1000123, Status: DoneWithSuccess, DoneWithWarning", fields = { job_id = 1000123, status = ["DoneWithSuccess", "DoneWithWarning"] } }]
counter_examples = ["Sending job status to JS. JobID: 1000123, Status: DoneWithSuccess"]

[[template]]
code = "DJB-149"
class = "req_resp"
title = "Launcher sends a list of job statuses to the Scheduler (with an error)"
sev = 2
fts = false
regex = '''^(?=.*\b(?:DoneWithError|Failed|Aborted)\b)Sending job status to JS\. JobID: (?P<job_id>\d+), Status: (?P<status>\w+, [\w, ]+)$'''
fields = { job_id = "int", status = "list" }
keys = ["job_id"]
examples = [{ msg = "Sending job status to JS. JobID: 1000123, Status: DoneWithSuccess, DoneWithError", fields = { job_id = 1000123, status = ["DoneWithSuccess", "DoneWithError"] } }]
counter_examples = ["Sending job status to JS. JobID: 1000123, Status: DoneWithSuccess"]

[[template]]
code = "DJB-042"
class = "other"
title = "Job added to the job-process array"
sev = 5
fts = false
regex = '''^\[JobProcessArray\]\[AddJob\] Job with JobID: (?P<job_id>\d+) added to JobProcess array at index: (?P<index>\d+)\. .*$'''
fields = { job_id = "int", index = "int" }
keys = ["job_id"]
examples = [{ msg = "[JobProcessArray][AddJob] Job with JobID: 1000123 added to JobProcess array at index: 3. jobSlotIsNull = True, jobIdCurrentlyInSlot = NotApplicable, processSlotIsNull = False, processIsRestarting = False, totalSlots = 8, isSecondLap = False", fields = { job_id = 1000123, index = 3 } }]
counter_examples = ["[JobProcessArray][AddJob] Job with JobID: x added to JobProcess array at index: 3. jobSlotIsNull = True"]

[[template]]
code = "DJB-043"
class = "other"
title = "Job removed from the job-process array"
sev = 5
fts = false
regex = '''^\[JobProcessArray\]\[RemoveJob\] Job with JobID: (?P<job_id>\d+) on index: (?P<index>\d+) removed from JobProcess array\.$'''
fields = { job_id = "int", index = "int" }
keys = ["job_id"]
examples = [{ msg = "[JobProcessArray][RemoveJob] Job with JobID: 1000123 on index: 3 removed from JobProcess array.", fields = { job_id = 1000123, index = 3 } }]
counter_examples = ["[JobProcessArray][RemoveJob] Job with JobID: 1000123 on index: x removed from JobProcess array."]

[[template]]
code = "DJB-044"
class = "lifecycle"
title = "FunctionHost process added to or removed from the job-process array"
sev = 4
regex = '''^\[JobProcessArray\]\[(?P<action>AddProcess|RemoveProcess)\] (?:New FH process (?P<fh_pid>\d+) is added to jobProcess array|ProcessID: (?P<fh_pid2>\d+) on index: (?P<index2>\d+) removed from JobProcess array)(?: at index: (?P<index>\d+))?\.$'''
fields = { fh_pid = "int", fh_pid2 = "int", index = "int", index2 = "int" }
keys = ["fh_pid", { field = "fh_pid2", type = "fh_pid" }]
examples = [
    { msg = "[JobProcessArray][AddProcess] New FH process 4242 is added to jobProcess array at index: 3.", fields = { action = "AddProcess", fh_pid = 4242, index = 3 } },
    { msg = "[JobProcessArray][RemoveProcess] ProcessID: 4242 on index: 3 removed from JobProcess array.", fields = { action = "RemoveProcess", fh_pid2 = 4242, index2 = 3 } },
]
counter_examples = ["[JobProcessArray][AddProcess] New FH process x is added to jobProcess array at index: 3."]

[[template]]
code = "DJB-045"
class = "statistics"
title = "FunctionHost memory heartbeat (green or yellow)"
sev = 5
fts = false
sev_field = "level"
sev_map = { yellow = 3, green = 5 }
regex = '''^Memory leak (?P<level>green|yellow) level\. ProcessID: (?P<fh_pid>\d+)$'''
fields = { fh_pid = "int" }
examples = [
    { msg = "Memory leak green level. ProcessID: 4242", fields = { level = "green", fh_pid = 4242 } },
    "Memory leak yellow level. ProcessID: 4242",
]
counter_examples = ["Memory leak red level! ProcessID: 4242"]

[[template]]
code = "DJB-046"
class = "error"
title = "FunctionHost memory at the red level"
sev = 2
regex = '''^Memory leak red level! ProcessID: (?P<fh_pid>\d+)$'''
fields = { fh_pid = "int" }
keys = ["fh_pid"]
examples = [{ msg = "Memory leak red level! ProcessID: 4242", fields = { fh_pid = 4242 } }]
counter_examples = ["Memory leak red level. ProcessID: 4242"]

[[template]]
code = "DJB-050"
class = "req_resp"
title = "Execute command sent to a FunctionHost"
sev = 4
fts = false
regex = '''^\[Launcher\] \[ExecuteJob\] Sending Execute command to FH ProcessID: (?P<fh_pid>\d+) \| SlotID: (?P<slot>\d+) \| JobID: (?P<job_id>\d+) \| Function: (?P<function>\w+)$'''
fields = { fh_pid = "int", slot = "int", job_id = "int" }
keys = ["job_id"]
examples = [{ msg = "[Launcher] [ExecuteJob] Sending Execute command to FH ProcessID: 4242 | SlotID: 3 | JobID: 1000123 | Function: StateEstimation", fields = { fh_pid = 4242, slot = 3, job_id = 1000123, function = "StateEstimation" } }]
counter_examples = ["[Launcher] [ExecuteJob] Sending Execute command to FH ProcessID: x | SlotID: 3 | JobID: 1000123 | Function: StateEstimation"]

[[template]]
code = "DJB-052"
class = "start"
title = "Function execution started in the FunctionHost"
sev = 4
fts = false
regex = '''^\[Launcher\] \[ExecuteJob\] DMS function execution started\. JobID: (?P<job_id>\d+) \| Function: (?P<function>\w+) \| ProcessID: (?P<fh_pid>\d+) \| SlotID: (?P<slot>\d+)$'''
