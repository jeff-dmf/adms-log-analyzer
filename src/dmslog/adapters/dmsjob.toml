# ---------------------------------------------------------------------------------------------
# Link rules (section 5.1 of the design note). Keyed by `job_id`, never by thread: in the Launcher
# the start and the end of a job are on different threads and the Scheduler interleaves its jobs.
# ---------------------------------------------------------------------------------------------

# Launcher: the Execute command sent to a FunctionHost -> the last result of that job.
[[link_rule]]
kind = "response"
a = "DJB-050"
b = "DJB-054"
key = "job_id"
max_dt_ms = 60000

# Scheduler: the job sent to a Launcher -> its final status (single or list; "Running" is DJB-005).
[[link_rule]]
kind = "response"
a = "DJB-003"
b = ["DJB-006", "DJB-007", "DJB-144", "DJB-145"]
key = "job_id"
max_dt_ms = 60000

# Launcher: red memory status detected -> the FunctionHost restarted (old PID is `fh_pid` in both).
[[link_rule]]
kind = "response"
a = "DJB-047"
b = "DJB-049"
key = "fh_pid"
max_dt_ms = 60000

# Operations paired by `job_id` (a job crosses threads, so the TID cannot pair it). Scheduler: the job
# sent to a Launcher -> its final status. A single final status goes through `end` (a "Failed" text
# fails it; DoneWithError and Aborted alone stay ok, the status is not visible to the deriver); the
# status lists with an error (DJB-145) fail it. Measured on the RT ERS: no orphan, no overlap.
[[operation]]
name = "SchedulerJob"
start = ["DJB-003"]
end = ["DJB-006"]
end_ok = ["DJB-007", "DJB-144"]
end_fail = ["DJB-145"]
pair_by = ["job_id"]

# Launcher: new job received -> last function result received from a FunctionHost.
[[operation]]
name = "LauncherJob"
start = ["DJB-051"]
end = ["DJB-054"]
pair_by = ["job_id"]
