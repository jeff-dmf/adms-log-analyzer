# Curated filter presets shipped with the app (schema 1). Filters use only template codes of the
# catalog and structural fields (severity, level, event status); never text taken from logs.
# tests/unit/test_presets.py checks every code against the real catalog and every tree against
# the filter validator. One [[preset]] per family and purpose; no family = applies to every case.

schema = 1

[[preset]]
name = "Errors and exceptions"
description = "Critical and error records, unhandled exceptions and schema validation errors."
filter = { or = [{ sev = { le = 2 } }, { tpl = ["GEN-EXC-01", "GEN-XSD-02"] }] }

[[preset]]
name = "Errors and exceptions"
description = "Critical and error records plus the error templates of AWFM."
family = "AWFM"
filter = { or = [{ sev = { le = 2 } }, { tpl = ["WFM-060", "WFM-063", "WFM-064", "WFM-066A", "WFM-066B", "WFM-070A", "WFM-070B", "WFM-070C", "WFM-080", "WFM-081", "WFM-130A", "WFM-130B", "WFM-130C", "GEN-EXC-01", "GEN-XSD-02"] }] }

