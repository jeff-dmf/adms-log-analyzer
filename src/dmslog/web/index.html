<body>
  <a id="skip-link" class="skip-link" href="#grid-viewport" data-i18n="skipToGrid"></a>
  <div id="app">
    <header id="toolbar" class="topbar" role="banner" data-i18n-aria-label="regionBar">
      <span id="app-name" class="app-name" data-i18n="appName"></span>
      <button type="button" id="case-button" class="ui-button topbar-case" data-i18n-title="caseLabel">
        <span id="case-button-label" class="topbar-case-label"></span><span class="topbar-caret" aria-hidden="true"></span>
      </button>
      <form id="search-form" role="search" class="topbar-search">
        <label for="search-input" class="visually-hidden" data-i18n="searchLabel"></label>
        <input id="search-input" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder">
        <button type="submit" class="ui-button" data-i18n="searchButton"></button>
        <button type="button" id="search-clear" class="ui-button is-ghost topbar-clear" data-i18n-aria-label="clearButton" data-i18n-title="clearButton"></button>
      </form>
      <form id="goto-form" class="topbar-goto">
        <label for="goto-input" class="visually-hidden" data-i18n="gotoLabel"></label>
        <input id="goto-input" type="text" autocomplete="off" data-i18n-placeholder="gotoPlaceholder">
        <button type="submit" class="ui-button" data-i18n="gotoButtonShort" data-i18n-aria-label="gotoLabel" data-i18n-title="gotoLabel"></button>
      </form>
      <span class="topbar-spacer"></span>
      <div class="topbar-group" role="group" data-i18n-aria-label="topbarPanels">
        <button type="button" id="filter-tree-button" class="ui-button is-ghost" aria-pressed="false" data-action="toggle.filterTree" data-i18n="actFilterTree"></button>
        <button type="button" id="highlights-button" class="ui-button is-ghost" aria-pressed="false" data-action="toggle.highlights" data-i18n="actHighlights"></button>
        <button type="button" id="bookmarks-button" class="ui-button is-ghost" aria-pressed="false" data-action="toggle.bookmarks" data-i18n="actBookmarks"></button>
        <button type="button" id="alerts-button" class="ui-button is-ghost" aria-pressed="false" data-action="toggle.alerts"><span data-i18n="actAlerts"></span><span id="alerts-count" class="ui-badge topbar-count" hidden></span></button>
      </div>
      <button type="button" id="analyze-button" class="ui-button is-ghost topbar-menu" data-i18n="actGroupAnalyze"></button>
      <button type="button" id="export-button" class="ui-button is-ghost topbar-menu" data-i18n="actGroupExport"></button>
      <button type="button" id="view-button" class="ui-button is-ghost topbar-menu" data-i18n="actGroupView"></button>
      <input type="checkbox" id="follow-tail" hidden tabindex="-1" aria-hidden="true">
    </header>
    <div id="columns-menu" class="menu columns-popover" role="group" data-i18n-aria-label="actColumns" hidden></div>

    <main id="panels">
      <button type="button" id="side-rail" class="side-rail" aria-controls="sources-panel" aria-expanded="false">
        <span class="side-rail-label" data-i18n="panelSources"></span><span id="side-rail-count" class="side-rail-count"></span>
      </button>
      <aside id="sources-panel" class="panel" aria-labelledby="sources-title">
        <h2 id="sources-title" data-i18n="panelSources"></h2>
        <button type="button" id="side-collapse" class="ui-button is-ghost panel-collapse" aria-controls="sources-panel" hidden></button>
        <div id="case-header" class="case-header" hidden>
          <span id="case-header-name" class="case-header-name"></span>
          <button type="button" id="case-add-files" class="ui-button" aria-controls="open-form" data-i18n="caseHeaderAddFiles"></button>
          <button type="button" id="case-header-menu" class="ui-button is-ghost case-header-menu" data-i18n-aria-label="caseMenuLabel" data-i18n-title="caseMenuLabel"></button>
        </div>
        <div id="case-row" class="field-row">
          <label for="case-select" data-i18n="caseLabel"></label>
          <select id="case-select"></select>
        </div>
        <form id="new-case-form" class="stack-form" hidden>
          <label for="new-case-name" class="visually-hidden" data-i18n="newCaseLabel"></label>
          <input id="new-case-name" type="text" autocomplete="off" data-i18n-placeholder="newCaseLabel">
          <div id="case-files-host"></div>
        </form>
        <form id="open-form" class="stack-form" hidden>
          <label for="path-input" class="visually-hidden" data-i18n="pathLabel"></label>
          <input id="path-input" type="text" autocomplete="off" data-i18n-placeholder="pathPlaceholder">
          <div class="inline-form">
            <label for="scope-select" class="visually-hidden" data-i18n="scopeLabel"></label>
            <select id="scope-select"></select>
            <button type="submit" data-i18n="openButton"></button>
          </div>
          <div id="add-files-host" class="add-files"></div>
        </form>
        <section id="collections-host" hidden></section>
        <div id="source-filter-host" class="source-filter"></div>
        <ul id="source-list" class="source-list"></ul>
      </aside>

      <section id="grid-panel" class="panel" aria-labelledby="grid-title">
        <h2 id="grid-title" class="visually-hidden" data-i18n="panelGrid"></h2>
        <div id="collections-note" hidden></div>
        <div id="timeline" class="timeline-host"></div>
        <div id="filter-strip" class="filter-strip" role="group" data-i18n-aria-label="stripLabel">
          <div id="strip-trail" class="fs-trail"></div>
          <span id="strip-state" class="fs-state"></span>
          <div id="strip-chips" class="fs-chips"></div>
          <div id="strip-actions" class="fs-actions">
            <button type="button" id="detail-toggle" class="ui-button is-ghost" aria-controls="detail-panel" aria-expanded="false" data-i18n="railDetail"></button>
            <button type="button" id="strip-filters" class="ui-button is-ghost fs-filters" aria-controls="filter-form"></button>
          </div>
          <form id="filter-form" class="filter-bar" hidden>
            <div class="field">
              <label for="sev-select" data-i18n="stripSeverity"></label>
              <select id="sev-select"></select>
            </div>
            <div class="field">
              <label for="from-input" data-i18n="filterFrom"></label>
              <input id="from-input" type="text" autocomplete="off" data-i18n-placeholder="filterTimePlaceholder">
            </div>
            <div class="field">
              <label for="to-input" data-i18n="filterTo"></label>
              <input id="to-input" type="text" autocomplete="off" data-i18n-placeholder="filterTimePlaceholder">
            </div>
            <label class="toggle"><input type="checkbox" id="hide-noise"> <span data-i18n="filterHideNoise"></span></label>
            <label class="toggle"><input type="checkbox" id="unclassified-only"> <span data-i18n="filterUnclassified"></span></label>
            <details class="fs-advanced">
              <summary data-i18n="stripAdvanced"></summary>
              <div class="field">
                <label for="level-select" data-i18n="filterLevel"></label>
                <select id="level-select"></select>
              </div>
            </details>
            <button type="submit" data-i18n="filterApply"></button>
            <button type="button" id="filter-reset" data-i18n="filterReset"></button>
          </form>
        </div>
        <div id="grid-header" class="grid-header" role="row"></div>
        <div id="grid-viewport" class="grid-viewport" role="grid" tabindex="0" data-i18n-aria-label="panelGrid">
          <div id="grid-rows" class="grid-rows"></div>
          <div id="grid-spacer" class="grid-spacer" aria-hidden="true"></div>
        </div>
        <button type="button" id="follow-new" class="follow-new" hidden></button>
        <section id="dock" class="ui-dock" data-i18n-aria-label="dockLabel" hidden></section>
      </section>

      <aside id="detail-panel" class="panel" aria-labelledby="detail-title">
        <h2 id="detail-title" data-i18n="panelDetail"></h2><button type="button" id="detail-collapse" class="ui-button is-ghost panel-collapse" aria-controls="detail-panel" hidden></button>
        <div id="detail-empty" class="ui-empty"></div>
        <div id="detail-meta" class="detail-meta"></div>
        <div id="detail-actions" class="detail-actions" hidden>
          <label for="context-same" class="visually-hidden" data-i18n="contextSame"></label>
          <select id="context-same" class="ui-select"></select>
          <button type="button" id="context-button" class="ui-button is-ghost"></button>
          <button type="button" id="copy-button" class="ui-button is-ghost"></button>
          <button type="button" id="compare-button" class="ui-button is-ghost"></button>
          <button type="button" id="bookmark-button" class="ui-button is-ghost" aria-pressed="false"></button>
          <button type="button" id="highlight-button" class="ui-button is-ghost" aria-expanded="false"></button>
          <span id="copy-status" class="source-meta" role="status"></span>
        </div>
        <button type="button" id="detail-template" class="tpl-link-button" hidden></button>
        <pre id="detail-text" class="detail-text"></pre>
        <section id="detail-knowledge" class="detail-knowledge" data-i18n-aria-label="knowMeansTitle" hidden></section>
        <div id="detail-fields" class="detail-fields"></div>
        <section id="detail-keys" class="detail-keys" data-i18n-aria-label="lnkKeysTitle" hidden></section>
        <section id="detail-links" class="detail-links" data-i18n-aria-label="lnkTitle" hidden></section>
        <section id="detail-payload" class="detail-payload" data-i18n-aria-label="plTitle" hidden></section>
        <section id="detail-bookmark" class="detail-bookmark" data-i18n-aria-label="bmDetailTitle" hidden></section>
        <div id="context-box" class="context-box" hidden>
          <div class="context-head">
            <h3 data-i18n="contextTitle"></h3>
            <button type="button" id="context-close" data-i18n="contextClose"></button>
          </div>
          <ul id="context-list" class="context-list"></ul>
        </div>
      </aside>
    </main>
    <footer id="status-bar" class="ui-statusbar"></footer>
  </div>
</body>
