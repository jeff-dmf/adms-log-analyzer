[[out_of_scope]]
family = "OASERR"
reason = "oasErrLog: host error log, not an adapter."

[[out_of_scope]]
family = "SERVICE"
reason = "Service framework logs (dnaService, ProcessMonitor, arb*): not adapters."

[[out_of_scope]]
family = "NMC"
reason = "Other ERS log, optional scope."

[[out_of_scope]]
family = "PSENGINE"
reason = "Other ERS log, optional scope."

[[out_of_scope]]
family = "ARBIP"
reason = "Other ERS log, optional scope."

[[out_of_scope]]
family = "SHUTDOWN"
reason = "Shutdown reason logs, not adapters."

[[out_of_scope]]
