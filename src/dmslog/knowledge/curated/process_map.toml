# Process -> acronym map for the in-scope adapters (ARQUITETURA U8, U11; ROADMAP 3.7).
#
# source = "vault"    the adms-v3.9 vault states the process name for this acronym
#                     (usually the "Application" row of the Deployment Specification or a
#                     configuration note).
# source = "curated"  no vault statement; the mapping follows families.toml and the adapter
#                     name in adapters.json. The note gives the justification.
#
# Ambiguous or conflicting cases are NOT guessed: they go under [[unresolved]].
# Families that are not adapters go under [[out_of_scope]].
# Checked by tests/unit/test_process_map.py.

[[process]]
name = "WfmAdapter"
acronym = "AWFM"
adapter = "WFM Adapter"
source = "vault"
note = "WfmAdapter named in the AWFM configuration notes."

[[process]]
name = "OntAdapter"
acronym = "AONT"
adapter = "OMN Adapter"
source = "vault"
note = "AONT Deployment Specification names the application AdapterONT (ONT = OMN); OntAdapter is listed in the vault SMAN usage events."

[[process]]
name = "AVLAdapter"
acronym = "AAVL"
adapter = "AVL Adapter"
source = "vault"
note = "AAVL Deployment Specification: Application = AVLAdapter."

[[process]]
name = "OsrAdapter"
acronym = "AOSR"
adapter = "OSR Adapter"
source = "vault"
note = "AOSR Deployment Specification names AdapterOSR; OsrAdapter is named in the AOSR configuration notes."

[[process]]
name = "SmnAdapter"
acronym = "ASMN"
adapter = "SMN Adapter"
source = "vault"
note = "ASMN Deployment Specification names AdapterSMN; SmnAdapter is listed in the vault SMAN usage events."

[[process]]
name = "SiteSwitchAdapter"
acronym = "ASSS"
adapter = "SSS Adapter"
source = "curated"
note = "The vault names the adapter SSS (Seamless Site Switch) but not the process name; families.toml maps SiteSwitchAdapter to ASSS."

[[process]]
name = "CrmAdapter"
acronym = "ACRM"
adapter = "CRM Adapter"
source = "vault"
note = "ACRM Deployment Specification: Application = CrmAdapter."

[[process]]
name = "AmiAdapter"
acronym = "AAMI"
adapter = "AMI Adapter"
source = "vault"
note = "AAMI Deployment Specification: Application = AmiAdapter."

[[process]]
name = "SmrAdapter"
acronym = "ASMR"
adapter = "SMR Adapter"
source = "vault"
note = "ASMR Deployment Specification: Application = SmrAdapter."

[[process]]
name = "WDIAdapter"
acronym = "AWMI"
family = "AWDI"
adapter = "WDI Adapter"
source = "vault"
note = "AWMI Deployment Specification: Application = WDIAdapter. families.toml uses the family code AWDI for this process (`family` key); the resolver translates it to the vault acronym."

[[process]]
name = "ClaimCheckAdapter"
acronym = "ACLC"
adapter = "CC Adapter"
source = "vault"
note = "ACLC Deployment: Application = ClaimCheckAdapter."

[[process]]
name = "FileUploadAdapter"
acronym = "AFUP"
adapter = "File Uploading Adapter"
source = "vault"
note = "FileUploadAdapter named in the AFUP Interface Configuration."

[[process]]
name = "FileMonitorAdapter"
acronym = "AFMO"
adapter = "File Monitoring Adapter"
source = "vault"
note = "AFMO Deployment: Application = FileMonitorAdapter."

[[process]]
name = "BLTHost"
acronym = "BLTHOST"
adapter = ""
source = "curated"
note = "Host log, not an adapter, so it has no adapters.json entry; BLTHOST is the families.toml family code. The process name is stated in the vault."

[[process]]
name = "CustomAdapterChangeIncidentDevice"
acronym = "ACID"
family = "AEDP"
adapter = "Change Incident Device Adapter"
source = "vault"
note = "families.toml uses AEDP as the family code for this adapter (the vault acronym is ACID). ACID Index lists CustomAdapterChangeIncidentDevice as an alias of the Change Incident Device Interface (Custom)."

