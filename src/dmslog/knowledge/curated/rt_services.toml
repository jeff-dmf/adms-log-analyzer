# Real-time (RT) services and processes: the link between a process as it appears in the logs, its
# family, its template code ranges, its correlation keys and (when the vault has one) the number of its
# section. Identifiers only: no text of the vault. Source of the pack file rt_services.json
#. Checked by tests/unit/test_rt_services_curated.py.
#
# process   process name as in the log file name; DMS_FunctionHost is the pool (instances _<n> resolve to it)
# group     core | model_db | model_management | calculation | oms | platform | tool
# codes     template ranges of the service inside the family file (PFX-NNN..NNN, PFX-SNNN..SNNN, PFX-SNNN)
# keys      correlation keys emitted by the templates of those ranges
# related   other RT services and the key that links them (a key of this service or "handoff")
# vault     { doc, note, section }: note file name and section number; "absent" when the vault has none

version = 1

[[service]]
process = "DMS_FunctionHost"
family = "DMSFH"
group = "calculation"
codes = ["DFH-001..199"]
keys = ["job_id"]
vault = { doc = "SARC", note = "SARC 5.4.3 RealTime Service.md", section = "5.4.3.4.3" }

[[service]]
process = "DMS_JobScheduler"
family = "DMSJOB"
group = "calculation"
codes = ["DJB-001..039"]
keys = ["job_id"]
related = [{ process = "DMS_JobLauncher", via = "job_id" }, { process = "DMS_CoreFunctionsService", via = "job_id" }, { process = "DMS_FunctionHost", via = "job_id" }]
vault = { doc = "SARC", note = "SARC 5.4.3 RealTime Service.md", section = "5.4.3.4.1" }

