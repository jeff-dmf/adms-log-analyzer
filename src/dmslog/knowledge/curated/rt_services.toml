keys = ["job_id", "fh_pid", "new_pid"]
related = [{ process = "DMS_JobScheduler", via = "job_id" }, { process = "DMS_FunctionHost", via = "handoff" }]
vault = { doc = "SARC", note = "SARC 5.4.3 RealTime Service.md", section = "5.4.3.4.2" }

