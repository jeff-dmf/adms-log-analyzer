# ---------------------------------------------------------------------------
# 2. Host and system logs that are in the default scope
# ---------------------------------------------------------------------------

[[rule]]
family = "BLTHOST"
layout = "blthost"
envelope = "adms"
scope = "default"

[[rule]]
family = "OASERR"
layout = "single"
process = "oasErrLog"
envelope = "oaserr"
scope = "default"

# Service logs of the service that hosts the adapters: dnaService.<svc>, ProcessMonitor.<svc>,
# dnaHealthMonitor.<svc>, arbRx/arbTx/arbMonitor.exe.<svc>.
[[rule]]
family = "SERVICE"
layout = "service"
process = 'dnaService|ProcessMonitor|dnaHealthMonitor|arbRx|arbTx|arbMonitor\.exe'
envelope = "adms"
scope = "service"

# Service framework logs without a service in the name: listed, optional.
[[rule]]
family = "SERVICE"
layout = "single"
process = 'dnaServiceAutoStart|dnaServiceFailover|dnaServiceStartup|arbSetState|arbState|arbinfo|ArbitrationStateMonitor'
envelope = "adms"
scope = "optional"

# ---------------------------------------------------------------------------
# 3. Other ERS logs: listed and indexable at the generic level, off by default
# ---------------------------------------------------------------------------

[[rule]]
family = "NMC"
layout = "single"
process = "NMC"
envelope = "adms"
scope = "optional"

[[rule]]
family = "PSENGINE"
pattern = '(?:^|/)(?P<process>PSengine(?:\.ALTERNATE_\d+)?)\.log(?:\.(?P<rotation>\d+))?$'
envelope = "adms"
scope = "optional"

[[rule]]
family = "ARBIP"
layout = "pidlog"
process = "arbIP"
envelope = "adms"
scope = "optional"

[[rule]]
family = "SHUTDOWN"
layout = "pidlog"
process = "ServiceShutdown"
envelope = "plain"
scope = "optional"

[[rule]]
family = "SHUTDOWN"
pattern = '(?:^|/)(?P<process>[A-Za-z0-9]+_LastShutdownReason)\.log(?:\.(?P<rotation>\d+))?$'
envelope = "plain"
scope = "optional"

# Installer, hotfix and snapshot logs.
[[rule]]
family = "INSTALL"
pattern = '(?:^|/)(?:Deployment/Logs|ADMS/scripts/InstallationLogs)/(?:[^/]+/)*[^/]+\.(?:log|txt)$'
envelope = "plain"
scope = "optional"

# ERS tool logs.
[[rule]]
family = "ERS"
pattern = '(?:^|/)(?P<process>ERS|ERSEngine)\.log(?:\.(?P<rotation>\d+))?$'
envelope = "adms"
scope = "optional"

# Real-time (RT) servers: the DMS_* and OMS_* services of any DMS_* service folder other than the integration one
# (DMS_REALTIME, ...), in the default scope. DMSFH: the instances of the job pool. Some of them sit in a subfolder of the service folder (Context-<id>/).
# DMS_FunctionHost_<n> numbers an instance of the pool, it is not a process id: the number stays in the process name.
[[rule]]
family = "DMSFH"
pattern = '(?:^|/)(?P<account>dnaApp_[^/]+)/(?P<service>(?!DMS_INTEGRATION/)DMS_[A-Za-z0-9_]+)/(?:[^/]+/)*(?P<process>DMS_FunctionHost_\d+)(?P<sensitive>\.sensitive)?\.log(?:\.(?P<rotation>\d+))?$'
envelope = "adms"
scope = "default"

# Pools of identical processes: one stream per instance (derivation stays per instance); the viewer groups them.
# Read-time annotation only: the stored process name and the stream identity do not change.
[[pool]]
name = "DMS_FunctionHost"
family = "DMSFH"
process = 'DMS_FunctionHost_(?P<instance>[1-9]\d{0,3})'

# The services of the RT servers, by what they do (one family, one template file each). Anything else called
# DMS_* or OMS_* falls into DMSRT below. Jobs: scheduling and launching of the calculation jobs.
[[rule]]
family = "DMSJOB"
pattern = '(?:^|/)(?P<account>dnaApp_[^/]+)/(?P<service>(?!DMS_INTEGRATION/)DMS_[A-Za-z0-9_]+)/(?:[^/]+/)*(?P<process>(?:DMS_JobScheduler|DMS_JobLauncher|DMS_JobManagerService))_(?P<pid>\d+)(?P<sensitive>\.sensitive)?\.log(?:\.(?P<rotation>\d+))?$'
envelope = "adms"
scope = "default"

# Model and calculation infrastructure: operational model, changesets, context, forecast, export.
[[rule]]
family = "DMSCORE"
pattern = '(?:^|/)(?P<account>dnaApp_[^/]+)/(?P<service>(?!DMS_INTEGRATION/)DMS_[A-Za-z0-9_]+)/(?:[^/]+/)*(?P<process>(?:DMS_CoreFunctionsService|DMS_ModelTopologyService|DMS_ChangesetRepositoryService|DMS_ModelPromotionService|DMS_GraphicalModelService|DMS_GenericCalculationService|DMS_LoadForecastService|DMS_LocalContextManager|DMS_ContextCoordinatorService|DMS_ExportService|DMS_ControlSequenceManagementService))_(?P<pid>\d+)(?P<sensitive>\.sensitive)?\.log(?:\.(?P<rotation>\d+))?$'
envelope = "adms"
scope = "default"

# Network model, dynamics data, replication and the proxies to the data sources.
[[rule]]
family = "DMSMODEL"
pattern = '(?:^|/)(?P<account>dnaApp_[^/]+)/(?P<service>(?!DMS_INTEGRATION/)DMS_[A-Za-z0-9_]+)/(?:[^/]+/)*(?P<process>(?:DMS_NetworkModelService|DMS_ModelManagerService|DMS_DynamicsDataService|DMS_ReplicationService|DMS_GDAProxyService|DMS_LandBaseService|DMS_ScheduleManagementService))_(?P<pid>\d+)(?P<sensitive>\.sensitive)?\.log(?:\.(?P<rotation>\d+))?$'
envelope = "adms"
scope = "default"

# Outage, incident, crew and work management, major events, smart meters and alarms and events.
[[rule]]
family = "DMSOMS"
pattern = '(?:^|/)(?P<account>dnaApp_[^/]+)/(?P<service>(?!DMS_INTEGRATION/)DMS_[A-Za-z0-9_]+)/(?:[^/]+/)*(?P<process>(?:OMS_IncidentManagementService|OMS_CrewManagementService|DMS_OutageProcessingService|DMS_WorkManagementService|DMS_MajorEventService|DMS_SmartMeterManagementService|DMS_AlarmsEventsService))_(?P<pid>\d+)(?P<sensitive>\.sensitive)?\.log(?:\.(?P<rotation>\d+))?$'
envelope = "adms"
scope = "default"

[[rule]]
family = "DMSRT"
pattern = '(?:^|/)(?P<account>dnaApp_[^/]+)/(?P<service>(?!DMS_INTEGRATION/)DMS_[A-Za-z0-9_]+)/(?:[^/]+/)*(?P<process>(?:DMS|OMS)_[A-Za-z][A-Za-z0-9]*)_(?P<pid>\d+)(?P<sensitive>\.sensitive)?\.log(?:\.(?P<rotation>\d+))?$'
envelope = "adms"
scope = "default"

# Process logs under dnaApp_<account>/<service>/ that are not an adapter of the scope
# (DMS_ReplicationService, NDSProxy, adapters outside the 1.0 scope, ...), also in a subfolder of the service folder.
[[rule]]
family = "PROCESS"
pattern = '(?:^|/)(?P<account>dnaApp_[^/]+)/(?P<service>[^/]+)/(?:[^/]+/)*(?P<process>[A-Za-z][A-Za-z0-9_]*?)_(?P<pid>\d+)(?P<sensitive>\.sensitive)?\.log(?:\.(?P<rotation>\d+))?$'
envelope = "adms"
scope = "optional"

# Any other <Process>_<pid>.log (ConfigTool, cscscript, EventEngine, WMIPublisher, ...).
[[rule]]
family = "PROCESS"
pattern = '(?:^|/)(?P<process>[A-Za-z][A-Za-z0-9_]*?)_(?P<pid>\d+)(?P<sensitive>\.sensitive)?\.log(?:\.(?P<rotation>\d+))?$'
envelope = "adms"
scope = "optional"

# Any other text log of the Servers/Log folder (AdminPager, CMXREPBulkClient, RCS.Default, ...).
[[rule]]
family = "SERVERLOG"
pattern = '(?:^|/)(?P<process>[^/]+?)\.log(?:\.(?P<rotation>\d+))?$'
envelope = "adms"
scope = "optional"

# ---------------------------------------------------------------------------
# 4. Not text logs: configuration, scripts, binaries, event logs and databases.
#    Listed as "not indexed" (the Registry and other XML are read by the
#    knowledge layer, not indexed as logs).
# ---------------------------------------------------------------------------

[[rule]]
family = "NONLOG"
pattern = '\.(?:xml|xsd|xsl|xslt|xmlold\d*|config|sql|csc|init|html?|dll|exe|jpe?g|png|gif|ico|evtx|etl|blg|db3|db3-wal|db3-shm|dmp|dat|old|example|zip|csv)$'
envelope = "plain"
scope = "optional"
indexable = false

# Plain-text reports (computer_info, audit lists): readable, generic, off by default.
[[rule]]
family = "REPORT"
pattern = '\.txt$'
envelope = "plain"
scope = "optional"

# ---------------------------------------------------------------------------
# Generic envelopes (format detection for logs outside the 1.0 scope).
#
# A file whose first lines match neither built-in envelope (adms, oaserr) would be
# read as `plain` (one record per line, no time). Each [[envelope]] below is tried
# then, and only then: built-in detections never change. The one with most header
# lines in the sample (first 50 lines / 64 KiB) wins, ties in file order, provided
# it reaches both thresholds; otherwise the file stays `plain`.
#
# Fields:
#   name         stored in source.envelope; lowercase snake_case, not adms/oaserr/plain.
#                Treat it as stable: a case indexed with it resumes through this name.
#   header       regex (ASCII, must start with ^) matched against the start of the
#                line, BOM and end of line excluded, at most 512 bytes. Required named
#                groups: year (4 digits), month, day, hour, minute, second; optional:
#                ms (fraction, first 3 digits used), pid, tid, level, process.
#                Restricted grammar (bytes semantics, at most 1000 characters):
#                literals (\t, \xHH, escaped punctuation; '{' only as \{); classes of
#                literals, ranges and \d only (no negation, no \s \w \S \W \D, no '.');
#                a greedy repeat {m,n}/{n}/{,n}/? (1 <= n <= 64) applies to ONE literal or
#                class; groups (?P<name>...) and (?:...) at most 2 deep, the only repeat
#                of a group being '?' (at most 4, not nested, never empty); no
#                alternation, no anchor but the leading ^, no look-arounds, comments or
#                flags. Checked on the text as written, before compiling.
#                Every choice is decided by the next byte: a variable repeat or an
#                optional group may not start like what follows it nor end the header.
#                Put a separator at the END of an optional group: '(?:\[TID=n\] )?LEVEL'.
#                The time is the local log time, as for the built-in envelopes.
#   tid_base     10 (default) or 16
#   levels       table {TOKEN = "ADMS level"} added to the defaults (DEBUG = DEBUGLOG,
#                WARN = WARNING, TRACE = VERBOSE, ...); tokens compare case-insensitively
#   min_lines    header lines needed in the sample (default 2; fewer when the sample is shorter)
#   min_ratio    share of the non-blank sampled lines that must be headers (default 0.2)
#   examples     header lines (synthetic) the loader checks, including that appending
#                text to them never changes the parsed header
# ---------------------------------------------------------------------------

# .NET tool and installer logs: `DD.MM.YYYY HH:MM:SS.mmm [TID=n] [LEVEL] - msg`.
[[envelope]]
name = "dmy_tid_level"
description = "DD.MM.YYYY time [TID=n] [LEVEL] - message"
header = '^(?P<day>\d\d)\.(?P<month>\d\d)\.(?P<year>\d{4}) (?P<hour>\d\d):(?P<minute>\d\d):(?P<second>\d\d)\.(?P<ms>\d{3}) \[TID=(?P<tid>\d{1,10})\] \[(?P<level>[A-Za-z]{1,11}) {0,8}\] - '
examples = [
    "15.10.2026 13:04:05.123 [TID=12] [DEBUG] - Starting step",
    "01.02.2026 00:00:00.000 [TID=1] [INFO ] - x",
    "31.12.2025 23:59:59.999 [TID=4096] [WARN ] - ",
]

# ERS collection tool: `YYYY.MM.DD HH:MM:SS.mmm      LEVEL: msg` (level right-aligned).
[[envelope]]
name = "ymd_level_colon"
description = "YYYY.MM.DD time LEVEL: message"
header = '^(?P<year>\d{4})\.(?P<month>\d\d)\.(?P<day>\d\d) (?P<hour>\d\d):(?P<minute>\d\d):(?P<second>\d\d)\.(?P<ms>\d{3}) {1,16}(?P<level>[A-Za-z]{1,11}): '
examples = [
    "2026.10.15 13:04:05.123          INFO: Collecting files",
    "2026.10.15 13:04:05.124         ERROR: Access denied",
]

# Shutdown reason logs: `YYYY-MM-DD HH:MM:SS.mmm: msg`.
[[envelope]]
name = "ymd_colon"
description = "YYYY-MM-DD time: message"
header = '^(?P<year>\d{4})-(?P<month>\d\d)-(?P<day>\d\d) (?P<hour>\d\d):(?P<minute>\d\d):(?P<second>\d\d)\.(?P<ms>\d{3}): '
examples = ["2026-10-15 13:04:05.123: Service stopped by request"]

# ---------------------------------------------------------------------------
# Fallback: anything that matched no rule above.
# ---------------------------------------------------------------------------

[fallback]
family = "UNKNOWN"
envelope = "plain"
scope = "optional"
indexable = true
