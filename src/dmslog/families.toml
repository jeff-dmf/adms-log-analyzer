# U11: in the 1.0 scope with its own analysis (format: docs/formato/aedp.md). The vault
# calls it ACID; AEDP is the family code used here.
[[rule]]
family = "AEDP"
layout = "adapter"
process = "CustomAdapterChangeIncidentDevice"
envelope = "adms"
scope = "default"
anchor = true

# ---------------------------------------------------------------------------
# 2. Host and system logs that are in the default scope
# ---------------------------------------------------------------------------

[[rule]]
family = "BLTHOST"
layout = "blthost"
envelope = "adms"
scope = "default"

[[rule]]
family = "OASERR"
layout = "single"
process = "oasErrLog"
envelope = "oaserr"
scope = "default"

# Service logs of the service that hosts the adapters: dnaService.<svc>, ProcessMonitor.<svc>,
# dnaHealthMonitor.<svc>, arbRx/arbTx/arbMonitor.exe.<svc>.
[[rule]]
family = "SERVICE"
layout = "service"
process = 'dnaService|ProcessMonitor|dnaHealthMonitor|arbRx|arbTx|arbMonitor\.exe'
envelope = "adms"
scope = "service"

# Service framework logs without a service in the name: listed, optional.
[[rule]]
family = "SERVICE"
layout = "single"
process = 'dnaServiceAutoStart|dnaServiceFailover|dnaServiceStartup|arbSetState|arbState|arbinfo|ArbitrationStateMonitor'
envelope = "adms"
scope = "optional"

# ---------------------------------------------------------------------------
# 3. Other ERS logs: listed and indexable at the generic level, off by default
# ---------------------------------------------------------------------------

[[rule]]
family = "NMC"
layout = "single"
process = "NMC"
envelope = "adms"
scope = "optional"

[[rule]]
family = "PSENGINE"
layout = "single"
process = "PSengine"
envelope = "adms"
scope = "optional"

[[rule]]
family = "ARBIP"
layout = "pidlog"
process = "arbIP"
envelope = "adms"
scope = "optional"

[[rule]]
family = "SHUTDOWN"
layout = "pidlog"
process = "ServiceShutdown"
envelope = "plain"
scope = "optional"

[[rule]]
family = "SHUTDOWN"
pattern = '(?:^|/)(?P<process>[A-Za-z0-9]+_LastShutdownReason)\.log(?:\.(?P<rotation>\d+))?$'
envelope = "plain"
scope = "optional"

# Installer, hotfix and snapshot logs.
[[rule]]
family = "INSTALL"
pattern = '(?:^|/)(?:Deployment/Logs|ADMS/scripts/InstallationLogs)/(?:[^/]+/)*[^/]+\.(?:log|txt)$'
envelope = "plain"
scope = "optional"

# ERS tool logs.
[[rule]]
family = "ERS"
pattern = '(?:^|/)(?P<process>ERS|ERSEngine)\.log(?:\.(?P<rotation>\d+))?$'
envelope = "adms"
scope = "optional"

# Process logs under dnaApp_<account>/<service>/ that are not an adapter of the scope
# (DMS_ReplicationService, NDSProxy, adapters outside the 1.0 scope, ...).
[[rule]]
family = "PROCESS"
pattern = '(?:^|/)(?P<account>dnaApp_[^/]+)/(?P<service>[^/]+)/(?P<process>[A-Za-z][A-Za-z0-9_]*?)_(?P<pid>\d+)(?P<sensitive>\.sensitive)?\.log(?:\.(?P<rotation>\d+))?$'
envelope = "adms"
scope = "optional"

# Any other <Process>_<pid>.log (ConfigTool, cscscript, EventEngine, WMIPublisher, ...).
[[rule]]
family = "PROCESS"
pattern = '(?:^|/)(?P<process>[A-Za-z][A-Za-z0-9_]*?)_(?P<pid>\d+)(?P<sensitive>\.sensitive)?\.log(?:\.(?P<rotation>\d+))?$'
envelope = "adms"
scope = "optional"

# Any other text log of the Servers/Log folder (AdminPager, CMXREPBulkClient, RCS.Default, ...).
[[rule]]
family = "SERVERLOG"
pattern = '(?:^|/)(?P<process>[^/]+?)\.log(?:\.(?P<rotation>\d+))?$'
envelope = "adms"
scope = "optional"

# ---------------------------------------------------------------------------
# 4. Not text logs: configuration, scripts, binaries, event logs and databases.
#    Listed as "not indexed" (the Registry and other XML are read by the
#    knowledge layer, not indexed as logs).
# ---------------------------------------------------------------------------

[[rule]]
family = "NONLOG"
pattern = '\.(?:xml|xsd|xsl|xslt|xmlold\d*|config|sql|csc|init|html?|dll|exe|jpe?g|png|gif|ico|evtx|etl|blg|db3|db3-wal|db3-shm|dmp|dat|old|example|zip|csv)$'
envelope = "plain"
scope = "optional"
indexable = false

# Plain-text reports (computer_info, audit lists): readable, generic, off by default.
[[rule]]
family = "REPORT"
pattern = '\.txt$'
envelope = "plain"
scope = "optional"

# ---------------------------------------------------------------------------
# Fallback: anything that matched no rule above.
# ---------------------------------------------------------------------------

[fallback]
family = "UNKNOWN"
envelope = "plain"
scope = "optional"
indexable = true
