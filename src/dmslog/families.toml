# Source classification, driven by data (docs/ARQUITETURA.md, section 9.1a).
#
# Each [[rule]] maps a logical member path (POSIX separators, relative to the zip,
# folder or file that was opened) to a family. Rules are tried IN FILE ORDER and the
# FIRST match wins, so a specific rule must appear before a generic one. A path that
# matches nothing becomes the UNKNOWN family (see [fallback]).
#
# Rule fields:
#   family    family code stored in stream.family (open text; a new family is a new rule)
#   envelope  expected line envelope: adms | oaserr | plain or a name from [[envelope]]
#             (a hint for empty files; detection by majority decides)
#   scope     default  -> in the default scope
#             service  -> in the default scope only when its service hosts an anchor adapter
#                         (falls back to default when the source has no anchor at all)
#             optional -> listed, indexed only when the user selects it
#   anchor    true on adapter rules: their service marks "the service of the adapter"
#   indexable false for files that are not text logs (listed as "not indexed")
#   layout    name of a [layouts] pattern; `process` is substituted into its {process} slot
#   pattern   a full regular expression instead of layout/process
#
# Patterns are regular expressions, case-insensitive, searched against the logical path.
# Recognised named groups: account, service, process, pid, sensitive, rotation.
# Use TOML literal strings (single quotes) so backslashes need no escaping.

[layouts]
# <Process>_<pid>[.sensitive].log[.N], optionally under dnaApp_<account>/<service>/
adapter = '(?:^|/)(?:(?P<account>dnaApp_[^/]+)/(?P<service>[^/]+)/)?(?P<process>{process})_(?P<pid>\d+)(?P<sensitive>\.sensitive)?\.log(?:\.(?P<rotation>\d+))?$'
# BLTHost.<service>[.sensitive].log[.N]
blthost = '(?:^|/)(?P<process>BLTHost)\.(?P<service>[^/.]+)(?P<sensitive>\.sensitive)?\.log(?:\.(?P<rotation>\d+))?$'
# <Process>.<service>.log[.N] (service logs)
service = '(?:^|/)(?P<process>{process})\.(?P<service>[A-Za-z0-9_]+)\.log(?:\.(?P<rotation>\d+))?$'
# <Process>.log[.N] (single instance, no service)
single = '(?:^|/)(?P<process>{process})\.log(?:\.(?P<rotation>\d+))?$'
# <Process>_<pid>.log[.N] anywhere
pidlog = '(?:^|/)(?P<process>{process})_(?P<pid>\d+)\.log(?:\.(?P<rotation>\d+))?$'

