[project]
name = "dmslog"
version = "0.1.0"
description = "Log analyzer and viewer for ADMS adapters (online interfaces)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "ruff", "hypothesis"]

[project.scripts]
dmslog = "dmslog.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dmslog = ["families.toml", "store/*.sql", "store/*.toml", "web/**/*", "adapters/*.toml", "knowledge/curated/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "packaging"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
