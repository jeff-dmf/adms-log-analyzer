name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  portable-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python packaging/build_portable.py
      - name: Smoke test da pasta portátil (sem o Python do runner no PATH do app)
        shell: cmd
        run: |
          dist\dmslog-portable-win64\dmslog.bat --version
          dist\dmslog-portable-win64\python\python.exe -I -c "import sqlite3, zipfile, http.server, dmslog; print(sqlite3.sqlite_version)"
      - uses: actions/upload-artifact@v4
        with:
          name: dmslog-portable-win64
          path: dist/dmslog-portable-win64.zip
