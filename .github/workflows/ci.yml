name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository (artifacts use the runner token implicitly).
permissions:
  contents: read

# A new push to the same PR cancels the run of the superseded commit (main is never cancelled).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only pull requests (docs/**, *.md at the root) skip the heavy jobs: they show up as "skipping".
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          # Fail closed: "code" stays true unless every changed path (renames split into old and new) is docs.
          echo "code=true" >> "$GITHUB_OUTPUT"
          [ "$EVENT" = "pull_request" ] || exit 0
          git diff --name-only -z --no-renames "$BASE" "$HEAD_SHA" > "$RUNNER_TEMP/changed.bin"
          python3 - "$RUNNER_TEMP/changed.bin" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          paths = [p for p in open(sys.argv[1], "rb").read().decode("utf-8", "surrogateescape").split("\0") if p]
          docs = bool(paths) and all(p.startswith("docs/") or ("/" not in p and p.endswith(".md")) for p in paths)
          print("code=false" if docs else "code=true")
          PY

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.code != 'false'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
        if: needs.changes.outputs.code != 'false'
      - run: ruff check
        if: needs.changes.outputs.code != 'false'
      - run: ruff format --check
        if: needs.changes.outputs.code != 'false'
      - name: Guard - no knowledge pack tracked (ARQUITETURA D10)
        if: needs.changes.outputs.code != 'false'
        run: python packaging/check_no_pack.py
      - run: python -m pytest -q -n auto
        if: needs.changes.outputs.code != 'false'

  test-py311:
    name: test-py311 (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.code != 'false'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
        if: needs.changes.outputs.code != 'false'
      - run: ruff check
        if: needs.changes.outputs.code != 'false'
      - run: python -m pytest -q -n auto
        if: needs.changes.outputs.code != 'false'

  pyz-linux:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.code != 'false'
        with:
          python-version: "3.13"
      - name: Build dmslog.pyz and the Linux tarball
        if: needs.changes.outputs.code != 'false'
        run: python packaging/build_linux.py
      - name: Guard - no knowledge pack in the artifacts (ARQUITETURA D10)
        if: needs.changes.outputs.code != 'false'
        run: python packaging/check_no_pack.py --artifact dist/dmslog.pyz dist/dmslog-linux.tar.gz
      - name: Smoke test the zipapp
        if: needs.changes.outputs.code != 'false'
        shell: bash
        run: |
          python3 -I dist/dmslog.pyz --version
          python3 -I dist/dmslog.pyz info | tee info.txt
          grep -q "^fts5: yes" info.txt
          grep -q "^knowledge pack: not installed" info.txt
          python packaging/smoke_health.py python3 -I dist/dmslog.pyz
          python packaging/smoke_ingest.py python3 -I dist/dmslog.pyz
      - name: Smoke test the tarball launcher
        if: needs.changes.outputs.code != 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/linux-unpacked"
          tar -xzf dist/dmslog-linux.tar.gz -C "$RUNNER_TEMP/linux-unpacked"
          "$RUNNER_TEMP/linux-unpacked/dmslog-linux/dmslog" --version
          python packaging/smoke_health.py "$RUNNER_TEMP/linux-unpacked/dmslog-linux/dmslog"
          python packaging/smoke_ingest.py "$RUNNER_TEMP/linux-unpacked/dmslog-linux/dmslog"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.code != 'false'
        with:
          name: dmslog-linux
          path: |
            dist/dmslog.pyz
            dist/dmslog-linux.tar.gz

  portable-windows:
    runs-on: windows-latest
    needs: changes
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.code != 'false'
        with:
          python-version: "3.13"
      - run: python packaging/build_portable.py
        if: needs.changes.outputs.code != 'false'
      - name: Guard - no knowledge pack in the portable folder and zip (ARQUITETURA D10)
        if: needs.changes.outputs.code != 'false'
        run: >-
          python packaging/check_no_pack.py --artifact dist/dmslog-portable-win64
          dist/dmslog-portable-win64.zip dist/dmslog.pyz
      - name: Smoke test the portable folder (embeddable Python, not the runner Python)
        if: needs.changes.outputs.code != 'false'
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "dist\dmslog-portable-win64"
          & "$dir\dmslog.bat" --version
          if ($LASTEXITCODE -ne 0) { throw "dmslog.bat --version failed" }
          & "$dir\python\python.exe" -I -c "import sqlite3, zipfile, http.server; print(sqlite3.sqlite_version)"
          if ($LASTEXITCODE -ne 0) { throw "embeddable Python stdlib check failed" }
          $info = & "$dir\dmslog.bat" info
          if ($LASTEXITCODE -ne 0) { throw "dmslog.bat info failed" }
          $info
          if (-not ($info -match "^fts5: yes")) { throw "FTS5 missing in the embeddable Python" }
          if (-not ($info -match "^knowledge pack: not installed")) { throw "the public build must not ship a pack" }
      - name: Smoke test dmslog.bat serve (health, token, cookie, FTS5)
        if: needs.changes.outputs.code != 'false'
        shell: pwsh
        run: |
          python packaging/smoke_health.py (Join-Path $PWD "dist\dmslog-portable-win64\dmslog.bat")
          if ($LASTEXITCODE -ne 0) { throw "serve smoke test failed" }
      - name: Smoke test dmslog.bat ingest + serve (zip fixture, one page, one entry)
        if: needs.changes.outputs.code != 'false'
        shell: pwsh
        run: |
          python packaging/smoke_ingest.py (Join-Path $PWD "dist\dmslog-portable-win64\dmslog.bat")
          if ($LASTEXITCODE -ne 0) { throw "ingest smoke test failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.code != 'false'
        with:
          name: dmslog-portable-win64
          path: dist/dmslog-portable-win64.zip
