# Dependabot: version updates and (with the repository setting) security updates.
# dmslog has NO runtime dependencies (stdlib only) and vendors its front-end assets
# (src/dmslog/web/vendor/, checked by checksum in tests): the ecosystems below cover the CI actions
# and the dev tools. Vendored uPlot and the embeddable Python of the portable build are reviewed by
# hand when a release is prepared (see docs/ARQUITETURA.md section 14).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps"
    groups:
      dev-tools:
        patterns: ["*"]
        update-types: ["minor", "patch"]
